<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Check list SO">
<meta name="theme-color" content="#ffffff">
<title>Check list SO · UNB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{
  --bg:#ffffff; --card:#f4f4f4; --ink:#000; --muted:#707070; --line:#dddddd;
  --accent:#000; --accent-ink:#fff; --blue:#2189ff;
  --s-new:#8f8f8f; --s-prod:#f28c00; --s-ready:#2189ff; --s-partial:#7a5af8; --s-done:#00a862;
  --danger:#e4002b;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1b1b1b; --ink:#fff; --muted:#a0a0a0; --line:#333; --accent:#fff; --accent-ink:#000; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"Inter",-apple-system,sans-serif;font-variant-numeric:tabular-nums;font-size:.92em;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(var(--safe-t) + 14px) 20px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.15}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;font-size:18px;font-weight:700}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--s-done)} .dot.warn{background:var(--s-prod)}
.search{margin-top:14px;position:relative}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:0;background:var(--card);font-size:16px;outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--ink)}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink);font-weight:700}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:12px 0 12px;background:var(--card);border-radius:16px;padding:4px}
.chips .chip{border:0;background:none;border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap}
.chips .chip b{font-size:21px;font-weight:800;line-height:1.15;color:var(--ink);font-family:"Inter",-apple-system,sans-serif}
.chips .chip.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chips .chip.red b{color:var(--danger)}
.chips .chip.green b{color:var(--s-done)}

main{padding:20px 16px calc(var(--safe-b) + 100px);max-width:780px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat{background:var(--card);border-radius:20px;padding:16px 14px}
.stat .n{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em;font-family:"Inter",-apple-system,sans-serif}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat.alert .n{color:var(--danger)}

.po{background:var(--card);border-radius:24px;margin-bottom:12px;overflow:hidden}
.po-h{display:flex;align-items:center;gap:12px;padding:18px 20px 16px;width:100%;border:0;background:none;text-align:left}
.po-h .t{flex:1;min-width:0}
.po-h .num{font-weight:800;font-size:18px;letter-spacing:-.01em}
.po-h .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--ink)}
.chev{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;transition:transform .2s;flex:none}
.po.closed .chev{transform:rotate(-90deg)}
.po.closed .rows{display:none}
.rows{padding:0 10px 10px}
.row{display:block;width:100%;border:0;border-radius:16px;background:var(--bg);text-align:left;padding:14px 14px;margin-top:6px}
.row:first-child{margin-top:0}
.row:active{transform:scale(.99)}
.r1{display:flex;gap:10px;align-items:flex-start}
.spec{flex:1;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{flex:none;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.r2{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.r2 .late{color:var(--danger);font-weight:700}
.qty{color:var(--ink);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:56px 16px}
.empty .big{font-size:40px}
.notice{background:var(--card);border-radius:16px;padding:12px 16px;font-size:13px;margin-bottom:16px;color:var(--muted)}

.fab{position:fixed;right:20px;bottom:calc(var(--safe-b) + 20px);z-index:20;height:52px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}
.fab b{font-size:22px;font-weight:400;line-height:1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 20px calc(var(--safe-b) + 20px);max-width:780px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sheet .meta{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.seg button{border:1px solid var(--ink);background:none;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600}
.seg button.on{color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--muted);font-weight:600;padding-left:4px}
.f input,.f textarea,.f select{width:100%;border:0;background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none;min-height:48px;outline:none}
.f input:focus,.f textarea:focus{box-shadow:0 0 0 2px var(--ink)}
.f textarea{min-height:72px;resize:vertical}
.stepper{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;background:var(--card)}
.stepper button{width:52px;border:0;background:none;font-size:22px}
.stepper input{background:none!important;text-align:center;min-width:0;font-weight:700;box-shadow:none!important}
.hint{font-size:12px;color:var(--muted);padding-left:4px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions+.actions{margin-top:8px}
.btn{flex:1;border:1px solid var(--ink);background:none;border-radius:999px;padding:13px 16px;font-weight:700;font-size:14.5px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:none;color:var(--ink);border-color:var(--ink)}
.btn.del{color:var(--danger);border-color:transparent}
.menu .btn{display:flex;width:100%;text-align:left;margin-bottom:8px;font-weight:600;background:var(--card);border-color:transparent;border-radius:16px;padding:16px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.confirm{display:none;background:var(--card);border-radius:16px;padding:14px;margin-top:12px;font-size:14px;font-weight:600}
.confirm.on{display:block}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:4px;margin-top:14px}
.tabs button{border:0;background:none;border-radius:999px;padding:9px 6px;font-weight:700;font-size:14.5px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.tabs button b{font-weight:700;opacity:.6;margin-left:4px}
.so{display:flex;align-items:stretch;background:var(--card);border-radius:20px;margin-bottom:8px;overflow:hidden}
.so.checked{opacity:.55}
.so-check{flex:none;width:58px;border:0;background:none;display:grid;place-items:center}
.box{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--bg)}
.so.checked .box{background:var(--s-done);border-color:var(--s-done);color:#fff}
.so-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:14px 16px 14px 0}
.so-main .t1{display:flex;gap:8px;align-items:center}
.so-main .sono{flex:1;font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.so.checked .sono{text-decoration:line-through}
.so-main .amt{font-weight:700;font-family:"Inter",-apple-system,sans-serif;font-variant-numeric:tabular-nums;margin-top:2px}
.link-po{color:var(--blue);font-weight:600}
.typebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.typebar.one{grid-template-columns:1fr}
.typebar{margin-top:2px}
.typesel select{padding:9px 34px 9px 14px;font-size:15px}
.typesel{position:relative;flex:1}
.typesel select{width:100%;-webkit-appearance:none;appearance:none;border:1.5px solid var(--ink);background:var(--bg);border-radius:999px;padding:10px 40px 10px 16px;font-size:16px;font-weight:700;color:var(--ink);outline:none}
.typesel::after{content:"▼";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.files{display:flex;flex-direction:column;gap:6px}
.fileitem{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px}
.fileitem a{flex:1;min-width:0;color:var(--ink);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileitem .fdel{border:0;background:none;color:var(--muted);font-size:14px;font-weight:700;padding:4px 6px;border-radius:999px;white-space:nowrap}
.fileitem .fdel.arm{background:var(--danger);color:#fff;padding:4px 10px}
.attach{width:100%;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px;font-weight:700;margin-top:6px}
.pdfbar{display:flex;gap:8px;margin-bottom:14px}
.pdfbar .btn{flex:1;background:var(--card);border-color:transparent;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.ex{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.ex.off{opacity:.45}
.ex-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ex-h input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.ex-h b{flex:1;font-size:16px}
.ex .grid .f input{background:var(--bg)}
.ex-items{font-size:12.5px;color:var(--muted);margin-top:8px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);background:none;border-radius:20px;padding:16px 18px;transition:.15s}
.drop:active,.drop.over{background:var(--card);border-color:var(--ink)}
.drop-ic{font-size:30px}
.drop b{font-size:15px}
.dropcover{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;text-align:center;border:3px dashed var(--ink);margin:10px;border-radius:28px;font-size:18px;pointer-events:none}
.dropcover.on{display:flex}
.lines{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.ln{display:flex;gap:8px;font-size:13px;line-height:1.35}
.ln .q{flex:none;font-weight:700;min-width:44px;text-align:right;font-family:"Inter",-apple-system,sans-serif}
.ln .s{flex:1;min-width:0}
.ln .c{display:block;font-size:11.5px;color:var(--muted);font-family:"Inter",-apple-system,sans-serif}
.ln .a{flex:none;color:var(--muted);font-family:"Inter",-apple-system,sans-serif;font-size:12.5px}
.so-lines{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.so-lines .more{font-size:12.5px;color:var(--muted);margin-top:2px}
.ltable{background:var(--card);border-radius:16px;padding:12px 14px}
.ltable .ln{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ltable .ln:first-child{border-top:0}
.pdfbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;margin-top:8px}
.fileitem .fview{flex:1;min-width:0;border:0;background:none;text-align:left;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0}
.viewer{position:fixed;inset:0;z-index:60;background:#2b2b2b;display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer-h{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 14px 10px;background:#111;color:#fff}
.viewer-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.viewer-h button,.viewer-h a{border:0;background:#fff;color:#000;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;text-decoration:none}
.viewer-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.viewer-b canvas{width:100%;max-width:900px;background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.viewer-b .msg{color:#ddd;margin-top:40px;text-align:center}
.lchk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:none;display:grid;place-items:center;font-size:14px;font-weight:800;color:transparent;padding:0;margin-top:-2px}
.lchk.on{background:var(--s-done);border-color:var(--s-done);color:#fff}
.ln.done .s,.ln.done .q{text-decoration:line-through;color:var(--muted)}
.ln .tick{flex:none;width:16px;color:var(--s-done);font-weight:800}
.sum{margin-top:10px;border-top:1.5px solid var(--ink);padding-top:8px;font-size:14px}
.sum .r{display:flex;justify-content:space-between;padding:2px 0}
.sum .r span:last-child{font-family:"Inter",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.sum .r.total{font-weight:800;font-size:16px;padding-top:4px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;font-weight:700}
.prog .bar{flex:1;margin:0}
.donebtn{width:100%;margin-top:10px;border:0;background:var(--s-done);color:#fff;border-radius:999px;padding:11px;font-weight:700}
.fileitem .od{flex:none;font-size:12.5px;font-weight:700;text-decoration:none;color:#0364b8;border:0;background:none;padding:2px 4px;white-space:nowrap}
.fileitem .od.up{color:var(--muted)}
.odbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}
.odbar a{color:#0364b8;font-weight:700;text-decoration:none}
.navseg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:0 0 12px}
.navseg a{flex:1;text-align:center;padding:7px 3px;border-radius:9px;font-size:clamp(12px,3.4vw,14px);font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.navseg a.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ===== Calm theme (shared tokens with KPI app) ===== */
:root,:root[data-x]{color-scheme:light;--bg:#f5f4f1;--card:#fff;--ink:#2b2f31;--muted:#5d6366;--line:#e3e0da;--line2:#d4d0c8;
 --accent:#2e6b67;--accent-ink:#fff;--acc-soft:#e4efed;--acc-ink:#24564f;--blue:#2f6aa0;
 --s-new:#7d8285;--s-prod:#b06a12;--s-ready:#2f6aa0;--s-partial:#6a5aa5;--s-done:#2f7a51;--danger:#a8432f;
 --r1:6px;--r2:10px;--r3:14px;--sh:0 1px 2px rgba(43,40,32,.05);--f:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#f5f4f1;--card:#fff;--ink:#2b2f31;--muted:#5d6366;--line:#e3e0da;--accent:#2e6b67;--accent-ink:#fff}}
html,body{font-family:var(--f)!important;font-size:15.5px;line-height:1.55;font-feature-settings:"tnum" 1;letter-spacing:0}
.mono,.chips .chip b,.stat .n,.so-main .amt,.ln .q,.ln .c,.ln .a,.sum .r span:last-child{font-family:var(--f)!important;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--bg)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom:1px solid var(--line)}
.navseg{background:none;border-radius:0;padding:0;margin:0 0 16px;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.navseg::-webkit-scrollbar{display:none}
.navseg a{flex:0 0 auto;border-radius:0;padding:12px 10px 11px;margin-bottom:-1px;font-size:15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;box-shadow:none!important;background:none!important}
.navseg a:hover{color:var(--ink)}
.navseg a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
@media(max-width:480px){.navseg{gap:0}.navseg a{flex:1 0 auto;padding:12px 6px 11px;font-size:14px}}
.top h1{font-size:30px;font-weight:600;letter-spacing:0;line-height:1.25}
@media(min-width:720px){.top h1{font-size:34px}}
.sync{font-size:13px;color:var(--muted)}
.iconbtn{border-radius:var(--r2);background:var(--card);border:1px solid var(--line)}
.search input{border-radius:var(--r2);background:var(--card);border:1px solid var(--line);font-size:16px}
.search input:focus{box-shadow:none;border-color:var(--accent)}
.search span{color:var(--muted)}
.tabs{background:var(--card);border:1px solid var(--line);border-radius:var(--r2)}
.tabs button{border-radius:var(--r1);font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.chips{background:var(--card);border:1px solid var(--line);border-radius:var(--r3)}
.chips .chip{border-radius:var(--r2)}
.chips .chip b{font-weight:600}
.chips .chip.on{background:var(--acc-soft);box-shadow:none}
.stat,.po,.so,.ex,.ltable,.notice,.fileitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh)}

const thDate=s=>{if(!s)return'';const [y,m,d]=s.split('-').map(Number);if(!y)return s;const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d+' '+M[m-1]+' '+String((y+543)%100).padStart(2,'0')};

/* ---------- Microsoft 365 sign-in + SharePoint storage (list 'Sale KPI', type so/del · files in Documents/Check list SO) ---------- */
const CFG={clientId:'73241ae0-9aa1-49fe-b2c7-caa2449a0091',tenantId:'410b700e-bb2a-46d2-b4c0-449aec007d0e',siteUrl:'https://unboffice.sharepoint.com/sites/ITPortal'};
const SCOPES=['User.Read','Sites.ReadWrite.All'],SP_LIST='Sale KPI',SP_DIR='Check list SO';
let msalApp=null,account=null,siteId='',listId='',driveId='',me='',errMsg='',spFolderUrl='';
const spIds={},spChain={};
async function token(){
  try{return (await msalApp.acquireTokenSilent({scopes:SCOPES,account})).accessToken}
  catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES,account});throw e}}
async function g(path,opt={}){
  const t=await token();const headers={Authorization:'Bearer '+t,...(opt.headers||{})};let body=opt.body;
  if(opt.json!==undefined){headers['Content-Type']='application/json';body=JSON.stringify(opt.json)}
  let r;
  for(let a=0;;a++){
    r=await fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{method:opt.method||'GET',headers,body});
    if(![429,500,502,503,504].includes(r.status)||a>=4)break;
    const ra=+r.headers.get('Retry-After');await new Promise(z=>setTimeout(z,ra>0?Math.min(ra,10)*1000:600*(a+1)));
  }
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(_){};const e=new Error(m||('HTTP '+r.status));e.status=r.status;throw e}
  if(opt.raw)return r;
  return r.status===204?null:r.json();
}
const spErr=e=>({code:e&&(e.status===401||e.status===403)?'invalid_argument':e&&(e.status===429||e.status>=500)?'unavailable':'error',message:e&&e.message});
async function spSet(c,k,body){
  const key=c+'/'+k;const run=async()=>{
    const fields={Title:(c==='so'?'SO-':'DEL-')+k,Data:JSON.stringify({type:c==='so'?'so':'del',key:k,v:body})};
    try{const rid=spIds[key];
      if(rid)await g(`/sites/${siteId}/lists/${listId}/items/${rid}/fields`,{method:'PATCH',json:fields});
      else{const it=await g(`/sites/${siteId}/lists/${listId}/items`,{method:'POST',json:{fields}});spIds[key]=it.id}
    }catch(e){if(e&&e.status===404&&spIds[key]){delete spIds[key];return run()}throw spErr(e)}};
  const p=(spChain[key]||Promise.resolve()).then(run,run);spChain[key]=p.catch(()=>{});return p;
}
async function spDel(c,k){
  const key=c+'/'+k;const run=async()=>{const rid=spIds[key];if(!rid)return;
    try{await g(`/sites/${siteId}/lists/${listId}/items/${rid}`,{method:'DELETE'})}catch(e){if(e.status!==404)throw spErr(e)}delete spIds[key]};
  const p=(spChain[key]||Promise.resolve()).then(run,run);spChain[key]=p.catch(()=>{});return p;
}
const db={collection:c=>({doc:k=>({set:b=>spSet(c,k,b),delete:()=>spDel(c,k)})})};
async function spLoad(){
  const ni={},ns={},best={};
  let next=`/sites/${siteId}/lists/${listId}/items?$expand=fields($select=Title,Data)&$top=999`;
  while(next){const r=await g(next);
    r.value.forEach(it=>{let d=null;try{d=JSON.parse(it.fields.Data||'')}catch(_){}
      if(!d||(d.type!=='so'&&d.type!=='del')||!d.key||!d.v)return;
      const c=d.type==='so'?'so':'items',key=c+'/'+d.key,u=String(d.v.updatedAt||'');
      if(best[key]!=null&&best[key]>u)return;best[key]=u;spIds[key]=it.id;
      (d.type==='so'?ns:ni)[d.key]={...d.v,id:d.key}});
    next=r['@odata.nextLink']}
  items=ni;soItems=ns;
}
async function refresh(){if(mode!=='db'||refresh.busy)return;refresh.busy=true;try{await spLoad();setSync('ok','เชื่อม SharePoint แล้ว · '+me);if(!$('sheet').classList.contains('on'))render()}catch(e){setSync('warn','โหลดข้อมูลล่าสุดไม่สำเร็จ')}finally{refresh.busy=false}}
/* files */
const spPath=n=>encodeURIComponent(SP_DIR)+'/'+encodeURIComponent(n);
async function spUpload(file,name){
  name=String(name||file.name).replace(/[\\/:*?"<>|#%]/g,'_');
  if(file.size<=4*1048576){const it=await g(`/drives/${driveId}/root:/${spPath(name)}:/content?@microsoft.graph.conflictBehavior=rename`,{method:'PUT',body:file,headers:{'Content-Type':'application/pdf'}});return it}
  const ses=await g(`/drives/${driveId}/root:/${spPath(name)}:/createUploadSession`,{method:'POST',json:{item:{'@microsoft.graph.conflictBehavior':'rename'}}});
  const CH=5*327680*2;let it=null;
  for(let o=0;o<file.size;o+=CH){const end=Math.min(o+CH,file.size);
    const r=await fetch(ses.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${o}-${end-1}/${file.size}`},body:file.slice(o,end)});
    if(!r.ok)throw new Error('HTTP '+r.status);if(r.status===200||r.status===201)it=await r.json()}
  return it;
}
async function spFetch(id){return g(`/drives/${driveId}/items/${id}/content`,{raw:true})}
const fileRecOf=id=>{for(const s of [...Object.values(soItems),...Object.values(items)])for(const f of (s.files||[]))if(f.id===id)return f;return null};
function makeAssets(){return {
  upload:async(file,o)=>{if(file.size>20*1048576)throw{code:'too_large'};
    const so=attachCtx&&attachCtx.kind==='so'&&soItems[attachCtx.id]?soItems[attachCtx.id].so:(o&&o.so)||'';
    const name=(so&&!String(file.name).toUpperCase().includes(String(so).toUpperCase())?so+' - ':'')+file.name;
    try{const it=await spUpload(file,name);return {id:it.id,sizeBytes:it.size,url:it.webUrl,name:it.name}}catch(e){throw {code:e&&e.code||'error'}}},
  delete:id=>g(`/drives/${driveId}/items/${id}`,{method:'DELETE'})}}
function showSignin(){mode='signin';setSync('warn','ยังไม่ได้เข้าสู่ระบบ');render()}
async function init(){
  render();
  try{
    msalApp=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    await msalApp.handleRedirectPromise().catch(()=>{});
    account=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0]||null;
    if(!account){showSignin();return}
    msalApp.setActiveAccount(account);me=account.name||account.username;
    setSync('','กำลังโหลดจาก SharePoint…');
    const u=new URL(CFG.siteUrl);siteId=(await g(`/sites/${u.hostname}:${u.pathname}?$select=id`)).id;
    let next=`/sites/${siteId}/lists?$select=id,displayName&$top=200`;
    while(next&&!listId){const r=await g(next);const l=r.value.find(x=>x.displayName===SP_LIST);if(l)listId=l.id;next=r['@odata.nextLink']}
    if(!listId)throw new Error('ไม่พบ list "'+SP_LIST+'" ใน SharePoint');
    const d=await g(`/sites/${siteId}/drive?$select=id,webUrl`);driveId=d.id;spFolderUrl=d.webUrl+'/'+encodeURIComponent(SP_DIR);

/* ---------- render ---------- */
function filtered(){
  const q=query.trim().toLowerCase();
  return Object.values(items).filter(it=>{
    if(filter==='open'&&it.status==='done')return false;
    if(filter==='late'&&!isLate(it))return false;
    if(SMAP[filter]&&it.status!==filter)return false;
    if(q){const hay=[it.po,it.code,it.spec,it.so,it.inv,it.note].join(' ').toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
    return true;
  });
}

function renderDel(){

  const opts=[{k:'open',t:'ค้างส่ง',n:open},{k:'late',t:'⚠ เลยกำหนด',n:late},{k:'all',t:'ทั้งหมด',n:all.length},...STATUS.map(s=>({k:s.k,t:s.t,n:count(s.k)}))];
  if(!opts.some(o=>o.k===filter))filter='open';

  $('stSel').innerHTML=opts.map(o=>`<option value="${o.k}">${esc(o.t)} (${o.n})</option>`).join('');
  $('stSel').value=filter;

  const remainUnits=all.reduce((s,i)=>s+remainOf(i),0);

  $('stats').innerHTML=mode==='loading'&&!all.length?'':`

  const list=filtered();

    $('list').innerHTML=mode==='loading'?`<div class="empty">กำลังโหลด…</div>`:`<div class="empty"><div class="big">📦</div>ยังไม่มีรายการ<br><br><button class="btn pri" onclick="$('file').click()" style="flex:none;padding:10px 18px">นำเข้าไฟล์ Excel</button></div>`;

  if(!list.length){$('list').innerHTML=`<div class="empty">ไม่พบรายการที่ตรงกับตัวกรอง</div>`;return}

  const groups={};list.forEach(it=>{(groups[it.po]=groups[it.po]||[]).push(it)});
  const poKeys=Object.keys(groups).sort((a,b)=>{
    const la=groups[a].some(isLate),lb=groups[b].some(isLate);if(la!==lb)return la?-1:1;

function rowHTML(it){
  const s=SMAP[it.status]||SMAP.new, late=isLate(it);

  if(it.date)bits.push(`<span class="${late?'late':''}">${late?'⚠ เลยกำหนด ':'ส่ง '}${thDate(it.date)}</span>`);
  if(it.so)bits.push(`<span>SO ${esc(it.so)}</span>`);
  if(it.inv)bits.push(`<span>INV ${esc(it.inv)}</span>`);

    <div class="r1"><div class="spec">${esc(it.spec||'(ไม่มีสเปก)')}</div><span class="badge" style="color:var(${s.v});background:color-mix(in srgb,var(${s.v}) 13%,#fff)">${s.t}</span></div>

}

async function saveEditor(orig,full){
  const isNew=editing.isNew;
  const d={...orig};delete d.id;
  if(isNew){d.po=$('e_po').value.trim();d.code=$('e_code').value.trim();d.spec=$('e_spec').value.trim();d.qty=num($('e_qty').value);
    if(!d.po||!d.qty){toast('กรอก P/O และจำนวนก่อน');return}
    const maxNo=Math.max(0,...Object.values(items).map(i=>num(i.no)));d.no=maxNo+1;}
  d.delivered=Math.min(num($('e_del').value),num(d.qty));
  d.so=$('e_so').value.trim();d.inv=$('e_inv').value.trim();d.date=$('e_date').value;
  d.amount=$('e_amt').value===''?'':num($('e_amt').value);d.note=$('e_note').value.trim();
  d.status=editing.status;
  if(attachCtx&&attachCtx.kind==='item'&&attachCtx.id===editing.id)d.files=[...attachCtx.files];
  if(full){d.delivered=num(d.qty);d.status='done';if(!d.date)d.date=todayStr()}
  else{
    // keep status consistent with quantities
    if(remainOf(d)===0&&num(d.qty)>0)d.status='done';
    else if(d.status==='done'&&remainOf(d)>0)d.status=num(d.delivered)>0?'partial':'ready';
    else if(num(d.delivered)>0&&['new','prod','ready'].includes(d.status)&&editing.status===orig.status)d.status='partial';
  }
  let id=editing.id;
  if(isNew){id=sanitize(d.po+'_'+(d.code||'item'));let n=2;while(items[id])id=sanitize(d.po+'_'+(d.code||'item'))+'_'+n++}
  closeSheet();
  await writeItem(id,d);
  toast(full?'บันทึกส่งครบแล้ว ✓':'บันทึกแล้ว');
}

$('file').onchange=async e=>{

  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const hi=rows.findIndex(r=>r&&r.some(c=>String(c||'').trim().toLowerCase()==='p/o no.'));
    if(hi<0){toast('ไม่พบหัวคอลัมน์ “P/O No.” ในไฟล์');return}

      const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
      m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return''};
    const existingByKey={};Object.values(items).forEach(i=>{existingByKey[i.po+'|'+i.code]=existingByKey[i.po+'|'+i.code]||[];existingByKey[i.po+'|'+i.code].push(i)});
    const used=new Set();let added=0,updated=0;const writes=[];
    for(const r of rows.slice(hi+1)){

      const remain=remainRaw==null||remainRaw===''?qty:num(remainRaw);
      const delivered=Math.max(0,qty-remain);
      const key=po+'|'+code;const ex=(existingByKey[key]||[]).find(i=>!used.has(i.id));
      const fileVals={so:String(get(r,'so')??'').trim(),inv:String(get(r,'inv')??'').trim(),date:toDate(get(r,'date')),amount:get(r,'amount')==null?'':num(get(r,'amount'))};
      if(ex){
        used.add(ex.id);const d={...ex};delete d.id;
        d.qty=qty;d.spec=String(get(r,'spec')??d.spec);d.no=num(get(r,'no'))||d.no;
        d.delivered=Math.max(num(d.delivered),delivered);
        for(const k of ['so','inv','date','amount'])if(fileVals[k]!==''&&!d[k])d[k]=fileVals[k];
        if(remainOf(d)===0&&qty>0)d.status='done';
        writes.push([ex.id,d]);updated++;
      }else{
        let id=sanitize(po+'_'+(code||'item'));let n=2;while(items[id]||writes.some(w=>w[0]===id))id=sanitize(po+'_'+(code||'item'))+'_'+n++;
        const chk=get(r,'check')===true;
        const d={no:num(get(r,'no')),po,code,spec:String(get(r,'spec')??''),qty,delivered,...fileVals,note:'',
          status:(remain===0&&qty>0)||chk?'done':delivered>0?'partial':'new'};
        writes.push([id,d]);added++;
      }
    }
    if(!writes.length){toast('ไม่พบรายการในไฟล์');return}
    toast(`กำลังนำเข้า ${writes.length} รายการ…`);
    for(const [id,d] of writes)await writeItem(id,d);
    toast(`นำเข้าแล้ว: ใหม่ ${added} · อัปเดต ${updated}`);
  }catch(err){console.error(err);toast('อ่านไฟล์ไม่สำเร็จ')}
};

function parseSO(txt){
  const pos=new Set(Object.values(items).map(i=>String(i.po)));
  const rows=[],byPO={},unmatched=[];
  txt.split(/\r?\n/).forEach(line=>{
    const cells=line.split(/\t|\s{2,}/).map(c=>c.trim()).filter(Boolean);
    const so=cells.find(c=>/^SO[A-Z]*\d{4}-\d+$/i.test(c)); if(!so)return;
    const qt=cells.find(c=>/^QT\d{4}-\d+$/i.test(c))||'';
    const date=(cells.find(c=>/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c))||'');
    const po=cells.find(c=>pos.has(c))||cells.find(c=>c!==so&&c!==qt&&/^(\d{8,}|PO\d+)$/i.test(c))||'';
    const amt=[...cells].reverse().find(c=>/^\d{1,3}(,\d{3})*\.\d{2}$|^\d+\.\d{2}$/.test(c))||'';
    rows.push({so,qt,date,po,amt});
    if(pos.has(po))(byPO[po]=byPO[po]||[]).push({so,qt,date:date.replace(/\/(\d{2})(\d{2})$/,'/$2'),amt});
    else if(po&&!unmatched.includes(po))unmatched.push(po);
  });
  const matchedItems=Object.values(items).filter(i=>byPO[i.po]&&i.status!=='done');
  return {rows,byPO,unmatched,matchedItems};
}

async function pdfToContent(file){
  const lib=window.pdfjsLib;if(!lib)throw{code:'nolib'};
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=Math.min(pdf.numPages,8);let text='';const imgs=[];
  for(let p=1;p<=pages;p++){
    const page=await pdf.getPage(p);const tc=await page.getTextContent();
    let line='',lastY=null;const lines=[];
    for(const it of tc.items){const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){lines.push(line);line=''}line+=(line&&!line.endsWith(' ')?' ':'')+it.str;lastY=y}
    if(line)lines.push(line);
    text+=`\n--- หน้า ${p} ---\n`+lines.join('\n');
  }
  if(text.replace(/[\s\-หน้า\d]/g,'').length<40&&sampleImages){
    for(let p=1;p<=Math.min(pages,3);p++){
      const page=await pdf.getPage(p);const vp=page.getViewport({scale:1.6});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)));
    }
  }
  return {text:text.slice(0,60000),imgs,pages:pdf.numPages};
}

const SO_PROMPT_HEAD=content=>`คุณคือผู้ช่วยดึงข้อมูลจากเอกสาร "ใบสั่งขาย / Sales Order (SO)" ของบริษัทไทย

ให้ตอบเป็น JSON array เท่านั้น 1 object ต่อ 1 ใบ SO ที่พบ (ไฟล์เดียวอาจมีหลายใบ) รูปแบบ:

กติกา:
- so = เลขที่ใบสั่งขาย ขึ้นต้นด้วย SO เช่น SOB/SOT/SOR/SOL ตามด้วยตัวเลข-ตัวเลข
- po = เลขที่ใบสั่งซื้อของลูกค้า (Customer PO / P/O No. / เลขที่ PO) ถ้าไม่พบให้เป็น ""
- qt = เลขอ้างอิงใบเสนอราคา (Reference / QT...) ถ้าไม่พบให้เป็น ""

- amount = ยอดรวมสุทธิทั้งใบ (รวม VAT ถ้ามี) เป็นตัวเลข ไม่มีจุลภาค ถ้าไม่พบให้เป็น null
- items = รายการสินค้าทุกบรรทัดในใบ เรียงตามเอกสาร: no (ลำดับ), code (รหัสสินค้า/BQMS Code ถ้ามี ไม่มีให้เป็น ""), spec (รายละเอียดสินค้าเต็ม), qty (ตัวเลข), unit (หน่วย ถ้ามี), price (ราคาต่อหน่วย ตัวเลขหรือ null), amount (จำนวนเงินของบรรทัด ตัวเลขหรือ null)
- ห้ามเดาค่าที่ไม่มีในเอกสาร ถ้าไม่ใช่ใบ SO เลย ให้ตอบ []
`;

  return arr.slice(0,80).filter(x=>x&&(x.spec||x.code)).map((x,i)=>({no:num(x.no)||i+1,code:String(x.code??'').trim(),spec:String(x.spec??'').trim(),qty:num(x.qty),unit:String(x.unit??'').trim(),price:x.price==null||x.price===''?'':num(x.price),amount:x.amount==null||x.amount===''?'':num(x.amount)}));
}
function linesHTML(lines,max,check){

  return show.map((l,i)=>`<div class="ln ${l.checked?'done':''}">${check?`<button type="button" class="lchk ${l.checked?'on':''}" data-lc="${i}" aria-label="เช็ครายการ">✓</button>`:(lines.some(x=>x.checked)?`<span class="tick">${l.checked?'✓':''}</span>`:'')}<span class="q">${fmt(l.qty)}${l.unit?' '+esc(l.unit):''}</span><span class="s">${esc(l.spec||l.code)}${l.code&&l.spec?`<span class="c">${esc(l.code)}</span>`:''}</span>${num(l.amount)?`<span class="a">฿${money(l.amount)}</span>`:''}</div>`).join('')

function soSum(s){

const beISO=s=>{const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return'';let y=+m[3];if(y>2400)y-=543;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')};

function joinRun(arr){arr=arr.slice().sort((a,b)=>a.x-b.x);let s='',end=null;
  for(const i of arr){const t=i.s;if(s&&end!=null&&i.x-end>1.5&&!/\s$/.test(s)&&!/^\s/.test(t))s+=' ';s+=t;end=i.x+(i.w||0)}

async function pdfOrders(blob){
  const lib=window.pdfjsLib;if(!lib)throw{code:'nolib'};
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  const orders=[];let cur=null,anyText=false;
  for(let p=1;p<=Math.min(pdf.numPages,40);p++){
    const page=await pdf.getPage(p);const tc=await page.getTextContent();
    const T=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}));
    if(T.length>8)anyText=true;
    const near=(y,xlo,xhi,re)=>T.filter(i=>Math.abs(i.y-y)<=4&&i.x>=xlo&&i.x<=xhi&&(!re||re.test(i.s.trim()))).sort((a,b)=>a.x-b.x)[0];
    const soIt=T.find(i=>/^SO[A-Z]{0,3}\d{4}-\d+$/i.test(i.s.trim()));
    if(soIt){const so=soIt.s.trim().toUpperCase();
      if(!cur||cur.so!==so){cur={so,po:'',qt:'',date:'',due:'',amount:'',customer:'',items:[]};orders.push(cur)}
      const d=near(soIt.y-17,soIt.x-30,soIt.x+90,/^\d{1,2}\/\d{1,2}\/\d{4}$/);if(d&&!cur.date)cur.date=beISO(d.s);
      const dy=d?d.y:soIt.y-17;
      const po=near(dy-27,soIt.x-70,soIt.x+60);if(po&&!cur.po&&!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(po.s.trim()))cur.po=po.s.trim();
      const due=near(dy-61,soIt.x-70,soIt.x+60,/^\d{1,2}\/\d{1,2}\/\d{4}$/);if(due&&!cur.due)cur.due=beISO(due.s);
    }
    if(!cur)continue;
    const hd=T.find(i=>/รหัสสินค้า/.test(i.s));const ft=T.find(i=>/^หมายเหต/.test(i.s.trim()));
    const top=hd?hd.y-3:540,bot=ft?ft.y+3:150;
    const rowsY=[];T.filter(i=>i.y<top&&i.y>bot).forEach(i=>{let r=rowsY.find(r=>Math.abs(r.y-i.y)<=2.5);if(!r){r={y:i.y,c:[]};rowsY.push(r)}r.c.push(i)});
    rowsY.sort((a,b)=>b.y-a.y);
    let it=cur.items[cur.items.length-1]||null;
    for(const r of rowsY){
      const col=(a,b)=>r.c.filter(i=>i.x>=a&&i.x<b);
      const code=joinRun(col(0,108)),spec=joinRun(col(108,315)),qty=joinRun(col(315,372)),unit=joinRun(col(372,415)),price=joinRun(col(415,475)),amt=joinRun(col(515,999));
      if(isNum(qty)&&(spec||code)){
        it={no:cur.items.length+1,code:'',pcode:code,spec,qty:num(qty),unit,price:isNum(price)?num(price):'',amount:isNum(amt)?num(amt):'',_x:[]};cur.items.push(it);continue}
      if(!it)continue;
      const line=joinRun(r.c.filter(i=>i.x>=100&&i.x<515));if(!line)continue;
      const bq=line.match(/BQMS\s*Code\s*:?\s*(\S+)/i);if(bq){it.code=bq[1];continue}
      const qt=line.match(/QT[A-Z]?\d{4}-\d+/i);if(qt){if(!cur.qt)cur.qt=qt[0].toUpperCase();continue}
      it._x.push(line);
    }
    const lab=T.find(i=>/นวนเงินทั/.test(i.s));
    if(lab){const tot=T.filter(i=>Math.abs(i.y-lab.y)<=4&&i.x>=505&&isNum(i.s.trim())).sort((a,b)=>b.x-a.x)[0];if(tot)cur.amount=num(tot.s)}

  return orders.map(o=>({...o,items:o.items.map(i=>({no:i.no,code:i.code||i.pcode,spec:[i.spec,...i._x].filter(Boolean).join(' · '),qty:i.qty,unit:i.unit,price:i.price,amount:i.amount}))}));
}

        <div class="f full"><label>ยอดรวม (บาท)</label><input data-k="amount" type="number" inputmode="decimal" step="0.01" value="${esc(d.amount)}"></div>
      </div>
      ${d.items.length?`<div class="lines" style="margin-top:10px"><div class="hint" style="margin-bottom:2px">รายการตามใบสั่งขาย (${d.items.length})</div><div class="ltable" style="background:var(--bg)">${linesHTML(d.items)}</div></div>`:''}
      <div class="ex-items">📄 ${esc(r.file.name)}</div>
    </div>`}).join('');
  $('exList').querySelectorAll('[data-on]').forEach(c=>c.onchange=()=>c.closest('.ex').classList.toggle('off',!c.checked));
  $('exActs').innerHTML=ok.length?`<button class="btn" id="exCancel">ยกเลิก</button><button class="btn pri" id="exSave">บันทึก ${ok.length} SO</button>`:`<button class="btn" id="exCancel">ปิด</button>`;
  $('exCancel').onclick=closeSheet;
  if($('exSave'))$('exSave').onclick=()=>saveExtracted(results);
}
async function saveExtracted(results){
  const picks=[];
  $('exList').querySelectorAll('[data-ex]').forEach(el=>{
    if(!el.querySelector('[data-on]').checked)return;
    const r=results[+el.dataset.ex];const v=k=>el.querySelector(`[data-k="${k}"]`).value.trim();
    picks.push({file:r.file,items:r.data.items,so:v('so').toUpperCase(),po:v('po'),qt:v('qt'),date:v('date'),amount:v('amount')===''?'':num(v('amount'))});
  });
  if(!picks.length){toast('ยังไม่ได้เลือก SO');return}
  closeSheet();toast(`กำลังบันทึก ${picks.length} SO…`);
  const uploaded=new Map();let delUpd=0;
  for(const p of picks){
    if(!p.so)continue;
    const id=sanitize(p.so);const ex=soItems[id];
    const d=ex?{...ex}:{so:p.so,status:'prod',checked:false,note:''};
    d.so=p.so;if(p.items&&p.items.length)d.lines=p.items;if(p.po)d.po=p.po;if(p.qt)d.qt=p.qt;if(p.date)d.date=p.date;if(p.amount!=='')d.amount=p.amount;
    const inDel=Object.values(items).some(it=>String(it.po)===String(d.po));
    if(assetsApi){
      try{
        let a=uploaded.get(p.file);
        if(!a){const r=await assetsApi.upload(p.file,{type:'application/pdf',so:p.so});a={id:r.id,name:r.name||p.file.name,url:r.url,size:r.sizeBytes||p.file.size,at:new Date().toISOString()};uploaded.set(p.file,a)}
        const fs=[...(d.files||[])];if(!fs.some(f=>f.id===a.id))fs.push(a);d.files=fs;
      }catch(err){}
    }
    await writeSO(id,d);
    {const a=uploaded.get(p.file);if(a)syncOD(id,a,p.file);}
    // update matching delivery lines
    const lines=Object.values(items).filter(it=>String(it.po)===String(d.po)&&it.status!=='done');
    const codes=new Set((p.items||[]).map(x=>String(x.code||'').trim()).filter(Boolean));
    const target=codes.size&&lines.some(l=>codes.has(l.code))?lines.filter(l=>codes.has(l.code)):lines;
    for(const it of target){
      const x={...it};delete x.id;
      const cur=String(x.so||'').split(/\s*,\s*/).filter(Boolean);if(!cur.includes(d.so))cur.push(d.so);x.so=cur.join(', ');
      if(!x.status||x.status==='new')x.status='prod';
      await writeItem(it.id,x);delUpd++;
    }
  }
  toast(`บันทึก ${picks.length} SO แล้ว`+(delUpd?` · อัปเดตงานจัดส่ง ${delUpd} รายการ`:'')+' ✓');
}
$('readPdfBtn').onclick=startPdfRead;
let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
document.addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth++;$('dropcover').classList.add('on')});
document.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy'});
document.addEventListener('dragleave',e=>{if(!hasFiles(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('dropcover').classList.remove('on')});
document.addEventListener('drop',e=>{
  if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$('dropcover').classList.remove('on');
  const fs=[...e.dataTransfer.files];
  if(!fs.some(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf')){toast('รับเฉพาะไฟล์ PDF');return}
  if(attachCtx&&$('sheet').classList.contains('on')){ // dropping onto an open editor = attach
    const dt=new DataTransfer();fs.forEach(f=>dt.items.add(f));$('pdfIn').files=dt.files;$('pdfIn').dispatchEvent(new Event('change'));return}
  if(view!=='so')setView('so');
  readPdfFiles(fs);
});

$('list').onclick=e=>{

  const h=e.target.closest('.po-h');if(h){const po=h.dataset.po;closedPO.has(po)?closedPO.delete(po):closedPO.add(po);h.parentElement.classList.toggle('closed');return}
  const r=e.target.closest('.row');if(r)openEditor(r.dataset.id);
};
