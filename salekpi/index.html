<script>

/* copy of the sender list as a text file, so the daily alert can read it */
async function cmSaveTxt(C){if(DEMO)return;const d=await rpDriveId();await cmFetch(`/drives/${d}/root:/${encodeURIComponent(CM_DIR)}/_senders.txt:/content`,SCOPES,{method:'PUT',headers:{'Content-Type':'text/plain'},body:C.senders.join('\n')+'\n'})}

/* ---- one email ---- */
async function cmFiles(id){if(CM_F[id])return CM_F[id];
  const m=await cmMail(`/me/messages/${id}?$select=id,subject,from,receivedDateTime,body,toRecipients,ccRecipients,webLink`,{headers:{Prefer:'outlook.body-content-type="text"'}});
  const A=m.hasAttachments===false?[]:(await cmMail(`/me/messages/${id}/attachments?$select=id,name,size,contentType,isInline`)).value.filter(a=>a['@odata.type']==='#microsoft.graph.fileAttachment'&&!(a.isInline&&/^image\//.test(a.contentType)&&a.size<60000));
  const F=[];for(const a of A){const r=await cmMail(`/me/messages/${id}/attachments/${a.id}/$value`,{raw:true});F.push({name:a.name,type:a.contentType,size:a.size,blob:await r.blob()})}
  return CM_F[id]={m,files:F}}
const cmKind=f=>/\.pdf$/i.test(f.name)||/pdf/.test(f.type)?'pdf':/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)?'xls':/\.docx$/i.test(f.name)?'doc':/^image\//.test(f.type)||/\.(png|jpe?g|gif|webp)$/i.test(f.name)?'img':/\.(txt|eml)$/i.test(f.name)?'txt':'';
async function cmPdfLib(){await loadLib('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','pdfjsLib');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';return pdfjsLib}
async function cmText(f){const k=cmKind(f),buf=await f.blob.arrayBuffer();
  if(k==='pdf'){const P=await cmPdfLib();const doc=await P.getDocument({data:new Uint8Array(buf)}).promise;let t='';for(let i=1;i<=Math.min(doc.numPages,20);i++){const c=await (await doc.getPage(i)).getTextContent();let y=null;for(const it of c.items){const yy=Math.round(it.transform[5]);t+=(y!==null&&Math.abs(yy-y)>3?'\n':' ')+it.str;y=yy}t+='\n'}return t.replace(/[ \t]+/g,' ').trim()}
  if(k==='xls'){await loadLib('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX');const wb=XLSX.read(buf);return wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n],{FS:' | ',blankrows:false}).split('\n').filter(l=>l.replace(/[ |]/g,'')).join('\n')).join('\n\n')}
  if(k==='doc'){await loadLib('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js','mammoth');return (await mammoth.extractRawText({arrayBuffer:buf})).value.trim()}
  if(k==='txt')return (await f.blob.text()).trim();return ''}
async function cmView(f,back){openSheet(`${shh('<button class="x" id="cv_b">กลับ</button>',esc(f.name),'<button class="x" id="cv_dl">ดาวน์โหลด</button>')}<div id="cv_box" style="margin-top:8px"><div class="center"><div class="spin"></div></div></div>`);
  $('cv_b').onclick=back;$('cv_dl').onclick=()=>rpSaveFile(f.blob,f.name);const box=$('cv_box'),k=cmKind(f);
  try{if(k==='pdf'){const P=await cmPdfLib();const doc=await P.getDocument({data:new Uint8Array(await f.blob.arrayBuffer())}).promise;box.innerHTML='';const W=Math.min(box.clientWidth||600,900);
      for(let i=1;i<=Math.min(doc.numPages,15);i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const sc=W/v0.width*(devicePixelRatio||1);const vp=pg.getViewport({scale:sc});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;cv.style.cssText='width:100%;border-radius:10px;margin-bottom:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)';box.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise}
      if(doc.numPages>15)box.insertAdjacentHTML('beforeend',`<div class="vpnote">แสดง 15 จาก ${doc.numPages} หน้า · กดดาวน์โหลดเพื่อดูทั้งหมด</div>`)}
    else if(k==='xls'){await loadLib('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX');const wb=XLSX.read(await f.blob.arrayBuffer());
      box.innerHTML=wb.SheetNames.map(n=>`<div class="fgroup"><h3>${esc(n)}</h3></div><div class="cmtbl">${XLSX.utils.sheet_to_html(wb.Sheets[n],{header:'',footer:''})}</div>`).join('')}
    else if(k==='doc'){await loadLib('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js','mammoth');const h=(await mammoth.convertToHtml({arrayBuffer:await f.blob.arrayBuffer()})).value;
      const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,iframe,object,embed,link,style').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(x=>[...x.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))x.removeAttribute(a.name)}));
      box.innerHTML='<div class="cmdoc"></div>';box.firstChild.appendChild(t.content)}
    else if(k==='img'){const u=URL.createObjectURL(f.blob);box.innerHTML=`<img src="${u}" style="width:100%;border-radius:10px">`}
    else if(k==='txt'){box.innerHTML=`<pre class="cmpre">${esc(await f.blob.text())}</pre>`}
    else box.innerHTML='<div class="empty">ไฟล์ชนิดนี้เปิดดูในเว็บไม่ได้ · กดดาวน์โหลด</div>'}
  catch(e){box.innerHTML=`<div class="empty">เปิดไฟล์ไม่สำเร็จ: ${esc(e.message)}</div>`}}
function cmGuessDate(t){let best='';const now=today();for(const x of String(t).matchAll(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4}|\d{2})\b/g)){let y=+x[3];if(y<100)y+=y>60?2500:2000;if(y>2400)y-=543;const d=`${y}-${String(+x[2]).padStart(2,'0')}-${String(+x[1]).padStart(2,'0')}`;if(+x[2]<=12&&+x[1]<=31&&d>=now&&(!best||d<best))best=d}return best}

/* save record (+ upload files once) */
async function cmSave(st,files){
  const have=new Set((st.files||[]).map(f=>f.name));const todo=(files||[]).filter(f=>!have.has(f.name));
  if(todo.length&&!DEMO){const d=await rpDriveId();const ym=String(st.received||today()).slice(0,7);const up=[];
    for(const f of todo){const safe=f.name.replace(/[\\/:*?"<>|#%]/g,'_');const p=`${CM_DIR}/${ym}/${String(st.received||'').slice(0,10)}_${Date.now().toString(36)}_${safe}`;let it;
      if(f.size<3.9e6)it=await cmFetch(`/drives/${d}/root:/${p.split('/').map(encodeURIComponent).join('/')}:/content`,SCOPES,{method:'PUT',headers:{'Content-Type':'application/octet-stream'},body:f.blob});
      else{const s=await g(`/drives/${d}/root:/${p.split('/').map(encodeURIComponent).join('/')}:/createUploadSession`,{method:'POST',json:{item:{'@microsoft.graph.conflictBehavior':'rename'}}});const C=3276800;
        for(let o=0;o<f.size;o+=C){const end=Math.min(o+C,f.size);const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${o}-${end-1}/${f.size}`},body:f.blob.slice(o,end)});if(!r.ok&&r.status!==202)throw new Error('อัปโหลดไฟล์ใหญ่ไม่สำเร็จ');if(end===f.size)it=await r.json()}}
      up.push({id:it.id,name:f.name,size:f.size,url:it.webUrl||'',etag:((it.eTag||'').match(/[0-9a-f-]{36}/i)||[''])[0].toLowerCase()})}
    st.files=(st.files||[]).concat(up)}
  const {_id,...d}=st;const cur=cmRecs().find(r=>r.msgId===st.msgId);await store.save('salekpi',cur?{...d,_id:cur._id}:d);
  const nr=cmRec(st.msgId);if(nr)st._id=nr._id}
function cmHtml(st,forMail){const S=st.sum;const row=(k,v)=>v?`<tr><td style="padding:4px 12px 4px 0;color:#666;vertical-align:top;white-space:nowrap">${k}</td><td style="padding:4px 0">${v}</td></tr>`:'';
  const items=(S.items||[]).filter(x=>x.d||x.q);
  return `<div style="font-family:Tahoma,'Segoe UI',sans-serif;font-size:14px;line-height:1.5">${forMail?'<p>เรียนทุกท่าน</p><p>แจ้งความต้องการตามรายละเอียดด้านล่าง</p>':'<p><b>📩 แจ้งความต้องการ</b></p>'}
  <table style="border-collapse:collapse">${row('เรื่อง','<b>'+esc(S.title)+'</b>')}${row('วันที่ต้องการ',S.need?esc(thDate(S.need)):'')}${row('ได้รับเมล',esc(cmDT(st.received))+' จาก '+esc(st.from))}</table>

  ${S.detail?`<p style="margin-top:10px"><b>รายละเอียด</b><br>${esc(S.detail.slice(0,forMail?20000:1500)).replace(/\n/g,'<br>')}</p>`:''}
  ${forMail==='links'&&cmSendF(st).length?`<p><b>ไฟล์แนบ</b><br>${cmSendF(st).map(f=>`<a href="${esc(f.url)}">${esc(f.name)}</a>`).join('<br>')}</p>`:''}
  ${forMail?`<p>ขอบคุณครับ<br>${esc(me)}</p>`:''}</div>`}
const cmB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
async function cmSendMail(st,files){const tot=(files||[]).reduce((a,f)=>a+f.size,0);const att=[];const inl=files&&files.length&&tot<=3e6;
  if(inl)for(const f of files)att.push({'@odata.type':'#microsoft.graph.fileAttachment',name:f.name,contentType:f.type||'application/octet-stream',contentBytes:await cmB64(f.blob)});
  const msg={subject:`ความต้องการ: ${st.sum.title}`,body:{contentType:'HTML',content:cmHtml(st,inl||!cmSendF(st).length?true:'links')},
    toRecipients:st.to.map(a=>({emailAddress:{address:a}})),ccRecipients:st.cc.map(a=>({emailAddress:{address:a}})),attachments:att};
  if(DEMO)return;await cmFetch('/me/sendMail',['Mail.Send'],{method:'POST',json:{message:msg,saveToSentItems:true}})}
const cmSendF=st=>(st.files||[]).filter(f=>!st.sendNames||st.sendNames.includes(f.name));

  const html=cmHtml(st,false)+att.map(a=>`<attachment id="${a.id}"></attachment>`).join('');
  if(DEMO)return;await cmFetch(`/chats/${encodeURIComponent(gr.id)}/messages`,['ChatMessage.Send'],{method:'POST',json:{body:{contentType:'html',content:html},attachments:att}})}

function slSvg(v,t,w=640,h=200){const P=26,bw=(w-P-6)/12;const mx=Math.max(t,...v.filter(x=>x!=null),1)+1;const y=x=>h-22-(Math.min(x,mx)/mx)*(h-40);let s=`<svg viewBox="0 0 ${w} ${h}">`;
  const stp=Math.max(1,Math.ceil(mx/4));for(let g=0;g<=mx;g+=stp){s+=`<line x1="${P}" x2="${w-4}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--line)"/><text x="${P-6}" y="${y(g)+3.5}" font-size="10" style="fill:var(--faint)" text-anchor="end">${g}</text>`}
  v.forEach((x,i)=>{const cx=P+bw*i+bw/2;if(x!=null){const ok=x<=t;s+=`<rect x="${cx-bw*.3}" y="${y(x)}" width="${bw*.6}" height="${h-22-y(x)}" rx="3" style="fill:${ok?'var(--acc)':'var(--bad)'}" fill-opacity="${ok?1:.85}"/><text x="${cx}" y="${y(x)-5}" font-size="11" font-weight="600" text-anchor="middle" style="fill:var(--ink)">${x}</text>`}
    s+=`<text x="${cx}" y="${h-7}" font-size="10" text-anchor="middle" style="fill:var(--sub)">${KP_MON[i]}</text>`});
  s+=`<line x1="${P}" x2="${w-4}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--ink)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${w-6}" y="${y(t)-5}" font-size="10.5" font-weight="600" style="fill:var(--sub)" text-anchor="end">เป้า ≤ ${t}</text></svg>`;return s}

  if($('sm_s'))$('sm_s').onclick=async()=>{const val=id=>{const s=$(id).value.trim();if(s==='')return '';const n=parseInt(s,10);return isNaN(n)||n<0?null:n};const c1=val('sm_c1'),c2=val('sm_c2');

/* ---- Excel: เติมลงไฟล์ _template/FM-QMS-01-03-SaleCenter.xlsx ---- */
async function saleXlsx(y){await loadLib('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','JSZip');const d=await rpDriveId();const it=await g(`/drives/${d}/root:/_template/${SL_TPL}`);const res=await fetch(it['@microsoft.graph.downloadUrl']);if(!res.ok)throw new Error('โหลดแม่แบบ Excel ไม่สำเร็จ');
  const z=await JSZip.loadAsync(await res.arrayBuffer());const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',RN='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PR='http://schemas.openxmlformats.org/package/2006/relationships',CN='http://schemas.openxmlformats.org/drawingml/2006/chart';
  const rd=async p=>new DOMParser().parseFromString((await z.file(p).async('string')).replace(/^﻿/,''),'application/xml');const wr=(p,doc)=>z.file(p,new XMLSerializer().serializeToString(doc));
  const res2=(base,t)=>{const parts=(base.replace(/[^/]*$/,'')+t).split('/');const o=[];parts.forEach(x=>{if(x==='..')o.pop();else if(x&&x!=='.')o.push(x)});return o.join('/')};
  const wb=await rd('xl/workbook.xml');const wrel=await rd('xl/_rels/workbook.xml.rels');const dt=thDate(today());
  const CL=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  for(const k of [1,2]){const sh=[...wb.getElementsByTagNameNS(NS,'sheet')].find(s=>String(s.getAttribute('name')).includes(SL_DEF[k-1].sheet));if(!sh)continue;const rid=sh.getAttributeNS(RN,'id');const rel=[...wrel.getElementsByTagNameNS(PR,'Relationship')].find(r=>r.getAttribute('Id')===rid);const P=res2('xl/workbook.xml',rel.getAttribute('Target'));
    const doc=await rd(P);const SD=doc.getElementsByTagNameNS(NS,'sheetData')[0];const rows={};[...SD.getElementsByTagNameNS(NS,'row')].forEach(r=>rows[+r.getAttribute('r')]=r);
    const cn=s=>[...s.replace(/\d+/,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0);
    const cell=ref=>{const rn=+ref.match(/\d+/)[0];let r=rows[rn];if(!r){r=doc.createElementNS(NS,'row');r.setAttribute('r',rn);const after=Object.keys(rows).map(Number).filter(x=>x>rn).sort((a,b)=>a-b)[0];SD.insertBefore(r,after?rows[after]:null);rows[rn]=r}
      let c=[...r.getElementsByTagNameNS(NS,'c')].find(x=>x.getAttribute('r')===ref);if(!c){c=doc.createElementNS(NS,'c');c.setAttribute('r',ref);const nx=[...r.getElementsByTagNameNS(NS,'c')].find(x=>cn(x.getAttribute('r'))>cn(ref));r.insertBefore(c,nx||null)}return c};
    const set=(ref,v)=>{const c=cell(ref);while(c.firstChild)c.removeChild(c.firstChild);c.removeAttribute('t');if(v==null||v==='')return;
      if(typeof v==='number'){const e=doc.createElementNS(NS,'v');e.textContent=String(v);c.appendChild(e)}
      else{c.setAttribute('t','inlineStr');const is=doc.createElementNS(NS,'is'),t=doc.createElementNS(NS,'t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=String(v);is.appendChild(t);c.appendChild(is)}};
    const {v}=slYear(k,y);set('R2',dt);
    for(let i=0;i<12;i++){set(CL(4+i)+'24',SL_DEF[k-1].target);set(CL(4+i)+'25',v[i]==null?'':v[i])}
    const CA=slCA(k,y).slice(0,5);for(let i=0;i<5;i++){const r0=29+i*5,c=CA[i];const dd=s=>isoOnly(s)?thDate(s):(s||'');set('A'+r0,c?i+1:'');set('B'+r0,c?thDate(c.date):'');set('D'+r0,c?c.problem||'':'');set('G'+r0,c?c.fix||'':'');set('L'+r0,c?dd(c.due):'');set('N'+r0,c?dd(c.done):'');set('P'+r0,c?c.note||'':'')}
    wr(P,doc);
    /* อัปเดตค่าที่แคชไว้ในกราฟ */
    const relP=P.replace(/([^/]+)$/,'_rels/$1.rels');if(!z.file(relP))continue;const sr=await rd(relP);
    for(const dr of [...sr.getElementsByTagNameNS(PR,'Relationship')].filter(r=>/drawing$/.test(r.getAttribute('Type')))){const DP=res2(P,dr.getAttribute('Target'));const drr=DP.replace(/([^/]+)$/,'_rels/$1.rels');if(!z.file(drr))continue;const dx=await rd(drr);
      for(const cr of [...dx.getElementsByTagNameNS(PR,'Relationship')].filter(r=>/chart$/.test(r.getAttribute('Type')))){const CP=res2(DP,cr.getAttribute('Target'));const cd=await rd(CP);
        for(const ref of [...cd.getElementsByTagNameNS(CN,'numRef')]){const f=ref.getElementsByTagNameNS(CN,'f')[0];if(!f||!/\$25:/.test(f.textContent))continue;const nc=ref.getElementsByTagNameNS(CN,'numCache')[0];if(!nc)continue;[...nc.getElementsByTagNameNS(CN,'pt')].forEach(p=>nc.removeChild(p));
          v.forEach((x,i)=>{if(x==null)return;const p=cd.createElementNS(CN,'c:pt');p.setAttribute('idx',i);const vv=cd.createElementNS(CN,'c:v');vv.textContent=String(x);p.appendChild(vv);nc.appendChild(p)})}
        wr(CP,cd)}}}
  const cp=wb.getElementsByTagNameNS(NS,'calcPr')[0];if(cp)cp.setAttribute('fullCalcOnLoad','1');wr('xl/workbook.xml',wb);
  return await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

    .replace(/<div class="dh">/g,'<div style="font-weight:bold;text-decoration:underline">').replace(/<h4>/g,'<h4 style="font-size:11.5pt;margin:10pt 0 4pt">');
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(r.title||'JD')}</title><style>@page WordSection1{size:595.3pt 841.9pt;margin:36pt 36pt 36pt 36pt}div.WordSection1{page:WordSection1}body{font-family:Tahoma,sans-serif}</style></head><body><div class="WordSection1">${body}</div></body></html>`;

/* shrink text that does not fit its cell */
function rqFit(root){root.querySelectorAll('.rqf .fit').forEach(el=>{const h=+el.dataset.h;let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollHeight>h+1&&fs>6.5){fs-=.5;el.style.fontSize=fs+'px'}})}
const RQ_FIT_SRC='('+rqFit.toString()+')(document)';
function rqPrev(box,r){const sc=Math.min(1,box.clientWidth/794)||.45;box.style.height=Math.ceil(1123*sc)+'px';box.innerHTML=`<div style="width:794px;transform:scale(${sc});transform-origin:0 0"><style>${RQ_CSS}</style>${rqHTML(r)}</div>`;rqFit(box);(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>rqFit(box))}
const rqFile=r=>safeName(`${RQ_HDR.code}_${r.no||''}_${r.job||''}`);
async function rqPdf(r){await loadLib('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','html2canvas');await loadLib('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','jspdf');
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-12000px;top:0;width:794px';host.innerHTML=`<style>${RQ_CSS}</style>${rqHTML(r)}`;document.body.appendChild(host);
  try{try{await document.fonts.ready}catch(_){};await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?0:new Promise(z=>{i.onload=i.onerror=z})));rqFit(host);
    const c=await html2canvas(host.querySelector('.rqf'),{scale:2.5,backgroundColor:'#fff',logging:false});
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',0,0,210,297);
    pdf.setProperties({title:rqTitle(r)});rpSaveFile(pdf.output('blob'),rqFile(r)+'.pdf')}finally{host.remove()}}
function rqPrint(r){const w=window.open('','_blank');if(!w){toast('เบราว์เซอร์บล็อกหน้าต่างใหม่ ลองกดปุ่ม PDF แทน');return}
  w.document.open();w.document.write(`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>${esc(rqFile(r))}</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><style>@page{size:A4 portrait;margin:0}html,body{margin:0;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}${RQ_CSS}.rqf{height:1120px;overflow:hidden}</style></head><body>${rqHTML(r)}<script>(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{${RQ_FIT_SRC};setTimeout(()=>window.print(),300)})<\/script></body></html>`);w.document.close()}
function rqWire(get){document.querySelectorAll('[data-wx]').forEach(b=>b.onclick=async()=>{const r=get();if(!r)return;if(b.dataset.wx==='print'){rqPrint(r);return}
  const old=b.innerHTML;b.disabled=true;b.textContent='กำลังสร้าง PDF…';try{await rqPdf(r);toast('บันทึก PDF แล้ว')}catch(e){toast('สร้าง PDF ไม่สำเร็จ: '+e.message)}finally{b.disabled=false;b.innerHTML=old}})}

  ${m.feats.map((x,i)=>`<div class="kpjob" data-ft="${i}" style="padding:10px 12px;display:block"><div style="display:flex;gap:8px;align-items:center"><b style="width:18px;color:var(--sub)">${i+1}</b><input data-f="f" value="${esc(x.f||'')}" placeholder="ฟีเจอร์" style="${inp};flex:1"><select data-f="p" style="${inp};flex:none">${RQ_OPT.pri.map(o=>`<option ${o===(x.p||'ต้องมี')?'selected':''}>${o}</option>`).join('')}</select><button data-fdel="${i}" aria-label="ลบฟีเจอร์ข้อ ${i+1}" style="color:var(--bad);font-size:22px;width:36px;height:36px;flex:none">×</button></div>
    <input data-f="d" value="${esc(x.d||'')}" placeholder="รายละเอียดสั้น ๆ" style="${inp};width:100%;margin-top:6px"></div>`).join('')}
  ${m.feats.length<RQ_MAXF?'<div class="btnlist" style="margin-top:10px"><button id="rq_fadd">+ เพิ่มฟีเจอร์</button></div>':''}
  <div class="formg">${A('ไม่รวมในงานนี้','rq_excl',m.excl,'สิ่งที่ไม่ต้องทำในงานนี้')}</div>
  <div class="fgroup"><h3>4. ข้อมูลประกอบ</h3></div><div class="formg">${F('หน้าจอ / แบบร่าง',sel('rq_mock',RQ_OPT.mock,m.mock))}${F('ชั้นความลับข้อมูล',sel('rq_sec',RQ_OPT.sec,m.sec))}
    ${A('ระบบภายในที่ต้องเชื่อม (ERP, HR, AD ฯลฯ)','rq_integ',m.integ)}${A('เอกสารแนบ','rq_attach',m.attach)}</div>
  <div class="fgroup"><h3>5. กำหนดเวลาและค่าใช้จ่าย</h3></div><div class="formg">${F('ต้องการใช้งาน',I('rq_need',m.need,'','date'))}${F('กำหนดเวลา',sel('rq_dl',RQ_OPT.dl,m.dl))}${F('Cost Center',I('rq_cc',m.cc))}
    ${A('ผลกระทบหากล่าช้า / ค่าใช้จ่ายเพิ่ม (ถ้ามี)','rq_impact',m.impact)}</div>
  <div class="fgroup"><h3>6. สิ่งที่ต้องการเมื่อส่งมอบ</h3></div><div class="formg">${chips('dv',RQ_DEL,m.del)}</div>
  ${D('sg','7. ลงนาม','ไม่บังคับ · เว้นว่างไว้เซ็นมือได้',RQ_SIGN.map(([k,,role])=>`<div class="formg">${F(role,I('rq_sn'+k,m.sign[k].n,'ชื่อ-นามสกุล'))}${F('วันที่',I('rq_sd'+k,m.sign[k].d,'','date'))}</div>`).join(''))}
  ${D('it','8. สำหรับฝ่าย IT','ฝ่าย IT เป็นผู้กรอก',`<div class="formg">${F('วันที่รับเรื่อง',I('rq_it_recv',m.it.recv,'','date'))}${F('ผลพิจารณา',sel('rq_it_res',RQ_OPT.res,m.it.res,'— ยังไม่พิจารณา —'))}
    ${F('ผู้รับผิดชอบ',I('rq_it_owner',m.it.owner))}${F('ประมาณการ (วัน)',I('rq_it_est',m.it.est,'จำนวนวันทำงาน','number'))}${F('วันเริ่มงาน',I('rq_it_start',m.it.start,'','date'))}${F('วันส่งมอบ',I('rq_it_done',m.it.done,'','date'))}
    ${A('ความเห็น','rq_it_note',m.it.note)}</div>`)}
  ${D('pv','ตัวอย่างก่อนพิมพ์ / PDF','ดูฟอร์มก่อนบันทึก',`<div class="fmprev" id="rq_prev" style="cursor:default;margin-top:12px"></div>${rqButtons(m)}`)}
  ${isNew?'':'<div class="btnlist"><button class="d" id="rq_del">ลบใบคำขอนี้</button></div>'}`);
  const pvOn=()=>open.pv&&$('rq_prev');if(pvOn())rqPrev($('rq_prev'),m);
  $('sheet').querySelectorAll('details[data-dk]').forEach(d=>d.addEventListener('toggle',()=>{open[d.dataset.dk]=d.open;if(d.dataset.dk==='pv'&&d.open){sync();rqPrev($('rq_prev'),m)}}));
  $('sheet').querySelectorAll('input,select,textarea').forEach(el=>{el.addEventListener('input',upd);el.addEventListener('change',upd)});
  $('sheet').querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{sync();const k=b.dataset.ty;m.types[k]=!m.types[k];redo()});
  $('sheet').querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>{sync();const k=b.dataset.dv;m.del[k]=!m.del[k];redo()});
  if($('rq_fadd'))$('rq_fadd').onclick=()=>{sync();m.feats.push({f:'',d:'',p:'ต้องมี'});redo()};
  $('sheet').querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{sync();m.feats.splice(+b.dataset.fdel,1);redo()});
  $('rq_x').onclick=()=>{sync();if(JSON.stringify(m)!==initial&&!confirm('ยังไม่ได้บันทึกการแก้ไข ออกโดยไม่บันทึกใช่ไหม?'))return;clearTimeout(tm);r&&r._id?rqView(rqList().find(x=>x._id===r._id)):closeSheet()};
  rqWire(()=>{sync();return m});
  $('rq_s').onclick=async()=>{sync();const need=[['rq_name','ชื่อผู้ขอ'],['rq_job','ชื่องาน']].find(([id])=>!String(val(id)||'').trim());
    if(need){toast('กรุณากรอก'+need[1]);const el=$(need[0]);el.scrollIntoView({block:'center'});el.focus();return}
    m.feats=m.feats.filter(x=>x.f||x.d);const b=$('rq_s');b.disabled=true;b.textContent='กำลังบันทึก…';clearTimeout(tm);const rec={...JSON.parse(JSON.stringify(m)),type:'req',by:me,at:nowIso()};if(r&&r._id)rec._id=r._id;
    try{await store.save('salekpi',rec);toast('บันทึกแล้ว');render();rqView(rec._id?rqList().find(x=>x._id===rec._id):DATA.salekpi[DATA.salekpi.length-1])}catch(e){toast(e.status===403?'ไม่มีสิทธิ์บันทึก':'บันทึกไม่สำเร็จ: '+e.message)}finally{if($('rq_s')){b.disabled=false;b.textContent='บันทึก'}}};
  if($('rq_del'))$('rq_del').onclick=async()=>{if(!confirm('ลบใบคำขอ “'+(m.no||'')+' '+(m.job||'')+'” ?'))return;try{await store.del('salekpi',r._id);closeSheet();toast('ลบแล้ว');render()}catch(e){toast('ลบไม่สำเร็จ: '+e.message)}};
  }
  let initial='';draw();sync();initial=JSON.stringify(m);if(!rqLogo())rqLoadLogo().then(()=>{if(open.pv&&$('rq_prev'))rqPrev($('rq_prev'),m)})}


/* ===== routing: hash <-> view, Back/Forward ===== */
const SK_HASH={meet:'#meet',jd:'#jd',req:'#req',cm:'#cmail'};
const skView=()=>({'#meet':'meet','#jd':'jd','#req':'req','#cmail':'cm'})[location.hash]||'salekpi';
let skDirty=false;
window.SKNAV={current:()=>view,go:k=>{if(view===k){scrollTo(0,0);return}history.pushState(null,'',SK_HASH[k]||(location.pathname+location.search));view=k;render();scrollTo(0,0)}};
$('sheet').addEventListener('input',()=>{skDirty=true});
addEventListener('popstate',()=>{const v=skView();if(v===view)return;
  if($('sheet').classList.contains('on')){if(skDirty&&!confirm('มีข้อมูลที่ยังไม่บันทึก ต้องการออกจากหน้านี้หรือไม่?')){history.pushState(null,'',SK_HASH[view]||(location.pathname+location.search));return}closeSheet()}
  view=v;render();scrollTo(0,0)});
addEventListener('beforeunload',e=>{if(skDirty&&$('sheet').classList.contains('on')){e.preventDefault();e.returnValue=''}});

/* ===== auto-update: reload once when a newer build is online ===== */
const SK_BUILD='2026-11-25.11';
async function skCheckUpdate(){try{if(document.querySelector('#sheet.on,.sheet.on'))return;const r=await fetch(location.pathname.replace(/[^/]*$/,'')+'index.html?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/SK_BUILD='([^']+)'/);
  if(m&&m[1]!==SK_BUILD){const k='sk-upd-'+m[1];if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.toString())}}catch(_){}}
skCheckUpdate();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')skCheckUpdate()});

boot();
</script>
<script>
/* ===== Sale Center navigation: sidebar (wide) / bottom bar + drawer (narrow) ===== */
(function(){
const I={kpi:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
 mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
 req:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
 so:'<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
 meet:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>',
 jd:'<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
 portal:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
 more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'};
const svg=k=>`<svg class="nvi" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${I[k]}</svg>`;
const M=[{k:'salekpi',href:'./',t:'KPI',s:'KPI',ic:'kpi',g:1},{k:'cm',href:'./#cmail',t:'เมลความต้องการ',s:'เมล',ic:'mail',g:1},
 {k:'req',href:'./#req',t:'ใบคำขอพัฒนาระบบ',s:'ใบคำขอ',ic:'req',g:1},{k:'so',href:'./so.html',t:'Check list SO',s:'SO',ic:'so',g:1},
 {k:'meet',href:'./#meet',t:'นัดประชุม',s:'นัดประชุม',ic:'meet',g:2},{k:'jd',href:'./#jd',t:'หน้าที่งาน (JD)',s:'JD',ic:'jd',g:2}];
const it=m=>`<li><a class="nvit" href="${m.href}" data-nv="${m.k}">${svg(m.ic)}<span>${m.t}</span></a></li>`;
const html=`<nav class="nvside" aria-label="เมนูหลัก"><div class="nvbrand"><b>Sale Center</b><span>Union Belt · UNB</span></div>
<div class="nvgh" id="nvg1">งานหลัก</div><ul aria-labelledby="nvg1">${M.filter(m=>m.g===1).map(it).join('')}</ul>
<div class="nvgh" id="nvg2">เอกสารแผนก</div><ul aria-labelledby="nvg2">${M.filter(m=>m.g===2).map(it).join('')}</ul></nav>
<nav class="nvbar" aria-label="เมนูหลัก">${M.filter(m=>m.g===1).map(m=>`<a class="nvtab" href="${m.href}" data-nv="${m.k}">${svg(m.ic)}<span>${m.s}</span></a>`).join('')}<button type="button" class="nvtab" id="nvmore" aria-haspopup="dialog" aria-expanded="false" aria-controls="nvdrawer">${svg('more')}<span>เพิ่มเติม</span></button></nav>
<div class="nvscrim" id="nvscrim" hidden></div>
<div class="nvdrawer" id="nvdrawer" role="dialog" aria-modal="true" aria-labelledby="nvdt" hidden><div class="nvdh"><b id="nvdt">เมนูเพิ่มเติม</b><button type="button" class="nvx" id="nvclose" aria-label="ปิดเมนู">${svg('x')}</button></div>
<div class="nvgh" id="nvg3">เอกสารแผนก</div><ul aria-labelledby="nvg3">${M.filter(m=>m.g===2).map(it).join('')}</ul></div>`;
document.body.insertAdjacentHTML('beforeend',html);document.body.classList.add('hasnav');
const $=id=>document.getElementById(id),more=$('nvmore'),dr=$('nvdrawer'),sc=$('nvscrim');
const cur=()=>window.SKNAV&&SKNAV.current?SKNAV.current():'so';
function sync(){const c=cur();document.querySelectorAll('[data-nv]').forEach(a=>{if(a.dataset.nv===c)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const inMore=M.some(m=>m.g===2&&m.k===c);more.classList.toggle('on',inMore);more.setAttribute('aria-label',inMore?'เพิ่มเติม (หน้าปัจจุบันอยู่ในเมนูนี้)':'เพิ่มเติม')}
function open(){dr.hidden=false;sc.hidden=false;more.setAttribute('aria-expanded','true');(dr.querySelector('[aria-current]')||dr.querySelector('a,button.nvx')).focus()}
function close(back){if(dr.hidden)return;dr.hidden=true;sc.hidden=true;more.setAttribute('aria-expanded','false');if(back!==false)more.focus()}
more.onclick=()=>dr.hidden?open():close();$('nvclose').onclick=()=>close();sc.onclick=()=>close();
dr.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();return}
  if(e.key==='Tab'){const F=[...dr.querySelectorAll('a,button')];const f=F[0],l=F[F.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-nv]');if(!a)return;const k=a.dataset.nv;
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0){return}
  if(window.SKNAV&&SKNAV.go&&k!=='so'){e.preventDefault();close(false);SKNAV.go(k);sync();const t=document.querySelector('main');if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true})}}else close(false)});
window.addEventListener('resize',()=>{if(innerWidth>=1000)close(false)});
window.skNavSync=sync;sync();
})();
</script>
