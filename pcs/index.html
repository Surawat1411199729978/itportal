/* ---------- QT (quotation) PDF: read QT number and totals ---------- */
const QT_NO_RE = /QT\s*\d{4}\s*-\s*\d{3,6}/i;
const QT_LABELS = [
  { k: 'afterDisc', name: 'ราคาหลังหักส่วนลด', re: /หลัง\s*หัก\s*ส่วนลด|after\s*discount/i },
  { k: 'grand', name: 'รวมทั้งสิ้น', re: /รวม\s*ทั.?ง\s*สิ.?น|grand\s*total|ยอด\s*สุทธิ|net\s*total|total\s*amount/i },
  { k: 'vat', name: 'VAT', re: /ภาษี\s*มูลค่า\s*เพิ่ม|\bvat\b/i },
  { k: 'discount', name: 'ส่วนลด', re: /ส่วนลด|discount/i },
  { k: 'subtotal', name: 'รวมเป็นเงิน', re: /รวม\s*เป็น\s*เงิน|รวม\s*เงิน|ราคา\s*รวม|ยอด\s*รวม|sub\s*-?\s*total|^\s*total\b/i },
];
function parseQtItems(items) {
  const lines = groupLines(items).map(ln => ({ text: clean(ln.items.map(i => i.str).join(' ')), toks: ln.items.map(i => clean(i.str)) }));
  const all = lines.map(l => l.text).join('\n');
  const m = all.match(QT_NO_RE);
  const out = { qtNo: m ? m[0].replace(/\s+/g, '').toUpperCase() : '', found: {} };
  for (const ln of lines) {
    const lab = QT_LABELS.find(L => L.re.test(ln.text)); if (!lab) continue;
    const nums = ln.toks.flatMap(t => t.split(/\s+/)).filter(t => /^-?[\d,]+\.\d{2}$/.test(t)).map(num);
    if (!nums.length) continue;
    out.found[lab.k] = nums[nums.length - 1];       // last occurrence wins (summary block is at the end)
  }
  const f = out.found;
  if (f.afterDisc) { out.price = f.afterDisc; out.how = 'ราคาหลังหักส่วนลด'; }
  else if (f.grand && f.vat) { out.price = r2(f.grand - f.vat); out.how = 'รวมทั้งสิ้น − VAT'; }
  else if (f.subtotal && f.discount && f.discount < f.subtotal) { out.price = r2(f.subtotal - f.discount); out.how = 'รวมเป็นเงิน − ส่วนลด'; }
  else if (f.subtotal) { out.price = f.subtotal; out.how = 'รวมเป็นเงิน'; }
  else if (f.grand) { out.price = r2(f.grand / 1.07); out.how = 'รวมทั้งสิ้น ÷ 1.07'; }
  return out;
}
let pendingQt = null;
async function importQtFiles(fileList, target) {
  const files = [...fileList].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!files.length) { toast('เลือกได้เฉพาะไฟล์ PDF'); return; }
  setStatus('กำลังอ่านใบเสนอราคา…', 'busy');
  const done = [], miss = [], orphan = [];
  buildQtGroups();
  const known = new Set(Object.keys(qtLabel));
  for (const file of files) {
    try {
      const q = parseQtItems(await pdfItems(await file.arrayBuffer()));
      let no = (files.length === 1 && target) ? target : (q.qtNo || target || '');
      if (!no) { miss.push(file.name); continue; }
      no = qtId(no);
      const rec = Object.assign({}, qts.get(no) || {}, { qtNo: no, file: file.name, auto: { ...q.found, price: q.price ?? null, how: q.how || '', readNo: q.qtNo || '' }, updated: Date.now() });
      if (!rec.manual) rec.price = q.price ?? null;
      if (Store.assets) {
        try { const a = await Store.assets.upload(file); if (rec.assetId && rec.assetId !== a.id) { try { await Store.assets.delete(rec.assetId); } catch (e) {} } rec.assetId = a.id; }
        catch (e) { toast('เก็บไฟล์ไม่ได้ (' + (e.code || e.message) + ') แต่บันทึกราคาแล้ว'); }
      }
      qts.set(no, rec); await Store.saveQt(rec);
      done.push(no + (rec.price != null ? ' = ' + fmt(rec.price) : ' (อ่านราคาไม่ได้ ใส่เองได้)'));
      if (!known.has(no)) orphan.push(no);
      if (q.qtNo && target && qtId(q.qtNo) !== qtId(target)) toast(`หมายเหตุ: ในไฟล์เขียนว่า ${q.qtNo} แต่แนบไว้ที่ ${target}`);
    } catch (e) { console.error(e); miss.push(file.name); }
  }
  setStatus(storageLabel());
  renderSummary();
  let msg = done.length ? 'แนบ QT แล้ว: ' + done.join(', ') : '';
  if (orphan.length) msg += ` · ยังไม่มีใบ PCS ที่ใส่เลข ${orphan.join(', ')}`;
  if (miss.length) msg += (msg ? ' · ' : '') + 'ไม่พบเลข QT ในไฟล์ ' + miss.join(', ') + ' (กดปุ่ม “แนบ QT” ที่แถวนั้นแทน)';
  toast(msg);
}

function groupBy(list, keyFn) {
  const m = new Map();
  list.forEach(f => {
    const k = keyFn(f); if (!m.has(k)) m.set(k, { key: k, items: [], dm: 0, dl: 0, oh: 0, cost: 0, sell: 0, profit: 0 });

const splitQt = v => String(v || '').toUpperCase().split(/[\s,;、]+|\s*\/\s*(?=QT)/).map(x => x.trim()).filter(Boolean);

function buildQtGroups() {
  const parent = {};
  const find = x => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  sheets.forEach(s => {
    const q = splitQt(s.quoteNo);
    q.forEach(x => { if (!(x in parent)) parent[x] = x; });
    for (let i = 1; i < q.length; i++) { const a = find(q[0]), b = find(q[i]); if (a !== b) parent[b] = a; }
  });
  qts.forEach((r, id) => { if (id && !(id in parent)) parent[id] = id; });
  const members = {};
  Object.keys(parent).forEach(x => (members[find(x)] = members[find(x)] || []).push(x));
  qtLabel = {};
  Object.keys(parent).forEach(x => (qtLabel[x] = members[find(x)].sort().join(', ')));
}

/* ---------- QT ⇄ PCS links (stored on each PCS as its QT number list) ---------- */
async function saveSheetsQuiet(list) {
  for (const s of list) { s.updated = Date.now(); try { await Store.saveSheet(s); } catch (e) { setStatus('บันทึกไม่สำเร็จ', 'err'); } }
  setStatus(storageLabel());
}
async function createQt(raw) {
  const no = qtId(raw);
  if (!/^QT/.test(no) || no.length < 6) { toast('ใส่เลข QT ให้ถูก เช่น QT6911-00012'); return; }
  buildQtGroups();
  if (qts.has(no) || qtLabel[no]) { toast(no + ' มีอยู่แล้ว'); sumOpen.add(qtLabel[no] || no); renderSummary(); return; }
  const r = { qtNo: no, price: null, created: Date.now(), updated: Date.now() };
  qts.set(no, r);
  try { await Store.saveQt(r); setStatus(storageLabel()); } catch (e) { setStatus('บันทึกไม่สำเร็จ', 'err'); }
  sumOpen.add(no); renderSummary(); toast('สร้าง ' + no + ' แล้ว · เพิ่มใบ PCS ได้เลย');
  setTimeout(() => { const i = document.querySelector(`[data-qtaddpcs="${no}"]`); if (i) i.focus(); }, 0);
}
function findSheetByNo(tok) {
  const t = String(tok || '').trim().toUpperCase(); if (!t) return null;
  const list = [...sheets.values()];
  return list.find(s => (s.no || '').toUpperCase() === t)
    || list.find(s => (s.no || '').toUpperCase().endsWith(t.replace(/^PCS/, '')))
    || null;
}
async function addPcsToQt(qtNo, text) {
  const toks = String(text || '').split(/[\s,;]+/).filter(Boolean);
  if (!toks.length) { toast('พิมพ์เลข PCS ก่อน'); return; }
  const id = qtId(qtNo); const changed = [], missing = [], already = [], merged = [];
  if (saveQ.timer) await flushSheet();
  for (const tk of toks) {
    const s = findSheetByNo(tk); if (!s) { missing.push(tk); continue; }
    const q = splitQt(s.quoteNo);
    if (q.some(x => qtId(x) === id)) { already.push(s.no); continue; }
    if (q.length) merged.push(s.no + ' (' + q.join(', ') + ')');
    s.quoteNo = [...q, id].join(', ');
    changed.push(s);
  }
  if (!qts.has(id)) { const r = { qtNo: id, price: null, created: Date.now(), updated: Date.now() }; qts.set(id, r); try { await Store.saveQt(r); } catch (e) {} }
  await saveSheetsQuiet(changed);
  buildQtGroups(); sumOpen.add(qtLabel[id] || id); renderSummary();
  let msg = changed.length ? `เพิ่ม ${changed.map(s => s.no).join(', ')} เข้า ${id} แล้ว` : '';
  if (merged.length) msg += ` · ${merged.join(', ')} อยู่ใน QT อื่นด้วย จึงรวมเป็นกลุ่มเดียวกัน`;
  if (already.length) msg += (msg ? ' · ' : '') + already.join(', ') + ' อยู่ใน QT นี้แล้ว';
  if (missing.length) msg += (msg ? ' · ' : '') + 'ไม่พบ ' + missing.join(', ');
  toast(msg);
}
async function removePcsFromGroup(sheetId, key) {
  const s = sheets.get(sheetId); if (!s) return;
  const members = new Set(key.split(', ').map(qtId));
  s.quoteNo = splitQt(s.quoteNo).filter(q => !members.has(qtId(q))).join(', ');
  if (saveQ.timer) await flushSheet();
  await saveSheetsQuiet([s]);
  // keep the QT itself so it can be refilled
  key.split(', ').forEach(m => { const id = qtId(m); if (!qts.has(id)) { const r = { qtNo: id, price: null, created: Date.now(), updated: Date.now() }; qts.set(id, r); Store.saveQt(r).catch(() => {}); } });
  renderSummary(); toast('เอา ' + s.no + ' ออกจาก ' + key + ' แล้ว');
}
function exportSummaryCSV() {
  const list = sumFiltered().sort((a, b) => (a.s.no || '').localeCompare(b.s.no || ''));
  const L = []; const add = (...a) => L.push(a.map(csvCell).join(','));
  add('สรุป Margin', 'ส่งออก ' + thDate(todayISO()));
  add('No. PCS', 'CRC', 'วันที่', 'BOM', 'ลูกค้า', 'Sale', 'DM', 'DL', 'OH', 'ต้นทุนรวม', 'ราคาขาย', 'ราคาขายจริง (ใบเสนอราคา)', 'กำไร', 'Margin %', 'Margin จริง %');
  list.forEach(f => { const rs = blankVal(f.s.realSell) ? null : num(f.s.realSell); add(f.s.no, crcOf(f.s), thDate(f.s.date), f.s.bomRef, f.s.customer, f.s.sale, f.dm.toFixed(2), f.dl.toFixed(2), f.oh.toFixed(2), f.cost.toFixed(2), f.sell.toFixed(2), rs === null ? '' : rs.toFixed(2), f.profit.toFixed(2), (f.sell ? f.profit / f.sell * 100 : 0).toFixed(2), rs ? ((rs - f.cost) / rs * 100).toFixed(2) : ''); });
  const t = groupBy(list, () => 'all')[0];
  if (t) { const wr = list.filter(f => !blankVal(f.s.realSell)); const rs = r2(wr.reduce((a, f) => a + num(f.s.realSell), 0)), rc = r2(wr.reduce((a, f) => a + f.cost, 0));
    add('รวม', '', '', '', '', '', t.dm.toFixed(2), t.dl.toFixed(2), t.oh.toFixed(2), t.cost.toFixed(2), t.sell.toFixed(2), wr.length ? rs.toFixed(2) : '', t.profit.toFixed(2), t.margin.toFixed(2), rs ? ((rs - rc) / rs * 100).toFixed(2) : ''); }
  Store.download('margin-summary-' + todayISO() + '.csv', '﻿' + L.join('\r\n'));
}

/* ---------- edits ---------- */
function lineByRef(ref) {
  if (ref.startsWith('x:')) return cur.extra[+ref.slice(2)];
  const [di, li] = ref.split(':').map(Number);
  return cur.docs[di] && cur.docs[di].lines[li];
}
function remember(code, patch) {
  if (!code) return;
  config.codes[code] = Object.assign({}, config.codes[code], patch);
  touchConfig();
}

  return `<div class="wf-paper${ro ? ' ro' : ''}">
    <div class="wf-co">บริษัท ยูเนียนเบลท์ อินเตอร์เนชั่นแนล จำกัด</div>
    <table class="wf-head"><tbody>
      <tr><td rowspan="4" class="wf-logo">${UNB_LOGO}</td><td rowspan="2" class="wf-c"><b>Work From</b></td><th>รหัสเอกสาร (Doc No.)</th><td class="wf-c">FM-SAL-01-02</td></tr>
      <tr><th>แก้ไขครั้งที่ (Revision)</th><td class="wf-c">0</td></tr>
      <tr><td rowspan="2" class="wf-c"><b>เรื่อง / Title : กำหนดราคาขาย</b></td><th class="wf-sm">วันที่บังคับใช้ (Effective date)</th><td class="wf-c">11/1/2568</td></tr>
      <tr><th>หน้าที่ (Page)</th><td class="wf-c">1</td></tr>
    </tbody></table>
    <div class="wf-info"><b>Head Information</b>
      <div><b>Sale :</b> ${inp(w.sale, 'data-wff="sale" list="dl-sale" aria-label="Sale"', 'wf-w1')}</div>
      <div><b>Customer :</b> ${inp(w.customer, 'data-wff="customer" list="dl-cust" aria-label="Customer"', 'wf-w2')}</div>
      <div><b>Docs No. :</b> <span class="wf-v">${esc(w.docNo)}</span></div>
    </div>
    ${ro ? '' : `<div class="wf-rowbtns"><button class="wf-sbtn" data-act="wfadd">+ เพิ่มรายการ</button><button class="wf-sbtn" data-act="wfdel">- ลบรายการ</button><span class="muted">เพิ่มด่วน:</span>${WF_PRESETS.map(p => `<button class="wf-sbtn ghost" data-wfpreset="${esc(p)}">+ ${esc(p)}</button>`).join('')}</div>`}
    <div class="wf-items-wrap"><table class="wf-items"><thead><tr><th class="c-no">No.</th><th>Product Code</th><th>Detail</th><th class="c-q">Qty</th><th class="c-u">Unit</th><th>Price/Unit</th><th>Discount (% / ฿)</th><th>Total Price</th></tr></thead><tbody>
      ${w.rows.map((r, i) => `<tr>
        <td class="wf-c">${i + 1}</td>
        <td>${inp(r.code, `data-wfr="code" data-i="${i}" aria-label="Product Code ${i + 1}"`)}</td>
        <td>${inp(r.detail, `data-wfr="detail" data-i="${i}" aria-label="Detail ${i + 1}"`)}</td>
        <td>${inp(wfNum(r.qty), `data-wfr="qty" data-i="${i}" inputmode="decimal" aria-label="Qty ${i + 1}"`, 'n')}</td>
        <td>${ro ? `<span class="wf-v">${esc(r.unit)}</span>` : `<select class="wf-in" data-wfr="unit" data-i="${i}" aria-label="Unit ${i + 1}">${[...new Set([...WF_UNITS, r.unit].filter(Boolean))].map(u => `<option${u === r.unit ? ' selected' : ''}>${esc(u)}</option>`).join('')}</select>`}</td>
        <td>${ro ? `<span class="wf-v n">${money(r.price === '' ? '' : num(r.price))}</span>` : inp(wfNum(r.price), `data-wfr="price" data-i="${i}" inputmode="decimal" aria-label="Price/Unit ${i + 1}"`, 'n')}</td>
        <td class="wf-disc">${ro ? `<span class="wf-v">${r.dp !== '' && num(r.dp) ? num(r.dp) + '%' : ''}${r.db !== '' && num(r.db) ? (num(r.dp) ? ' + ' : '') + fmt(num(r.db)) + ' ฿' : ''}</span>`
          : `<input class="wf-in n" data-wfr="dp" data-i="${i}" inputmode="decimal" value="${esc(wfNum(r.dp))}" placeholder="%" aria-label="ส่วนลด % ${i + 1}"><input class="wf-in n" data-wfr="db" data-i="${i}" inputmode="decimal" value="${esc(wfNum(r.db))}" placeholder="฿" aria-label="ส่วนลดบาท ${i + 1}">`}</td>
        <td class="wf-rt n" id="wf-rt-${i}">${fmt(k.rows[i].t)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="wf-tot" id="wf-tot">${wfTotHTML(k)}</div>
    <table class="wf-sign"><thead><tr>${WF_SIGNS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead>
      <tbody><tr>${WF_SIGNS.map(sigCell).join('')}</tr><tr>${WF_SIGNS.map(dateCell).join('')}</tr></tbody></table>
  </div>`;
}
function wfTotHTML(k) {
  return `<div><span>Total :</span><span>${fmt(k.total)}</span></div><div><span>Discount :</span><span>${fmt(k.disc)}</span></div>
    <div><span>After Discount Price :</span><span>${fmt(k.after)}</span></div><div><span>VAT 7% :</span><span>${fmt(k.vat)}</span></div>
    <div class="g"><span>Total Price :</span><span>${fmt(k.grand)}</span></div>`;
}
function renderWf() {
  const el = $('#view-wf'); if (!wf) wf = wfBlank();
  const k = wfCalc(wf);
  const saved = [...sheets.values()].filter(s => s.workForm).sort((a, b) => (b.workForm.savedAt || 0) - (a.workForm.savedAt || 0));
  const docs = [...new Set([...sheets.values()].flatMap(s => [crcOf(s), ...(s.docs || []).filter(d => d.role === 'main').map(d => d.docNo)]).filter(Boolean))].sort().reverse();
  const canSave = !!sheets.get(wf.sheetId);
  el.innerHTML = `
  <div class="erp">
    <div class="erp-title"><h1>ใบกำหนดราคาขาย</h1><div class="erp-crumb">งานขาย › <b>ใบกำหนดราคาขาย</b><span class="muted"> · FM-SAL-01-02</span></div></div>
    <div class="erp-card erp-search">
      <div class="sf-grid wf-pick">
        <label class="sf-l" for="wf-doc">เลข CRC / CRR</label>
        <div class="sf-last"><input class="sf-in" id="wf-doc" list="dl-wfdoc" value="${esc(wf.docNo)}" placeholder="เช่น CRC2611-0007 แล้วกด Enter" autocomplete="off">
          <div class="sf-btns"><button class="ebtn primary" data-act="wfload">ดึงข้อมูล</button>${wf.sheetId ? '<button class="ebtn" data-act="wfrefill" title="ดึงลูกค้า, Sale และราคาจาก PCS ใหม่ (ลายเซ็นยังอยู่)">ดึงจาก PCS ใหม่</button>' : ''}<button class="ebtn" data-act="wfnew">ใบใหม่</button></div></div>
        <label class="sf-l" for="wf-saved">ใบที่บันทึกไว้</label>
        <select class="sf-in sf-span3" id="wf-saved"><option value="">— เลือกเพื่อเปิด (${saved.length} ใบ) —</option>${saved.map(s => `<option value="${s.id}"${s.id === wf.sheetId && !wfDirty ? ' selected' : ''}>${esc(s.workForm.docNo || crcOf(s))} · ${esc(s.workForm.customer || s.customer || '')} · ${fmt(wfCalc(s.workForm).grand)}</option>`).join('')}</select>
      </div>
      <datalist id="dl-wfdoc">${docs.map(d => `<option value="${esc(d)}">`).join('')}</datalist>
    </div>
    <div class="erp-card wf-ref" id="wf-ref">${wfRefHTML(k)}</div>
    <div class="erp-card wf-card">${wfPaperHTML(wf, false)}</div>
    <div class="wf-actions">
      <button class="ebtn primary" data-act="wfsave"${canSave ? '' : ' disabled title="ต้องมีใบ PCS ของเลขนี้ก่อน"'}>💾 Save</button>
      <button class="ebtn" data-act="wfprint">🖨 Print</button>
      <button class="ebtn danger-fill" data-act="wfpdf">📄 Export PDF</button>
      <span class="wf-state ${wfDirty ? 'dirty' : 'clean'}">${wfDirty ? 'ยังไม่บันทึก' : wf.savedAt ? 'บันทึกแล้ว ' + new Date(wf.savedAt).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : ''}</span>
      ${wf.lastPdf && wf.lastPdf.url ? `<a class="elink" href="${esc(wf.lastPdf.url)}" target="_blank" rel="noopener">เปิด PDF ล่าสุดใน SharePoint</a>` : ''}
    </div>
    ${peopleLists()}
  </div>`;
}
function wfRefresh() { const k = wfCalc(wf); k.rows.forEach((r, i) => { const c = $('#wf-rt-' + i); if (c) c.textContent = fmt(r.t); }); $('#wf-tot').innerHTML = wfTotHTML(k); $('#wf-ref').innerHTML = wfRefHTML(k); const st = document.querySelector('.wf-state'); if (st) { st.className = 'wf-state dirty'; st.textContent = 'ยังไม่บันทึก'; } }
function wfTouch() { wfDirty = true; wfRefresh(); }
async function wfSave() {
  const s = wf && sheets.get(wf.sheetId);
  if (!s) { toast('ยังไม่พบใบ PCS ของเลขนี้ · บันทึกไม่ได้'); return; }
  const ae = document.activeElement; if (ae && ae.blur && ae !== document.body) ae.blur();
  const data = clone(wf); delete data.sheetId; data.savedAt = Date.now(); data.pcsNo = s.no;
  s.workForm = data; s.updated = Date.now();
  setStatus('กำลังบันทึก…', 'busy');
  try { await Store.saveSheet(s); wf.savedAt = data.savedAt; wfDirty = false; setStatus(storageLabel()); toast(`บันทึกใบกำหนดราคาของ ${wf.docNo || s.no} แล้ว`); }
  catch (e) { setStatus('บันทึกไม่สำเร็จ', 'err'); toast('บันทึกไม่สำเร็จ: ' + (Store.mode === 'onedrive' ? odErrText(e) : (e && e.message) || 'ลองอีกครั้ง')); }
  renderWf(); renderCmdbar();
}
function wfPrint() {
  const p = $('#wf-print'); p.innerHTML = wfPaperHTML(wf, true);
  try { window.print(); } catch (e) { toast('พิมพ์จากหน้านี้ไม่ได้ · ใช้ Export PDF แทน'); }
}
function loadScript(src, test) {
  if (test()) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => (test() ? res() : rej(new Error('โหลดไม่สำเร็จ'))); s.onerror = () => rej(new Error('โหลดตัวสร้าง PDF ไม่ได้')); document.head.appendChild(s); });
}
async function wfPdf() {
  const btn = document.querySelector('[data-act="wfpdf"]'); if (btn) { btn.disabled = true; btn.textContent = 'กำลังสร้าง PDF…'; }
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => !!window.html2canvas);
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => !!(window.jspdf && window.jspdf.jsPDF));
    const cap = $('#wf-cap'); cap.innerHTML = wfPaperHTML(wf, true);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await window.html2canvas(cap.firstElementChild, { scale: 2, backgroundColor: '#ffffff', logging: false });
    cap.innerHTML = '';
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const m = 8, pw = 297 - m * 2, ph = 210 - m * 2;
    let iw = pw, ih = canvas.height * pw / canvas.width; if (ih > ph) { ih = ph; iw = canvas.width * ph / canvas.height; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', m + (pw - iw) / 2, m, iw, ih);
    const blob = pdf.output('blob');
    const name = `${(wf.docNo || 'WorkForm').replace(/[\\/:*?"<>|#%]+/g, '-')} กำหนดราคาขาย.pdf`;
    { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }
    if (Store.mode === 'onedrive') {
      setStatus('กำลังบันทึก PDF ลง SharePoint…', 'busy');
      try { const r = await OD.putBlob(OD.exportId, name, blob); wf.lastPdf = { name, url: r.url, at: Date.now() }; toast(`ดาวน์โหลด ${name} และเก็บไว้ที่ SharePoint › ${OD_APP} › Export แล้ว`); }
      catch (e) { toast('ดาวน์โหลดแล้ว แต่เก็บลง SharePoint ไม่ได้: ' + odErrText(e)); }
      setStatus(storageLabel());
    } else toast('ดาวน์โหลด ' + name);
  } catch (e) { console.error(e); setStatus(storageLabel()); toast('สร้าง PDF ไม่สำเร็จ: ' + (e.message || odErrText(e))); }
  renderWf();
}
/* signature pad */
let sigFor = null;
function openSig(k) {
  sigFor = k; const m = $('#sig-modal'); m.hidden = false;
  $('#sig-title').textContent = 'เซ็นชื่อ — ' + (WF_SIGNS.find(x => x[0] === k) || [, ''])[1];
  const c = $('#sig-pad'); const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height); c.dataset.ink = '';
}
function closeSig() { $('#sig-modal').hidden = true; sigFor = null; }
function saveSig() {
  const c = $('#sig-pad'); if (!c.dataset.ink) { toast('ยังไม่ได้เซ็น · ลากเมาส์หรือนิ้วในกรอบ'); return; }
  const o = document.createElement('canvas'); o.width = 300; o.height = 100; o.getContext('2d').drawImage(c, 0, 0, 300, 100);
  wf.sign[sigFor] = Object.assign({}, wf.sign[sigFor], { img: o.toDataURL('image/png'), date: (wf.sign[sigFor] || {}).date || todayISO() });
  closeSig(); wfDirty = true; renderWf();
}
(function sigPad() {
  let drawing = false, last = null;
  const pos = (c, e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  document.addEventListener('pointerdown', e => { const c = e.target.closest && e.target.closest('#sig-pad'); if (!c) return; drawing = true; last = pos(c, e); c.setPointerCapture(e.pointerId); e.preventDefault(); });
  document.addEventListener('pointermove', e => {
    if (!drawing) return; const c = $('#sig-pad'); const p = pos(c, e); const x = c.getContext('2d');
    x.strokeStyle = '#1d2b6b'; x.lineWidth = 3.2; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(last[0], last[1]); x.lineTo(p[0], p[1]); x.stroke(); last = p; c.dataset.ink = '1';
  });
  document.addEventListener('pointerup', () => { drawing = false; });
})();

let errToastAt = 0;
function softError(e) { console.error(e); const now = Date.now(); if (now - errToastAt > 15000) { errToastAt = now; toast('มีข้อผิดพลาดเล็กน้อย · ข้อมูลยังอยู่ครบ ใช้งานต่อได้'); } }
window.addEventListener('error', e => { if (e && e.message && !/ResizeObserver|Script error/i.test(e.message)) softError(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { softError(e.reason); e.preventDefault && e.preventDefault(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveQ.timer) flushSheet(); });
window.addEventListener('online', () => { if (saveQ.timer || journalCount()) { flushSheet(); journalRecover().then(n => n && setStatus(storageLabel())); } });
window.addEventListener('beforeunload', e => { if (saveQ.timer || saveQ.busy || (typeof wfDirty !== 'undefined' && wfDirty && view === 'wf')) { if (saveQ.timer) flushSheet(); e.preventDefault(); e.returnValue = ''; } });
(async function boot() {
 try {
  await Store.init();
  let loaded = false;
  for (let i = 0; i < 3 && !loaded; i++) {
    try { await Store.loadAll(); loaded = true; }
    catch (e) {
      console.warn('load', Store.mode, e);
      if (Store.mode === 'onedrive') { Store.odError = e; Store.mode = Store.db ? 'cloud' : 'local'; sheets.clear(); }
      else if (i < 2) { $('#loading').textContent = 'กำลังโหลดข้อมูล… ลองอีกครั้ง'; sheets.clear(); await new Promise(r => setTimeout(r, 1500 * (i + 1))); }
    }
  }
  if (!loaded) { Store.loadFailed = true; Store.mode = 'local'; sheets.clear(); await Store.loadAll().catch(() => {}); }
  oneDriveBanner();
  if (!config.rules || !config.rules.length) config.rules = DEFAULT_RULES.map(r => ({ ...r }));
  if (!config.codes) config.codes = {};
  if (!config.pct) config.pct = defaultConfig().pct;
  if (!Array.isArray(config.customers) && sheets.size) { importCustomersFromSheets(); touchConfig(); }
  const latest = [...sheets.values()].sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
  cur = latest || newSheet();
  if (isMgr() && sheets.size) view = 'list';
  setStatus(storageLabel());
  render();
  if (Store.loadFailed) showBanner('<div class="row"><span>โหลดข้อมูลจากเว็บไม่ได้ · ตอนนี้ใช้ข้อมูลในเบราว์เซอร์นี้ชั่วคราว</span><div class="spacer"></div><button class="btn sm primary" data-act="reload">โหลดใหม่</button></div>');
  const rec = await journalRecover();
  if (rec) { render(); setStatus(storageLabel()); toast(`กู้คืนใบที่ยังไม่ได้บันทึก ${rec} ใบ และบันทึกแล้ว`); }
 } catch (e) {
  console.error('boot', e);
  const l = $('#loading'); if (l) { l.hidden = false; l.innerHTML = 'เปิดหน้าไม่สำเร็จ · ข้อมูลยังอยู่ครบ <button class="btn sm primary" data-act="reload">โหลดใหม่</button>'; }
 }
})();

</script>
