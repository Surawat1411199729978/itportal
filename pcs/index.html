<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>PCS Price Sheet · UNB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PCS Pricing">
<meta name="theme-color" content="#ffffff">
<style>
/* Layout: a workbench — sticky top bar, one working column (max 1280px); the price table is the centre of gravity, detail tabs below. */
:root{
  --bg:#f1f4f7; --surface:#ffffff; --surface-2:#eaeef2; --ink:#15202a; --muted:#5a6876; --line:#d6dde4;
  --accent:#0e6a87; --accent-ink:#ffffff; --accent-soft:#dff0f6;
  --warn:#a85c0a; --warn-soft:#fcefdc; --good:#1b7549; --good-soft:#e0f3e8; --bad:#b3261e; --bad-soft:#fbe4e2;
  --dm:#0e6a87; --dl:#6b4fb3; --oh:#8a6a12;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b252f; --ink:#e3e9ef; --muted:#93a1ae; --line:#283541;
  --accent:#4fb4d6; --accent-ink:#04202b; --accent-soft:#143241;
  --warn:#eba653; --warn-soft:#3a2912; --good:#56c48f; --good-soft:#123826; --bad:#f08077; --bad-soft:#3d1a18;
  --dm:#4fb4d6; --dl:#a993ec; --oh:#d9b44a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b252f; --ink:#e3e9ef; --muted:#93a1ae; --line:#283541;
  --accent:#4fb4d6; --accent-ink:#04202b; --accent-soft:#143241;
  --warn:#eba653; --warn-soft:#3a2912; --good:#56c48f; --good-soft:#123826; --bad:#f08077; --bad-soft:#3d1a18;
  --dm:#4fb4d6; --dl:#a993ec; --oh:#d9b44a; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em}
.brand-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{display:block}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:9px 14px;font-size:15px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.8}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.status.busy .dot{background:var(--warn)} .status.err .dot{background:var(--bad)} .status.err{color:var(--bad)}

main{max-width:1280px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
main{grid-template-columns:minmax(0,1fr)}
main>section{display:grid;gap:16px;min-width:0;grid-template-columns:minmax(0,1fr)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:600}
.card-b{padding:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.confirm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.icon-x{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:16px;line-height:1}
.icon-x:hover{color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* sheet head */
.sheet-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sheet-head h1{font-size:24px;font-weight:700}
.sheet-head>.row{max-width:100%;min-width:0}
.drop>div{min-width:0;flex:1 1 auto}
.drop.big>div{flex:none;max-width:100%}
.sheet-head .crumb{font-size:12.5px;color:var(--muted)}

/* drop zone */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .dz-ic{width:44px;height:44px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.drop .dz-t{font-weight:600;font-size:15px}
.drop .dz-s{color:var(--muted);font-size:13px}
.drop.big{padding:36px 24px;flex-direction:column;text-align:center}
.drop.big .dz-ic{width:60px;height:60px}
.drop.big .dz-t{font-size:18px;font-family:var(--f-display)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px;text-align:left;width:100%;max-width:820px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
.step b{display:block;font-size:12px;color:var(--accent);font-family:var(--f-mono);font-weight:500}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 10px;max-width:100%;min-width:0}
.chip .c-no{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.chip .c-name{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.chip .c-amt{font-family:var(--f-mono);font-size:12.5px}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.badge.main{background:var(--accent-soft);color:var(--accent)}
.badge.sub{background:var(--surface-2);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

/* forms */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.fields{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.fields label{font-size:13px;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 11px;min-width:0;min-height:38px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in[readonly]{background:var(--surface-2)}
.in.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.kpi .k-v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi.hl .k-v{color:var(--accent)}
.margin-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.margin-bar i{display:block;height:100%;background:var(--good);border-radius:3px}

/* tables */
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th.num{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
td .in{padding:4px 8px}
td .in.n{width:96px}
td .in.pct{width:72px}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.pill.SP{color:var(--good)} .pill.DM{color:var(--dm)} .pill.DL{color:var(--dl)} .pill.OH{color:var(--oh)}
tr.zero td{color:var(--muted)}
tr.group td{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);padding:5px 10px}
.edited{position:relative}
.edited::after{content:"";position:absolute;top:4px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.pos{color:var(--bad)} .neg{color:var(--good)}
.name-warn{background:var(--warn-soft)!important}
.list-tbl td{white-space:nowrap}
.list-tbl td.bom{white-space:normal;min-width:240px;max-width:300px;font-size:13px}
.list-tbl td .in{padding:4px 8px;font-size:13px}
.list-tbl .in.q{width:150px;font-family:var(--f-mono)}
.list-tbl .in.cu{width:240px}
.list-tbl .in.sa{width:120px}
.mg{font-weight:500}.mg.lo{color:var(--bad)}.mg.mid{color:var(--warn)}.mg.hi{color:var(--good)}

/* totals */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0;border-top:1px solid var(--line)}
.tcol{padding:12px 16px;display:grid;gap:6px;align-content:start}
.tcol+.tcol{border-left:1px solid var(--line)}
@media (max-width:720px){.tcol+.tcol{border-left:0;border-top:1px solid var(--line)}}
.tline{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tline .l{color:var(--muted);font-size:13px}
.tline.strong .l{color:var(--ink);font-weight:600}
.tline.strong .num{font-weight:600;font-size:15px}
.tline .in.n{width:150px}
.tline.sell .num,.tline.sell .in{font-size:17px}

.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.subtab{border:0;background:transparent;padding:11px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.subtab .count{font-family:var(--f-mono);font-size:11px;margin-left:4px}

.note{font-size:12.5px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

details.sublines summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.sub-card{display:grid;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sub-card:last-child{border-bottom:0}
.sub-top{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.sub-figs{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.sub-figs span{color:var(--muted)} .sub-figs b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;pointer-events:none}
.overlay div{background:var(--surface);padding:18px 26px;border-radius:10px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--accent)}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
/* margin summary */
.mcell{display:flex;align-items:center;gap:8px;min-width:120px}
.mpill{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:1px 7px;border-radius:999px;white-space:nowrap}
.mpill.good{background:var(--good-soft);color:var(--good)} .mpill.warn{background:var(--warn-soft);color:var(--warn)} .mpill.bad{background:var(--bad-soft);color:var(--bad)}
.mbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:50px}
.mbar i{display:block;height:100%;border-radius:3px}
.mbar i.good{background:var(--good)} .mbar i.warn{background:var(--warn)} .mbar i.bad{background:var(--bad)}
.sum-tbl tr.qt-row td{border-top:1px solid var(--line)}
.sum-tbl tr.qt-row.none td{background:var(--surface-2)}
.sum-tbl tr.sub-row td{font-size:13px;background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.sum-tbl tfoot td{border-top:2px solid var(--line);background:var(--surface-2)}
.icon-x.exp{color:var(--accent);font-size:13px}
.icon-x.exp:hover{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:560px){ .top{position:static} .fields{grid-template-columns:1fr} .fields label{margin-bottom:-6px} .sheet-head h1{font-size:20px} .tabs{margin-left:0;width:100%} }




.tab{white-space:nowrap;flex:none}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.crc-tag{display:inline-block;font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:2px;padding:1px 7px;white-space:nowrap}
.l-title .crc-tag{align-self:center}
.sale-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:980px;padding:3px 4px 3px 12px;font-size:14px}
.sale-chip .icon-x{width:22px;height:22px;font-size:14px}
/* saved list — clean rows */
.l-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.l-search{flex:1 1 280px;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 14px;min-height:44px;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.l-search:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.l-search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:15px;color:var(--ink);padding:10px 0}
.l-sum{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted);padding:0 4px}
.l-sum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.l-sum b.accent,.ld-grid .v.accent{color:var(--accent)}
.l-list{overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 130px 140px 92px 20px;gap:16px;align-items:center;padding:16px 22px;cursor:pointer;border-top:1px solid var(--line);transition:background .12s}
.lrow:first-child{border-top:0}
.lrow:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.lrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lrow.open{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.l-main{min-width:0;display:grid;gap:3px}
.l-title{display:flex;gap:10px;align-items:baseline;min-width:0}
.l-no{font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.l-bom{color:var(--ink);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.l-meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-code{font-variant-numeric:tabular-nums}
.l-fig{display:grid;text-align:right;gap:1px}
.l-fig .l{font-size:12px;color:var(--muted)}
.l-fig .v{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.l-fig .v.strong{font-weight:600}
.l-m{text-align:right}
.l-chev{color:var(--muted);font-size:20px;line-height:1;transition:transform .15s;text-align:center}
.lrow.open .l-chev{transform:rotate(90deg)}
.l-detail{padding:4px 22px 18px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);display:grid;gap:14px}
.ld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ld-grid>div{background:var(--surface);border-radius:12px;padding:10px 14px;display:grid;gap:2px}
.ld-grid .l{font-size:12px;color:var(--muted)}
.ld-grid .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.ld-grid .s{font-size:12px;color:var(--muted)}
.ld-oh{background:var(--surface);border-radius:12px;padding:6px 14px;display:grid;max-width:640px}
.ld-oh-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:6px 0}
.ld-oh-h .muted{font-weight:400}
.ld-oh-r{display:grid;grid-template-columns:minmax(0,1fr) auto 150px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ld-oh-r .num{font-weight:500}
.ld-oh-r.tot{font-weight:600}
.ld-oh-p{font-size:12px;text-align:right}
@media (max-width:560px){.ld-oh-r{grid-template-columns:minmax(0,1fr) auto}.ld-oh-p{display:none}}
.ld-docs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.ld-docs>.l{color:var(--muted);margin-right:4px}
.ld-doc{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border-radius:980px;padding:4px 12px 4px 6px;font-variant-numeric:tabular-nums}
.ld-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:720px){

.cmd.danger svg{color:var(--bad)}
.cmd.confirm{background:var(--bad);color:#fff}.cmd.confirm svg{color:#fff}
.cmd-sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
main{max-width:1320px;width:100%;margin:0;padding-block:20px 64px;padding-left:24px;padding-right:24px;gap:16px}
main>section{gap:16px}
.sheet-head>.row,.sheet-head>.btn,.sheet-head>.spacer{display:none}

/* record header */
.sheet-head h1{font-size:20px;font-weight:600;line-height:1.3}
.sheet-head .crumb{font-size:12px;color:var(--muted);margin-bottom:2px}
.step-h{margin:6px 0 -6px;gap:8px}
.step-h .sn{display:none}
.step-h h2{font-size:16px;font-weight:600}
.step-h .hint{font-size:12px}

/* sections */
.card,.qcard,.grandsum,.kpis,.resultbar{border:0;border-radius:var(--r);box-shadow:var(--depth);background:var(--surface)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:16px;font-weight:600}
.card-b{padding:16px}
.resultbar{top:calc(92px + env(safe-area-inset-top,0px));box-shadow:var(--depth)}
.rb,.grandsum>div,.kpi{padding:10px 16px}
.rb .l,.grandsum .l,.qc-sum .l,.eyebrow{font-size:12px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.rb .v,.grandsum .v,.kpi .k-v{font-family:var(--f-body);font-size:20px;font-weight:600;letter-spacing:0}
.rb.sell .v{font-size:20px}
.rb .s,.grandsum .s{font-size:12px}
.grandsum .hl .v,.rb.sell .v{color:var(--accent)}

/* Fluent buttons */
.btn{border-radius:var(--r);border:1px solid var(--field);background:var(--surface);color:var(--ink);padding:5px 16px;font-size:14px;font-weight:600;min-height:32px}
.btn:hover{background:var(--surface-2);border-color:var(--field);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000);border-color:transparent;color:#fff}
.btn.danger{color:var(--bad);border-color:var(--field);background:var(--surface)}
.btn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:2px 10px;font-size:13px;min-height:26px}
.btn.ghost{border-color:transparent;background:transparent;font-weight:400}
.btn.ghost:hover{background:transparent;text-decoration:underline}
.sheet-head .btn:not(.danger),.card .btn:not(.primary):not(.danger):not(.ghost){background:var(--surface)}
.icon-x{border-radius:var(--r)}

/* Fluent fields */
.in{border:1px solid var(--field);border-radius:var(--r);min-height:32px;padding:5px 8px;background:var(--surface);font-size:14px;box-shadow:none}
.in:hover{border-color:var(--ink)}
.in:focus{border-color:var(--field);box-shadow:inset 0 -2px 0 var(--accent);outline:none}
td .in{min-height:30px;padding:4px 8px;border-radius:var(--r)}
.fld label,.fields label{font-size:14px;font-weight:600;color:var(--ink)}
.info-grid{gap:14px 20px;padding:16px}
.l-search{border-radius:var(--r);border:1px solid var(--field);box-shadow:none;min-height:32px;background:var(--surface)}
.l-search:focus-within{box-shadow:inset 0 -2px 0 var(--accent)}
.l-search input{font-size:14px;padding:5px 0}

/* grids */
th{background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:var(--surface-2)}
.sum-tbl tfoot td,.price-tbl tfoot td{background:var(--surface-2)}
.pill{border-radius:2px;font-weight:600;font-family:var(--f-body)}
.mpill{border-radius:2px;font-family:var(--f-body);font-weight:600;font-size:12px;padding:1px 8px}
.badge{border-radius:2px}
.chip,.ld-doc,.sale-chip{border-radius:2px}
.seg{border-radius:0;background:transparent;padding:0;gap:4px}
.seg button{border-radius:0;padding:6px 10px;background:transparent;color:var(--ink);font-size:14px;position:relative}
.seg button.on{background:transparent;box-shadow:none;font-weight:600}
.seg button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:1px;background:var(--accent)}
.subtab{font-size:14px;padding:12px 12px}
.subtab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.totals{border-top:1px solid var(--line)}
.tcol{padding:14px 16px}
.tline .l{font-size:14px}
.tline.sell .in{font-size:16px;font-weight:600}
.note{font-size:12px;padding:10px 16px}

/* drop zone, list rows */
.drop{border:1px dashed var(--field);border-radius:var(--r);background:var(--surface);padding:16px}
.drop:hover,.drop.over{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-color:var(--accent)}
.chip .c-no{white-space:nowrap}
.drop.big{padding:40px 24px}
.drop.big .dz-t{font-size:20px;font-weight:600}
.drop.big .dz-s{font-size:14px}
.drop .dz-ic{border-radius:50%}
.step{border-radius:var(--r);background:var(--surface-2)}
.lrow{padding:12px 16px}
.l-no{color:var(--accent);font-weight:600}
.ld-grid>div,.ld-oh{border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line)}
.toast{border-radius:var(--r);background:#323130;color:#fff;box-shadow:0 6.4px 14.4px rgba(0,0,0,.13),0 1.2px 3.6px rgba(0,0,0,.11)}
.banner{border-radius:var(--r);border:0;border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--ink)}
.overlay div{border-radius:var(--r)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sitemap{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));height:auto;z-index:25;border-right:0;border-bottom:1px solid var(--line);padding:0}
  .sitemap .tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav-group{display:none}
  .tab{width:auto;padding:10px 14px}
  .tab[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:0;width:auto;height:3px}
  .cmdbar{top:calc(92px + env(safe-area-inset-top,0px))}
  .resultbar{top:calc(136px + env(safe-area-inset-top,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand small,.brand .b-sep{display:none}
}
@media (max-width:560px){.top{position:sticky}.sheet-head h1{font-size:18px}.rb .v,.grandsum .v{font-size:17px}.resultbar{position:static}}

/* ===== manager mode ===== */
.modesw{display:inline-flex;background:rgba(255,255,255,.12);border-radius:var(--r);padding:2px;gap:2px;flex:none}
.modesw button{border:0;background:transparent;color:rgba(255,255,255,.85);font-size:13px;padding:4px 12px;border-radius:3px;cursor:pointer;white-space:nowrap}
.modesw button.on{background:#fff;color:#002050;font-weight:600}
.mg-sub{font-size:14px;margin-top:2px}
.mg-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.mg-grid{grid-template-columns:minmax(0,1fr)}}
.mg-figs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mg-figs>div,.mg-result>div{display:grid;gap:2px}
.mg-figs .l,.mg-result .l{font-size:12px;color:var(--muted)}
.mg-figs .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.mg-figs .s,.mg-result .s{font-size:12px;color:var(--muted)}
.mg-sell{display:grid;gap:6px}
.mg-sell label{font-size:14px;font-weight:600}
.mg-sell .in{font-size:26px;font-weight:600;min-height:52px;padding:6px 14px;max-width:340px;color:var(--accent)}
.mg-note{font-size:12.5px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.mg-presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mg-presets .btn{min-width:58px}
.mg-tm{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.mg-tm .in{width:84px}
.mg-result{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--good-soft)}
.mg-result .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mg-result.good .v{color:var(--good)} .mg-result.warn{background:var(--warn-soft)} .mg-result.warn .v{color:var(--warn)} .mg-result.bad{background:var(--bad-soft)} .mg-result.bad .v{color:var(--bad)}
.mg-info{display:grid;gap:12px}
.cust-hint{font-size:12.5px;justify-self:start;margin-top:2px}
.cust-add .cust-name{grid-column:span 2}
.cust-add .cust-go{align-self:end}
@media (max-width:620px){.cust-add .cust-name{grid-column:1/-1}}
.cust-tbl td{padding-top:4px;padding-bottom:4px}
.cust-tbl td .in{min-width:110px;width:100%}
.cust-tbl td.c-name .in{min-width:240px;font-weight:500}
.cust-tbl tbody tr:hover{background:var(--surface-2)}
.mg-tbl td .in.pct{width:78px}
body.mgr .resultbar{position:static}
@media (max-width:860px){.modesw button{padding:4px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== ERP layer (bidding-portal look): Inter + Noto Sans Thai, indigo accent, dense bordered grids ===== */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface-2:#f5f6f9; --ink:#222326; --muted:#6b6f78; --line:#dfe1e6; --field:#cfd2d9;
  --accent:#5046e5; --accent-ink:#ffffff; --accent-soft:#eceafd; --link:#3b3fd6; --sel:#e8f0fc; --sel-line:#9db8e8;
  --t-type-bg:#fbe8fb; --t-type:#c21fc4; --t-open-bg:#dfe7fb; --t-open:#2b4bcb; --t-grey-bg:#ebecef; --t-grey:#3b3e45;
  --t-red-bg:#fde8e8; --t-red:#e03131; --t-amber-bg:#fff1d6; --t-amber:#b35c00; --t-green-bg:#e2f5e6; --t-green:#1b7a31;
  --hdr:#1f2150;
  --f-display:"Inter","Noto Sans Thai","Segoe UI","Leelawadee UI",-apple-system,BlinkMacSystemFont,sans-serif;
  --f-body:"Inter","Noto Sans Thai","Segoe UI","Leelawadee UI",-apple-system,BlinkMacSystemFont,sans-serif;
  --f-mono:"Inter","Noto Sans Thai","Segoe UI","Leelawadee UI",-apple-system,BlinkMacSystemFont,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15161b; --surface:#1e1f26; --surface-2:#262833; --ink:#eceef3; --muted:#a3a7b3; --line:#343743; --field:#4a4e5c;
  --accent:#8b84ff; --accent-ink:#14123a; --accent-soft:#2a2759; --link:#a6a2ff; --sel:#232f48; --sel-line:#41598b;
  --t-type-bg:#3d1f42; --t-type:#f0a6f2; --t-open-bg:#1f2c52; --t-open:#a9bcff; --t-grey-bg:#2d2f38; --t-grey:#d2d4db;
  --t-red-bg:#45201f; --t-red:#ff9b98; --t-amber-bg:#40301a; --t-amber:#ffc56e; --t-green-bg:#1b3a22; --t-green:#8fdc9f;
  --hdr:#0e0f1a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#15161b; --surface:#1e1f26; --surface-2:#262833; --ink:#eceef3; --muted:#a3a7b3; --line:#343743; --field:#4a4e5c;
  --accent:#8b84ff; --accent-ink:#14123a; --accent-soft:#2a2759; --link:#a6a2ff; --sel:#232f48; --sel-line:#41598b;
  --t-type-bg:#3d1f42; --t-type:#f0a6f2; --t-open-bg:#1f2c52; --t-open:#a9bcff; --t-grey-bg:#2d2f38; --t-grey:#d2d4db;
  --t-red-bg:#45201f; --t-red:#ff9b98; --t-amber-bg:#40301a; --t-amber:#ffc56e; --t-green-bg:#1b3a22; --t-green:#8fdc9f;
  --hdr:#0e0f1a; color-scheme:dark; }
body{font-size:14px;font-feature-settings:"tnum" 1}
.num,.in.n{font-variant-numeric:tabular-nums}
a{color:var(--link)}

.fld{align-content:start}
.erp{display:grid;gap:14px;min-width:0}
.erp-title{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.erp-title h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.erp-crumb{font-size:12.5px;color:var(--muted)} .erp-crumb b{color:var(--ink);font-weight:600}
.erp-card{background:var(--surface);border-radius:8px;padding:16px 22px;min-width:0;box-shadow:0 1px 2px rgba(20,22,40,.04)}

/* search panel */
.sf-grid{display:grid;grid-template-columns:120px minmax(0,1fr) 110px minmax(0,1fr) 104px minmax(0,1.3fr);gap:8px 14px;align-items:center}
.sf-l{font-size:13px;font-weight:500;color:var(--ink);line-height:1.2}
.sf-in{height:28px;border:1px solid var(--field);border-radius:3px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:0 8px;min-width:0;width:100%}
select.sf-in{padding-right:4px}
.sf-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.sf-date{display:flex;align-items:center;gap:6px;min-width:0} .sf-date .sf-in{flex:1}
.sf-last{display:flex;gap:10px;align-items:center;min-width:0} .sf-last .sf-in{flex:1}
.sf-btns{display:flex;gap:4px;flex:none}
.erp-search.shut .sf-grid > :nth-child(n+7):not(.sf-last){display:none}
.erp-search.shut .sf-grid{grid-template-rows:auto}
.erp-search.shut .sf-grid > .sf-last{grid-column:5/-1}
.erp-search.shut .sf-grid > label[for="lf-pcode"]{display:none}
.erp-search.shut .sf-last > .sf-in{visibility:hidden}

.ebtn{height:28px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border-radius:3px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ebtn:hover{background:var(--accent-soft)}
.ebtn.primary{background:var(--accent);color:var(--accent-ink)} .ebtn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.ebtn.icon{width:28px;padding:0}
.ebtn.outline{font-weight:500}
.ebtn.danger{border-color:var(--t-red);color:var(--t-red)} .ebtn.danger:hover{background:var(--t-red-bg)}
.ebtn.danger.confirm{background:var(--t-red);color:#fff}

/* results bar + grid */
.rbar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.rbar b{font-weight:600}
.rbar .rsize{width:auto;height:26px}
.rtot{color:var(--muted)} .rtot b{color:var(--ink)}
.erp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px;min-width:0}
.erp-tbl{border-collapse:collapse;width:100%;font-size:13px;color:#444851}
:root[data-theme="dark"] .erp-tbl{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .erp-tbl{color:var(--ink)}}
.erp-tbl th{background:var(--surface-2);color:var(--ink);font-weight:600;padding:8px 10px;border:1px solid var(--line);border-top:0;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
.erp-tbl th:first-child,.erp-tbl td:first-child{border-left:0} .erp-tbl th:last-child,.erp-tbl td:last-child{border-right:0}
.erp-tbl th:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--line))}
.erp-tbl td{padding:6px 10px;border:1px solid var(--line);white-space:nowrap;height:30px}
.erp-tbl tbody tr:last-child td{border-bottom:0}
.erp-tbl .c{text-align:center} .erp-tbl .l{text-align:left} .erp-tbl .r{text-align:right}
.erp-tbl tbody tr{cursor:pointer}
.erp-tbl tbody tr:hover td{background:color-mix(in srgb,var(--sel) 45%,transparent)}
.erp-tbl tbody tr.sel td{background:var(--sel);border-top-color:var(--sel-line);border-bottom-color:var(--sel-line)}
.erp-tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.erp-tbl td.k-bom{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.erp-tbl td.k-cust{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.erp-tbl td.k-no{font-weight:500;color:var(--ink)}
.erp-tbl td.k-sell{font-weight:600;color:var(--ink)}
.sarr{font-size:9px;margin-left:4px;color:var(--accent)}
.elink{color:var(--link);text-decoration:none} .elink:hover{text-decoration:underline}
.erp-empty{text-align:center!important;color:var(--muted);padding:28px!important;cursor:default}
.tg{display:inline-block;padding:1px 9px;border-radius:3px;font-size:12.5px;line-height:20px;white-space:nowrap;font-weight:500}
.tg.type{background:var(--t-type-bg);color:var(--t-type)} .tg.open{background:var(--t-open-bg);color:var(--t-open)}
.tg.grey{background:var(--t-grey-bg);color:var(--t-grey)} .tg.red{background:var(--t-red-bg);color:var(--t-red)}
.tg.amber{background:var(--t-amber-bg);color:var(--t-amber)} .tg.green{background:var(--t-green-bg);color:var(--t-green)}
.pager{display:flex;justify-content:center;gap:0;margin-top:14px}
.pgb{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--line);margin-left:-1px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.pgb:first-child{border-radius:3px 0 0 3px} .pgb:last-child{border-radius:0 3px 3px 0}
.pgb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);position:relative}
.pgb:disabled{color:var(--muted);opacity:.5;cursor:default}
.pgb:not(:disabled):not(.on):hover{background:var(--accent-soft)}
.erp-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.erp-detail{margin-top:16px;border:1px solid var(--sel-line);border-radius:4px;background:color-mix(in srgb,var(--sel) 40%,var(--surface));padding:14px 16px;display:grid;gap:12px}
.ed-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .ed-h b{font-size:15px} .ed-t{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 200px}
.erp-detail .ld-grid{padding:0}

@media (max-width:1100px){
  .sf-grid{grid-template-columns:110px minmax(0,1fr) 110px minmax(0,1fr)}
  .sf-grid .sf-by{grid-column:1} .sf-grid .sf-date{grid-column:2/-1}
  .sf-grid .sf-last{grid-column:2/-1}
  .erp-search.shut .sf-grid > .sf-last{grid-column:1/-1;justify-content:flex-end}
  .erp-search.shut .sf-last > .sf-in{display:none}
}
@media (max-width:620px){
  .erp-card{padding:14px}
  .sf-grid{grid-template-columns:minmax(0,1fr);gap:4px}
  .sf-grid .sf-by,.sf-grid .sf-date,.sf-grid .sf-last{grid-column:1}
  .sf-l{margin-top:6px}
  .sf-last{flex-wrap:wrap} .sf-last .sf-in{flex:1 1 100%} .sf-btns{margin-left:auto;margin-top:6px}
  .erp-search.shut .sf-grid > .sf-last{grid-column:1}
  .rtot{flex-basis:100%}
}

/* ===== ERP components for every page (sheet, summary, customers, settings) ===== */
.sheet-head{align-items:flex-end}
.sheet-head h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet-head .erp-crumb{margin-left:auto;text-align:right}
.card,.qcard,.grandsum,.kpis,.resultbar{border-radius:8px;border:0;box-shadow:0 1px 2px rgba(20,22,40,.05);background:var(--surface)}
.card-h{padding:12px 20px;border-bottom:1px solid var(--line)}
.card-h h2,.step-h h2{font-size:15px;font-weight:700}
.card-b{padding:16px 20px}
.step-h{margin:8px 0 -4px}
.step-h .sn{display:grid;width:22px;height:22px;border-radius:3px;font-family:var(--f-body);font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.crumb{font-size:12.5px}
.req{color:var(--t-red)}

/* fields */
.in{min-height:30px;border:1px solid var(--field);border-radius:3px;padding:4px 8px;font-size:13px;background:var(--surface);color:var(--ink)}
.in:hover{border-color:color-mix(in srgb,var(--field) 55%,var(--ink))}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
td .in{min-height:26px;padding:2px 6px;font-size:13px}
.fld label,.fields label{font-size:13px;font-weight:500;color:var(--ink)}
.fld{gap:5px}

/* buttons */
.btn{border:1px solid var(--accent);border-radius:3px;background:var(--surface);color:var(--accent);font-size:13px;font-weight:600;min-height:28px;padding:3px 14px}
.btn:hover,.card .btn:not(.primary):not(.danger):not(.ghost):hover,.sheet-head .btn:not(.danger):hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent;color:var(--accent-ink)}
.btn.danger{border-color:var(--t-red);color:var(--t-red);background:var(--surface)}
.btn.danger:hover{background:var(--t-red-bg);color:var(--t-red)}
.btn.sm{min-height:24px;padding:1px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--link);font-weight:500}
.cmd svg{color:var(--accent)}
.linkbtn{color:var(--link)}

/* grids: bordered like the bidding portal */
th{background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:600;padding:7px 10px;border:1px solid var(--line);border-top:0;white-space:nowrap}
td{padding:5px 10px;border:1px solid var(--line);font-size:13px}
th:first-child,td:first-child{border-left:0} th:last-child,td:last-child{border-right:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sel) 45%,transparent)}
tbody tr.nohand{cursor:default}
tfoot td{background:var(--surface-2);font-weight:600;border-bottom:0}
.card>.tbl-wrap{margin:14px 20px;border:1px solid var(--line);border-radius:2px;width:auto}
.card>.tbl-wrap:first-child{margin-top:16px}
.card>.tbl-wrap tbody tr:last-child td{border-bottom:0}
.sum-tbl td.k-bom{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.sum-tbl td.k-cust{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-tbl tbody tr{cursor:pointer}
.erp-tbl td .in.n{min-height:26px}

/* tags */
.pill{border:0;border-radius:3px;padding:1px 8px;font-family:var(--f-body);font-size:12px;font-weight:600;line-height:18px}
.pill.DM{background:var(--t-open-bg);color:var(--t-open)} .pill.DL{background:var(--t-type-bg);color:var(--t-type)}
.pill.OH{background:var(--t-amber-bg);color:var(--t-amber)} .pill.SP{background:var(--t-green-bg);color:var(--t-green)}
.mpill{border-radius:3px;font-family:var(--f-body);font-size:12.5px;font-weight:500;padding:1px 9px;line-height:20px}
.mpill.good{background:var(--t-green-bg);color:var(--t-green)} .mpill.warn{background:var(--t-amber-bg);color:var(--t-amber)} .mpill.bad{background:var(--t-red-bg);color:var(--t-red)}
.badge{border-radius:3px;font-weight:600}
.badge.main{background:var(--t-open-bg);color:var(--t-open)} .badge.sub{background:var(--t-grey-bg);color:var(--t-grey)}
.crc-tag{border-radius:3px;background:var(--t-open-bg);color:var(--t-open);font-weight:500}
.chip,.ld-doc{border:1px solid var(--line);background:var(--surface);border-radius:3px}

/* tabs and segmented buttons */
.seg,.etabs{display:inline-flex;gap:0;border:1px solid var(--accent);border-radius:3px;overflow:hidden;background:var(--surface);padding:0}
.seg button,.etabs button{border:0;border-radius:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:500;padding:3px 14px;min-height:26px;cursor:pointer;box-shadow:none}
.seg button+button,.etabs button+button{border-left:1px solid var(--accent)}
.seg button.on,.etabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button.on::after{display:none}
.subtabs{border-bottom:1px solid var(--line);padding:0 12px}
.subtab{font-size:13.5px;padding:10px 14px;color:var(--muted)}
.subtab[aria-selected="true"]{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}

/* figures */
.rb .v,.grandsum .v,.kpi .k-v{font-size:20px;font-weight:700}
.grandsum .hl .v,.rb.sell .v{color:var(--accent)}
.rb .l,.grandsum .l,.kpi .k-l{font-size:12.5px;color:var(--muted)}
.mg-sell .in{color:var(--accent);border-radius:3px}
.mg-result{border-radius:4px}
.mg-result.good{background:var(--t-green-bg)} .mg-result.good .v{color:var(--t-green)}
.mg-result.warn{background:var(--t-amber-bg)} .mg-result.warn .v{color:var(--t-amber)}
.mg-result.bad{background:var(--t-red-bg)} .mg-result.bad .v{color:var(--t-red)}
.drop{border:1px dashed var(--field);border-radius:4px}
.drop .dz-ic{border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.erp-note{padding:12px 0 0}
.banner{border-radius:4px}
.toast{border-radius:4px;background:#2b2d3a}
.sale-chip{border-radius:3px;background:var(--t-open-bg);color:var(--t-open)}

/* ERP pieces used by summary + customers */
.rb-h{font-size:15px;font-weight:700;color:var(--ink);margin-right:4px}
.sf-span3{grid-column:span 3}
.sf-pct{display:flex;align-items:center;gap:6px;flex:1;min-width:0} .sf-pct .sf-in{width:80px;flex:none;text-align:right}
.cust-add{margin-top:2px}
.cust-tbl td{padding:3px 6px}
.cust-tbl td .sf-in{min-width:110px;height:26px}
.cust-tbl td.c-name .sf-in{min-width:240px;font-weight:500}
.cust-tbl td .sf-in:not(:focus){border-color:transparent;background:transparent}
.cust-tbl tbody tr:hover td .sf-in:not(:focus){border-color:var(--field);background:var(--surface)}
.cust-add .sf-last{grid-column:2/-1}
.mg-presets .btn{min-height:30px;min-width:60px}
.tbl-wrap td.mono,.tbl-wrap td .mono{white-space:nowrap}
.sum-tbl td.k-bom{max-width:200px} .sum-tbl td.k-cust{max-width:160px}
@media (max-width:1100px){ .sf-span3{grid-column:2/-1} }
@media (max-width:620px){ .cust-add .sf-last{grid-column:1} }
@media (max-width:620px){ .sf-span3{grid-column:1} .sheet-head .erp-crumb{margin-left:0;text-align:left;flex-basis:100%} }

/* submit bar: sticks to the bottom of the sheet */
#submitbar{position:sticky;bottom:0;z-index:15;margin-top:4px}
.sbar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:8px 8px 0 0;padding:10px 20px;box-shadow:0 -4px 14px rgba(20,22,40,.08)}
.sb-info{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;font-size:13px;min-width:0;flex:1 1 auto}
.sb-no{font-size:15px}
.sb-warn{color:var(--t-amber);background:var(--t-amber-bg);border-radius:3px;padding:1px 8px}
.sb-ok{color:var(--t-green);background:var(--t-green-bg);border-radius:3px;padding:1px 8px}
.ebtn.sb-go{height:36px;padding:0 22px;font-size:14px;gap:8px}
.sb-sub{font-weight:400;opacity:.85;font-size:12.5px}
.ebtn:disabled{opacity:.45;cursor:not-allowed}
.ebtn.busy{opacity:.7;cursor:progress}
.cmd.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 14px}
.cmd.primary svg{color:var(--accent-ink)}
.cmd.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
body:has(#view-sheet:not([hidden]) #submitbar) .toast{bottom:96px}
@media (max-width:620px){ .sbar{padding:10px 14px;gap:8px} .ebtn.sb-go{flex:1 1 100%} .sb-sub{display:none} body:has(#view-sheet:not([hidden]) #submitbar) .toast{bottom:130px} }

/* OneDrive migration call-to-action */
.banner.is-mig{border:0;background:transparent;padding:0;border-left:0}
.mig-card{display:flex;align-items:center;gap:16px 20px;flex-wrap:wrap;background:var(--accent-soft);border:2px solid var(--accent);border-radius:8px;padding:18px 22px;box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 18%,transparent)}
.mig-ic{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mig-t{flex:1 1 320px;min-width:0;display:grid;gap:4px}
.mig-h{font-size:17px;font-weight:700;color:var(--ink)} .mig-h b{color:var(--accent);font-size:20px}
.mig-s{font-size:13px;color:var(--muted)} .mig-s b{color:var(--ink)}
.mig-bar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.mig-bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.ebtn.mig-go{height:44px;padding:0 24px;font-size:15px;gap:8px;flex:none;animation:migpulse 2s ease-in-out 3}
@keyframes migpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.cmd.mig-cmd{animation:migpulse 2s ease-in-out 3}
@media (max-width:620px){ .mig-card{padding:14px} .ebtn.mig-go{flex:1 1 100%} .mig-h{font-size:15px} }
@media (prefers-reduced-motion:reduce){ .ebtn.mig-go,.cmd.mig-cmd{animation:none} }

/* ===== Google layer (Material 3 / Google Workspace look) ===== */
:root{
  --bg:#f6f8fc; --surface:#ffffff; --surface-2:#f1f3f4; --ink:#1f1f1f; --muted:#5f6368; --line:#e0e3e7; --field:#c4c7c5;
  --accent:#1a73e8; --accent-ink:#ffffff; --accent-soft:#e8f0fe; --accent-cont:#d3e3fd; --on-cont:#041e49; --link:#1a73e8; --sel:#e8f0fe; --sel-line:#aecbfa;
  --t-type-bg:#f3e8fd; --t-type:#8430ce; --t-open-bg:#e8f0fe; --t-open:#1967d2; --t-grey-bg:#f1f3f4; --t-grey:#3c4043;
  --t-red-bg:#fce8e6; --t-red:#c5221f; --t-amber-bg:#fef7e0; --t-amber:#b06000; --t-green-bg:#e6f4ea; --t-green:#137333;
  --good:#137333; --good-soft:#e6f4ea; --warn:#b06000; --warn-soft:#fef7e0; --bad:#c5221f; --bad-soft:#fce8e6;
  --dm:#1a73e8; --dl:#8430ce; --oh:#e37400;
  --hdr:#ffffff; --hdr-ink:#1f1f1f;
  --elev1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --elev2:0 1px 2px 0 rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --f-display:"Google Sans","Product Sans","Roboto","Noto Sans Thai","Segoe UI",sans-serif;
  --f-body:"Roboto","Noto Sans Thai","Google Sans Text","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  --f-mono:"Roboto","Noto Sans Thai","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1f1f1f; --surface:#28292a; --surface-2:#303134; --ink:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --field:#5f6368;
  --accent:#8ab4f8; --accent-ink:#062e6f; --accent-soft:#1f2a3d; --accent-cont:#0842a0; --on-cont:#d3e3fd; --link:#8ab4f8; --sel:#24324a; --sel-line:#41598b;
  --t-type-bg:#3a2a4a; --t-type:#d7aefb; --t-open-bg:#1f3352; --t-open:#8ab4f8; --t-grey-bg:#3c4043; --t-grey:#e8eaed;
  --t-red-bg:#4a2422; --t-red:#f28b82; --t-amber-bg:#45391b; --t-amber:#fdd663; --t-green-bg:#1e3a29; --t-green:#81c995;
  --good:#81c995; --good-soft:#1e3a29; --warn:#fdd663; --warn-soft:#45391b; --bad:#f28b82; --bad-soft:#4a2422;
  --hdr:#28292a; --hdr-ink:#e8eaed; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1f1f1f; --surface:#28292a; --surface-2:#303134; --ink:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --field:#5f6368;
  --accent:#8ab4f8; --accent-ink:#062e6f; --accent-soft:#1f2a3d; --accent-cont:#0842a0; --on-cont:#d3e3fd; --link:#8ab4f8; --sel:#24324a; --sel-line:#41598b;
  --t-type-bg:#3a2a4a; --t-type:#d7aefb; --t-open-bg:#1f3352; --t-open:#8ab4f8; --t-grey-bg:#3c4043; --t-grey:#e8eaed;
  --t-red-bg:#4a2422; --t-red:#f28b82; --t-amber-bg:#45391b; --t-amber:#fdd663; --t-green-bg:#1e3a29; --t-green:#81c995;
  --good:#81c995; --good-soft:#1e3a29; --warn:#fdd663; --warn-soft:#45391b; --bad:#f28b82; --bad-soft:#4a2422;
  --hdr:#28292a; --hdr-ink:#e8eaed; color-scheme:dark; }
body{font-family:var(--f-body);letter-spacing:.01em}
h1,h2,h3,.erp-title h1,.sheet-head h1,.brand{font-family:var(--f-display)}

/* top app bar: white like Gmail / Drive */
.top{background:var(--hdr);color:var(--hdr-ink);border-bottom:1px solid var(--line);box-shadow:none}
body::before{background:var(--hdr)}
.waffle{color:var(--muted);border-radius:50%} .waffle:hover{background:var(--surface-2)}
.brand{font-size:20px;font-weight:400;color:var(--hdr-ink);letter-spacing:0}
.brand .b-app{font-weight:500}
.brand .b-sep{color:var(--line);opacity:1}
.brand small{color:var(--muted);font-size:14px}
.status{color:var(--muted)} .status .dot{background:#1e8e3e} .status.busy .dot{background:#f9ab00} .status.err .dot{background:#d93025} .status.err{color:var(--bad)}
.modesw{background:transparent;border:1px solid var(--field);border-radius:20px;padding:0;gap:0;overflow:hidden}
.modesw button{color:var(--ink);border-radius:0;padding:5px 14px;font-weight:500}
.modesw button+button{border-left:1px solid var(--field)}
.modesw button.on{background:var(--accent-cont);color:var(--on-cont);font-weight:600}

/* navigation drawer: rounded active pill */
.sitemap{background:var(--bg);border-right:0;padding:8px 0}
.nav-group{color:var(--muted);font-weight:500;padding:16px 24px 8px;font-size:12.5px}
.tab{border-radius:0 20px 20px 0;margin-right:12px;width:calc(100% - 12px);padding:9px 16px 9px 24px;color:var(--ink);font-size:14px}
.tab .ic{color:var(--muted)}
.tab:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tab[aria-current="page"]{background:var(--accent-cont);color:var(--on-cont);font-weight:600}
.tab[aria-current="page"]::before{display:none}
.tab[aria-current="page"] .ic{color:var(--on-cont)}
.tab .count{color:inherit;font-weight:500}
.workarea{background:var(--bg)}

/* command bar */
.cmdbar{background:var(--bg);border-bottom:0;box-shadow:none;gap:4px;padding:6px 16px}
.cmd{border-radius:20px;height:36px;padding:0 14px;color:var(--ink);font-weight:500}
.cmd svg{color:var(--accent)}
.cmd:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.cmd.primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--elev1)}
.cmd.primary svg{color:var(--accent-ink)}
.cmd.primary:hover{background:color-mix(in srgb,var(--accent) 90%,#000);box-shadow:var(--elev2)}
.cmd.confirm{background:var(--bad);color:#fff;border-radius:20px}
.cmd-sep{background:var(--line)}

/* surfaces */
.card,.qcard,.grandsum,.kpis,.resultbar,.erp-card{border-radius:12px;border:0;box-shadow:none;background:var(--surface)}
.card-h{border-bottom:1px solid var(--line);padding:14px 20px}
.card-h h2,.step-h h2,.rb-h{font-family:var(--f-display);font-size:16px;font-weight:500}
.erp-title h1,.sheet-head h1{font-size:22px;font-weight:400;letter-spacing:0}
.erp-crumb,.crumb{color:var(--muted)} .erp-crumb b{font-weight:500}
.step-h .sn{border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:500}
.kpis,.resultbar,.grandsum{overflow:hidden}
.rb .v,.grandsum .v,.kpi .k-v{font-family:var(--f-display);font-weight:400;font-size:22px}
.grandsum .hl .v,.rb.sell .v{color:var(--accent);font-weight:500}

/* buttons: pill shaped */
.btn,.ebtn{border-radius:20px;border:1px solid var(--field);background:var(--surface);color:var(--accent);font-weight:500;letter-spacing:.01em}
.btn{min-height:32px;padding:4px 18px}
.ebtn{height:32px;padding:0 18px}
.btn:hover,.ebtn:hover,.card .btn:not(.primary):not(.danger):not(.ghost):hover,.sheet-head .btn:not(.danger):hover{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:var(--field);color:var(--accent)}
.btn.primary,.ebtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover,.ebtn.primary:hover{background:color-mix(in srgb,var(--accent) 90%,#000);border-color:transparent;color:var(--accent-ink);box-shadow:var(--elev1)}
.btn.danger,.ebtn.danger{color:var(--bad);border-color:var(--field)} .btn.danger:hover,.ebtn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:28px;padding:1px 14px}
.ebtn.icon{width:32px;padding:0;border-radius:50%}
.btn.ghost{border-color:transparent;background:transparent;color:var(--link)}
.icon-x{border-radius:50%}
.ebtn.sb-go,.ebtn.mig-go{border-radius:24px;box-shadow:var(--elev1)}

/* fields: outlined text fields */
.in,.sf-in{border:1px solid var(--field);border-radius:4px;background:var(--surface);color:var(--ink)}
.sf-in{height:32px}
.in:hover,.sf-in:hover{border-color:var(--ink)}
.in:focus,.sf-in:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);outline:none}
.fld label,.fields label,.sf-l{color:var(--muted);font-weight:500}

/* tables: row dividers only */
th,.erp-tbl th{background:var(--surface);color:var(--muted);font-weight:500;border:0;border-bottom:1px solid var(--line)}
td,.erp-tbl td{border:0;border-bottom:1px solid var(--line)}
.erp-tbl{color:var(--ink)}
.erp-wrap,.card>.tbl-wrap{border:1px solid var(--line);border-radius:8px}
tbody tr:hover td,.erp-tbl tbody tr:hover td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.erp-tbl tbody tr.sel td{background:var(--sel);border-color:var(--line)}
tfoot td{background:var(--surface-2)}
.erp-tbl th:hover{background:var(--surface-2)}

/* chips */
.tg,.pill,.mpill,.badge,.crc-tag,.sale-chip,.sb-warn,.sb-ok{border-radius:16px}
.tg{padding:1px 10px;font-weight:500}
.chip,.ld-doc{border-radius:8px;border:1px solid var(--line);background:var(--surface)}

/* tabs / segmented buttons */
.seg,.etabs{border:1px solid var(--field);border-radius:20px}
.seg button,.etabs button{color:var(--ink);padding:4px 16px}
.seg button+button,.etabs button+button{border-left:1px solid var(--field)}
.seg button.on,.etabs button.on{background:var(--accent-cont);color:var(--on-cont)}
.subtab{color:var(--muted);font-weight:500}
.subtab[aria-selected="true"]{color:var(--accent);border-bottom:3px solid var(--accent);font-weight:500}

/* pager: round buttons */
.pager{gap:4px}
.pgb{min-width:32px;height:32px;border-radius:50%!important;border:0;margin:0;background:transparent;color:var(--ink)}
.pgb.on{background:var(--accent);color:var(--accent-ink)}
.pgb:not(:disabled):not(.on):hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}

/* misc */
.drop{border:1px dashed var(--field);border-radius:12px;background:var(--surface)}
.drop .dz-ic{border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.banner{border-radius:8px;border:0;background:var(--warn-soft);color:var(--ink)}
.toast{border-radius:8px;background:#323232;color:#f2f2f2;box-shadow:var(--elev2)}
.mig-card{border:1px solid var(--sel-line);border-radius:16px;background:var(--accent-soft);box-shadow:none}
.mig-ic{background:var(--accent);color:var(--accent-ink)}
.sbar{border:0;border-radius:16px 16px 0 0;box-shadow:var(--elev2)}
.mg-result{border-radius:12px}
.erp-detail{border-radius:12px;border:1px solid var(--sel-line);background:color-mix(in srgb,var(--sel) 50%,var(--surface))}
.ld-grid>div,.ld-oh{border-radius:8px}
@media (max-width:860px){
  .sitemap{background:var(--surface);border-bottom:1px solid var(--line)}
  .tab{border-radius:20px;margin:6px 4px;width:auto;padding:7px 14px}
}

.c-pdf{flex:none;font-size:11.5px;font-weight:600;color:var(--t-red);background:var(--t-red-bg);border-radius:12px;padding:1px 8px;text-decoration:none;white-space:nowrap}
a.c-pdf:hover{text-decoration:underline}
.c-pdf.off{color:var(--muted);background:var(--surface-2)}

<script>
/* ===== PCS core: categories, PDF parsing, calculation ===== */
const CATS = [
  { id: 'belt', type: 'DM', name: 'สายพาน', pct: 0 },
  { id: 'resell', type: 'DM', name: 'ซื้อมาขายไป', pct: 35 },
  { id: 'galv', type: 'DM', name: 'ชุบอะไหล่, Hot-Dip Galvanized', pct: 35 },
  { id: 'subcon', type: 'DM', name: 'จ้างทำ Part', pct: 45 },
  { id: 'plc', type: 'DM', name: 'จ้าง Electric outsource : PLC', pct: 40 },
  { id: 'rubber', type: 'DM', name: 'เคลือบยาง', pct: 45 },
  { id: 'struct', type: 'DM', name: 'Structures', pct: 45 },
  { id: 'std', type: 'DM', name: 'Standard Part', pct: 45 },
  { id: 'roller', type: 'DM', name: 'Roller & Machine Roller', pct: 45 },
  { id: 'pneu', type: 'DM', name: 'Pneumatic', pct: 45 },
  { id: 'inhouse', type: 'DM', name: 'Part Standrd - (ผลิตเอง)', pct: 45 },
  { id: 'nsunb', type: 'DM', name: 'Non Standard Part UNB', pct: 45 },
  { id: 'ns', type: 'DM', name: 'Non Standard Part', pct: 45 },
  { id: 'motor', type: 'DM', name: 'MOTOR', pct: 35 },
  { id: 'elec', type: 'DM', name: 'Electronic', pct: 40 },
  { id: 'blackbelt', type: 'DM', name: 'Belt (สายพานยางดำ)', pct: 45 },
  { id: 'none', type: 'DM', name: 'ยังไม่ระบุกลุ่ม', pct: 45 },
  { id: 'dl_int', type: 'DL', name: 'DL Internal', pct: 60 },
  { id: 'dl_we', type: 'DL', name: 'DL Installation (Weekend)', pct: 60 },
  { id: 'dl_wd', type: 'DL', name: 'DL Installation (Weekday)', pct: 60 },
];
const CAT_BY_ID = Object.fromEntries(CATS.map(c => [c.id, c]));

const DEFAULT_RULES = [
  { prefix: '1201-38', cat: 'galv' },
  { prefix: '1201', cat: 'struct' },
  { prefix: '1202', cat: 'elec' },
  { prefix: '1203', cat: 'std' },
  { prefix: '1204', cat: 'std' },
  { prefix: '1205', cat: 'subcon' },
  { prefix: '1206', cat: 'std' },
  { prefix: '1207', cat: 'std' },
  { prefix: '1210', cat: 'std' },
  { prefix: '1212', cat: 'std' },
  { prefix: '1400-01', cat: 'inhouse' },
  { prefix: '1400-03', cat: 'std' },
  { prefix: '1400-04', cat: 'std' },
  { prefix: '1400-09', cat: 'motor' },
  { prefix: '9101', cat: 'belt' },
];

function defaultConfig() {
  return {
    rules: DEFAULT_RULES.map(r => ({ ...r })),
    pct: Object.fromEntries(CATS.map(c => [c.id, c.pct])),
    codes: {},          // code -> {name?, cat?}  remembered fixes
    ohPresets: ['ค่าเบี้ยเลี้ยงติดตั้งหน้างาน', 'ค่าจ้างรถเฮี๊ยบ', 'Transport UNB'],
    custTypes: ['End User', 'Dealer', 'OEM'],
    marginWarn: 30,
    priceOnly: { belt: true }, // groups whose amount is already a selling price: kept out of cost, added to the price total
  };
}

const r2 = n => Math.round((Number(n) || 0) * 100 + Number.EPSILON * 100) / 100;
const num = s => {
  if (typeof s === 'number') return s;
  const v = parseFloat(String(s ?? '').replace(/,/g, ''));
  return isNaN(v) ? 0 : v;
};

function categorize(code, config) {
  const mem = config.codes && config.codes[code];
  if (mem && mem.cat) return mem.cat;
  let best = null;
  for (const r of config.rules || []) {
    if (r.prefix && code.startsWith(r.prefix) && (!best || r.prefix.length > best.prefix.length)) best = r;
  }
  return best ? best.cat : 'none';
}

/* ---------- PDF text -> BOM document ---------- */
const RE_CODE = /^\d{4}(-\d{2,6}){0,2}(-\d{1,3})?$/;   // 1201-37-0011, 9101-12, 1204, or a variant like 1206-01-0002-1
const RE_NUM = /^-?[\d,]*\d(\.\d+)?$/;
/* some ERP versions encode digits inside Thai text as Ř..š (U+0158–0161 = 0–9) and tone marks as É (่) Ê (้) */
function fixLegacyText(v) {
  return String(v)
    .replace(/[\u0158-\u0161]/g, ch => String(ch.charCodeAt(0) - 0x158))
    .replace(/\s*\u00C9\s*/g, '\u0E48').replace(/\s*\u00CA\s*/g, '\u0E49')
    .replace(/(\d) \. (\d)/g, '$1.$2');
}
const clean = s => fixLegacyText(s).replace(/\u0000/g, '□').replace(/\s+/g, ' ').replace(/ (?=[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E])/g, '').replace(/\u0E4D\u0E32/g, 'ำ').trim();

function groupLines(items) {
  const sorted = items.filter(i => i.str && i.str.trim()).sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for (const it of sorted) {
    let ln = lines.find(l => l.page === it.page && Math.abs(l.y - it.y) <= 2.5);
    if (!ln) { ln = { page: it.page, y: it.y, items: [] }; lines.push(ln); }
    ln.items.push(it);
  }
  lines.forEach(l => {
    l.items.sort((a, b) => a.x - b.x);
    // pieces of one word that touch (some ERP versions split "เลขที" + "่" + "เอกสาร") → one item
    const merged = [];
    for (const it of l.items) {
      const p = merged[merged.length - 1];
      const lone = /^[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]+$/.test(fixLegacyText(it.str).trim());
      if (p && lone && typeof p.w === 'number' && p.w > 0 && it.x < p.x + p.w - 0.3 && it.x >= p.x) {
        // a tone mark drawn on top of a word that pdf.js sorted before it: put it back at its position
        let idx = Math.round((it.x - p.x) / p.w * p.str.length);
        idx = Math.max(1, Math.min(p.str.length, idx));
        while (idx > 1 && /\s/.test(p.str[idx - 1])) idx--;
        while (idx < p.str.length && /[\u0E31\u0E34-\u0E3A\u0E47]/.test(p.str[idx])) idx++;   // tone mark goes after an upper vowel
        merged[merged.length - 1] = { ...p, str: p.str.slice(0, idx) + it.str.trim() + p.str.slice(idx) };
      } else if (p && typeof p.w === 'number' && typeof it.w === 'number' && it.x - (p.x + p.w) < 0.8 && it.x >= p.x) {
        merged[merged.length - 1] = { ...p, str: p.str + it.str, w: (it.x + it.w) - p.x };
      } else merged.push({ ...it });
    }
    l.items = merged;
  });
  lines.sort((a, b) => a.page - b.page || b.y - a.y);
  return lines;
}

/* join text pieces; pieces that touch (no visible gap) are joined without a space */
function joinPieces(its, ts) {
  let out = '';
  ts.forEach((t, i) => {
    if (i === 0) { out = t; return; }
    const p = its[i - 1], c = its[i];
    const touch = p && c && typeof p.w === 'number' && c.x - (p.x + p.w) < 0.8;
    out += (touch ? '' : ' ') + t;
  });
  return clean(out);
}
function parseBomItems(items, fileName) {
  const lines = groupLines(items);
  const doc = { file: fileName || '', docNo: '', date: '', productCode: '', productName: '', qty: 0, unit: '', unitCost: 0, lines: [], sum: 0, dl: 0, oh: 0, total: 0 };
  let last = null;
  for (const ln of lines) {
    const t = ln.items.map(i => clean(i.str));
    const raw = ln.items.map(i => i.str);
    const joined = raw.join(' ');
    const isTableHead = joined.includes('รหัสวัตถุดิบ');
    if (isTableHead) { last = null; continue; }
    // material row
    if (RE_CODE.test(t[0]) && t.length >= 5 && RE_NUM.test(t[t.length - 1]) && RE_NUM.test(t[t.length - 2]) && RE_NUM.test(t[t.length - 3])) {
      const n = t.length;
      const row = {
        code: t[0], name: joinPieces(ln.items.slice(1, n - 4), t.slice(1, n - 4)), unit: t[n - 4],
        qty: num(t[n - 3]), cost: num(t[n - 2]), amount: num(t[n - 1]),
      };
      if (n === 5) { row.name = t[1]; row.unit = ''; }
      doc.lines.push(row); last = row; continue;
    }
    // footer
    const lab = raw[0] || '';
    const lastNum = [...t].reverse().find(s => RE_NUM.test(s));
    const labIdx = raw.findIndex(s => s.includes('รวมเงิน'));
    if (labIdx >= 0) {
      if (raw[labIdx].includes('ทั')) doc.total = num(lastNum); else doc.sum = num(lastNum);
      last = null; continue;
    }
    if (/^DL\b/.test(lab.trim())) { doc.dl = num(lastNum); last = null; continue; }
    if (/^OH\b/.test(lab.trim())) { doc.oh = num(lastNum); last = null; continue; }
    // header labels
    let header = false;
    raw.forEach((s, i) => {
      const nx = t[i + 1];
      if (s.includes('เลขที') && s.includes('เอกสาร') && nx) { if (!doc.docNo) doc.docNo = nx; header = true; }
      else if (s.includes('วันที') && s.includes('เอกสาร') && nx) { if (!doc.date) doc.date = nx; header = true; }
      else if (s.includes('รหัสสินค้า') && nx) { if (!doc.productCode) doc.productCode = nx; header = true; }
      else if (s.includes('อสินค้า') && nx) {
        if (!doc.productName) {
          const parts = [];
          for (let j = i + 1; j < raw.length && !/ต้นทุน|นวน/.test(raw[j]); j++) parts.push(t[j]);
          doc.productName = parts.join(' ');
        }
        header = true;
      }
      else if (s.includes('นวน') && nx && RE_NUM.test(nx)) { if (!doc.qty) { doc.qty = num(nx); doc.unit = t[i + 2] || ''; } header = true; }
      else if (s.includes('ต้นทุน/หน่วย') && nx && RE_NUM.test(nx)) { if (!doc.unitCost) doc.unitCost = num(nx); header = true; }
    });
    if (header) { last = null; continue; }
    // continuation of a material name
    if (last && ln.items[0].x > 60 && ln.items[0].x < 320 && !t.some(s => RE_NUM.test(s) && s.includes('.'))) {
      last.name = (last.name + ' ' + t.join(' ')).trim();
      continue;
    }
    if (lab.includes('หมายเหตุ')) last = null;
  }
  if (!doc.total) doc.total = r2(doc.sum + doc.dl + doc.oh);
  if (!doc.docNo) { const m = String(fileName || '').match(/CR[A-Z]?\d{4}-\d{4}(?:-\d+)?/i); if (m) doc.docNo = m[0].toUpperCase(); }
  return doc;
}


/* ---------- Thai glyph repair ----------
   The ERP's PDFs embed AngsanaUPC with some glyphs (digits and tone marks inside Thai text)
   missing from the ToUnicode map, so text extraction yields U+0000. Those glyphs are copies
   of glyphs that ARE mapped elsewhere in the same font; match them by outline shape. */
function glyphPts(path) {
  const pts = [];
  (path || []).forEach(c => { const a = c.args || []; for (let i = 0; i + 1 < a.length; i += 2) pts.push(a[i], a[i + 1]); });
  return pts;
}
function glyphSig(path) {
  const pts = glyphPts(path);
  if (!pts.length) return '';
  let mx = Infinity, my = Infinity;
  for (let i = 0; i < pts.length; i += 2) { mx = Math.min(mx, pts[i]); my = Math.min(my, pts[i + 1]); }
  return path.map(c => c.cmd + (c.args || []).map((v, i) => Math.round((v - (i % 2 ? my : mx)) * 1000)).join(',')).join(';');
}
function pickChar(set) {
  const a = [...set];
  return a.find(c => /[฀-๿]/.test(c)) || a.find(c => /[0-9]/.test(c)) || a[0];
}
/* a character the ERP's Thai font should never produce: not ASCII, not Thai, not common punctuation */
const SUSPECT_RE = /[^ -~฀-๿\s °×±÷‘’“”–—•·…™®©]/;
const SUSPECT_G = new RegExp(SUSPECT_RE.source, 'g');
const isGoodChar = u => !!u && u !== '\u0000' && !SUSPECT_RE.test(u) && /\S/.test(u);
async function readPageItems(lib, page, pageNo) {
  const tc = await page.getTextContent();
  const items = tc.items.map(i => ({ page: pageNo, x: i.transform[4], y: i.transform[5], w: i.width, str: i.str, font: i.fontName }));
  const zeros = items.reduce((a, i) => a + (i.str.match(/\u0000/g) || []).length, 0);
  const odd = items.some(i => SUSPECT_RE.test(i.str));
  if (!zeros && !odd) return items;
  try {
    const ol = await page.getOperatorList();
    const O = lib.OPS; let font = null; const glyphs = {}; const seq = [];
    for (let i = 0; i < ol.fnArray.length; i++) {
      const fn = ol.fnArray[i], a = ol.argsArray[i];
      if (fn === O.setFont) font = a[0];
      else if (fn === O.showText) for (const g of a[0]) {
        if (!g || typeof g !== 'object') continue;
        const k = font + '_path_' + g.fontChar;
        if (!glyphs[k]) glyphs[k] = { font, u: g.unicode };
        if (g.unicode === '\u0000') seq.push(k);
      }
    }
    const objs = page.commonObjs, path = k => (objs.has(k) ? objs.get(k) : null);
    // outlines of glyphs whose text is trustworthy, per font
    const bySig = {};
    for (const [k, v] of Object.entries(glyphs)) {
      if (!isGoodChar(v.u)) continue;
      const p = path(k); if (!p) continue;
      const sg = v.font + '#' + glyphSig(p);
      (bySig[sg] = bySig[sg] || new Set()).add(v.u);
    }
    const resolve = k => { const p = path(k); if (!p) return null; const hit = bySig[glyphs[k].font + '#' + glyphSig(p)]; return hit ? pickChar(hit) : null; };
    // 1) glyphs with no text at all (U+0000): fix in reading order
    if (zeros && seq.length === zeros) {
      const fix = {};
      for (const k of new Set(seq)) { const c = resolve(k); if (c) fix[k] = c; }
      let qi = 0;
      items.forEach(it => { if (it.str.includes('\u0000')) it.str = it.str.replace(/\u0000/g, () => fix[seq[qi++]] || '\u0000'); });
    }
    // 2) glyphs mapped to a wrong character (Ś, Ş, É …): fix per font + character
    if (odd) {
      const map = {};
      for (const [k, v] of Object.entries(glyphs)) {
        if (!v.u || v.u === '\u0000' || !SUSPECT_RE.test(v.u)) continue;
        const c = resolve(k); if (!c) continue;
        const m = (map[v.font] = map[v.font] || {});
        if (m[v.u] && m[v.u] !== c) m[v.u] = null; else if (m[v.u] !== null) m[v.u] = c;   // ambiguous → leave as is
      }
      items.forEach(it => {
        const m = map[it.font]; if (!m) return;
        it.str = it.str.replace(SUSPECT_G, ch => m[ch] || ch);
      });
    }
  } catch (e) { /* keep text as extracted */ }
  return items;
}

/* Decide main vs sub documents for a set of BOM docs */
function assignRoles(docs) {
  const nos = docs.map(d => d.docNo);
  docs.forEach(d => {
    if (d.role) return;
    const m = d.docNo.match(/^(.*\d{4}-\d{4})-(\d+)$/);
    d.role = m ? 'sub' : 'main';
    if (d.role === 'sub' && !d.cat) d.cat = 'roller';
  });
  if (!docs.some(d => d.role === 'main') && docs.length === 1) docs[0].role = 'main';
  return docs;
}

/* ---------- calculation ---------- */
function rowPct(sheet, config, id, fallback) {
  const v = sheet.pct && sheet.pct[id];
  if (v !== undefined && v !== null && v !== '') return num(v);
  if (config.pct && config.pct[id] !== undefined) return num(config.pct[id]);
  return fallback ?? 0;
}

function compute(sheet, config) {
  const rows = [];
  const dmCost = {};
  CATS.filter(c => c.type === 'DM').forEach(c => (dmCost[c.id] = 0));
  let dlTotalBom = 0, ohTotalBom = 0;
  for (const d of sheet.docs || []) {
    if (d.role === 'sub') {
      dmCost[d.cat || 'roller'] = r2((dmCost[d.cat || 'roller'] || 0) + num(d.total));
    } else {
      for (const l of d.lines) dmCost[l.cat || 'none'] = r2((dmCost[l.cat || 'none'] || 0) + num(l.amount));
      dlTotalBom = r2(dlTotalBom + num(d.dl));
      ohTotalBom = r2(ohTotalBom + num(d.oh));
    }
  }
  for (const m of sheet.extra || []) dmCost[m.cat || 'none'] = r2((dmCost[m.cat || 'none'] || 0) + num(m.amount));

  const dlTotal = sheet.dlOverride !== undefined && sheet.dlOverride !== null && sheet.dlOverride !== '' ? num(sheet.dlOverride) : dlTotalBom;
  const ohTotal = sheet.ohOverride !== undefined && sheet.ohOverride !== null && sheet.ohOverride !== '' ? num(sheet.ohOverride) : ohTotalBom;
  const dlWe = num(sheet.dlWeekend), dlWd = num(sheet.dlWeekday);
  const dlInt = r2(dlTotal - dlWe - dlWd);

  const mk = (id, type, name, cost, defPct) => {
    const pct = rowPct(sheet, config, id, defPct);
    const c = r2(cost);
    const price = pct >= 100 ? c : r2(c / (1 - pct / 100));
    const disc = num(sheet.disc && sheet.disc[id]);
    const after = r2(price * (1 - disc / 100));
    const act = sheet.actual && sheet.actual[id];
    const actual = act === undefined || act === null || act === '' ? null : num(act);
    return { id, type, name, cost: c, pct, profit: r2(price - c), price, disc, after, actual, diff: actual === null ? null : r2(actual - c) };
  };
  const priceOnly = (config.priceOnly || {});
  CATS.filter(c => c.type === 'DM').forEach(c => {
    if (c.id === 'none' && !dmCost.none) return;
    if (priceOnly[c.id]) {
      const amt = r2(dmCost[c.id] || 0);
      const disc = num(sheet.disc && sheet.disc[c.id]);
      rows.push({ id: c.id, type: 'SP', priceOnly: true, name: c.name, cost: 0, pct: null, profit: 0, price: amt, disc, after: r2(amt * (1 - disc / 100)), actual: null, diff: null });
      return;
    }
    rows.push(mk(c.id, 'DM', c.name, dmCost[c.id] || 0, c.pct));
  });
  rows.push(mk('dl_int', 'DL', CAT_BY_ID.dl_int.name, dlInt, 60));
  rows.push(mk('dl_we', 'DL', CAT_BY_ID.dl_we.name, dlWe, 60));
  rows.push(mk('dl_wd', 'DL', CAT_BY_ID.dl_wd.name, dlWd, 60));
  let ohItems = 0;
  (sheet.ohItems || []).forEach((o, i) => {
    ohItems = r2(ohItems + num(o.amount));
    rows.push(mk('oh_' + (o.id || i), 'OH', o.name || 'OH', num(o.amount), 0));
  });
  const ohRest = r2(ohTotal - ohItems);
  if (Math.abs(ohRest) > 0.004) rows.push(mk('oh_rest', 'OH', 'OH อื่นๆ (ส่วนที่เหลือจาก BOM)', ohRest, 0));

  const sum = (f, t) => r2(rows.filter(r => !t || r.type === t).reduce((a, r) => a + r[f], 0));
  const totalDM = sum('cost', 'DM'), totalDL = sum('cost', 'DL'), totalOH = sum('cost', 'OH');

  if (!cur.docs.length && !(cur.extra || []).length) { toast('ยังไม่มีข้อมูลต้นทุน · นำเข้าไฟล์ PDF ก่อนกด Submit'); return; }
  submitting = true;
  try {
    const ae = document.activeElement; if (ae && ae.blur && ae !== document.body) ae.blur();   // commit the field being edited
    await new Promise(r => setTimeout(r, 0));
    const s = cur;
    s.submittedAt = Date.now();
    touch(); clearTimeout(saveQ.timer); saveQ.timer = null;
    document.querySelectorAll('[data-act="submit"]').forEach(b => { b.disabled = true; b.classList.add('busy'); });
    while (saveQ.busy) await new Promise(r => setTimeout(r, 100));
    try { await Store.saveSheet(s); }
    catch (e) {
      setStatus('บันทึกไม่สำเร็จ · กดเพื่อลองอีกครั้ง', 'err');
      toast('บันทึกไม่สำเร็จ ยังไม่ขึ้นใบใหม่' + (Store.mode === 'onedrive' ? ' · ' + odErrText(e) : ''));
      refreshCalcNow(); renderCmdbar(); return;
    }
    setStatus(storageLabel());
    startNewSheet();
    window.scrollTo({ top: 0 });
    toast(`บันทึก ${s.no} แล้ว · เริ่มใบใหม่ ${cur.no}`);
  } finally { submitting = false; }
}

/* ---------- PDF import ---------- */
async function pdfItems(buf) {
  const lib = window.pdfjsLib;
  if (!lib) throw new Error('ตัวอ่าน PDF ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง');
  // disableFontFace makes pdf.js hand over glyph outlines, used to repair unmapped Thai glyphs
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: true, fontExtraProperties: true }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) out.push(...await readPageItems(lib, await pdf.getPage(p), p));
  pdf.destroy();
  return out;
}
function applyMemory(doc) {
  doc.lines.forEach(l => {
    const mem = config.codes[l.code];
    if (mem && mem.name) { l.pdfName = l.name; l.name = mem.name; }
    l.cat = categorize(l.code, config);
  });
}
async function importFiles(fileList) {
  const files = [...fileList].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!files.length) { toast('เลือกได้เฉพาะไฟล์ PDF'); return; }
  setStatus('กำลังอ่าน PDF…', 'busy');
  const parsed = [], failed = [];
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      const d = parseBomItems(await pdfItems(buf.slice(0)), f.name);
      if (!d.docNo && !d.lines.length) { failed.push(f.name); continue; }
      applyMemory(d); d.uid = uid(); parsed.push(d); pdfBufs.set(d.uid, buf);
    } catch (e) { failed.push(f.name); console.error(e); }
  }
  if (!parsed.length) { setStatus(storageLabel()); toast('อ่านไฟล์ไม่ได้: ' + failed.join(', ')); return; }
  assignRoles(parsed);
  // a different main BOM than the one already in this sheet → start a new sheet
  const incomingMain = parsed.find(d => d.role === 'main');
  const curMain = cur && (cur.docs || []).find(d => d.role === 'main');
  let created = false;
  if (!cur || view !== 'sheet' || (incomingMain && curMain && baseNo(incomingMain.docNo) !== baseNo(curMain.docNo))) {
    if (saveQ.timer) flushSheet();
    cur = newSheet(); created = true;
  }
  for (const d of parsed) {
    const i = cur.docs.findIndex(x => x.docNo && x.docNo === d.docNo);
    if (i >= 0) cur.docs[i] = d; else cur.docs.push(d);
  }
  const main = cur.docs.find(d => d.role === 'main');
  if (main && !cur.bomRef) cur.bomRef = main.docNo + ' : ' + main.productName;
  if (main && blankVal(cur.productCode) && main.productCode) cur.productCode = main.productCode;
  if (main && blankVal(cur.crcNo) && main.docNo) cur.crcNo = main.docNo;
  if (main && !cur.note) cur.note = main.productName;
  view = 'sheet'; touch(); render();
  const msg = `อ่าน ${parsed.length} ไฟล์แล้ว` + (created ? ' · สร้างใบใหม่ ' + cur.no : '') + (failed.length ? ` · อ่านไม่ได้ ${failed.length} ไฟล์` : '');
  toast(msg);
  if (Store.mode === 'onedrive') savePdfsToSharePoint(cur, parsed); else parsed.forEach(d => pdfBufs.delete(d.uid));
}
const baseNo = no => String(no || '').replace(/-\d+$/, '');

const pdfBufs = new Map();
function toB64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
const pdfName = d => (String(d.docNo || String(d.file || '').replace(/\.pdf$/i, '')).replace(/[\\/:*?"<>|#%]+/g, '-').trim() || 'BOM') + '.pdf';
async function savePdfsToSharePoint(sheet, docs) {
  if (Store.mode !== 'onedrive') return;
  if (!OD.pdfId) await OD.ensurePdfFolder();
  if (!OD.pdfId) { docs.forEach(d => pdfBufs.delete(d.uid)); toast('เก็บ PDF ลง SharePoint ไม่ได้: หาโฟลเดอร์ PDF ไม่เจอ'); return; }
  let ok = 0, big = 0, bad = 0;
  for (const d of docs) {
    const buf = pdfBufs.get(d.uid); pdfBufs.delete(d.uid); if (!buf) continue;
    if (buf.byteLength > 4194304) { big++; continue; }
    try {
      const r = await OD.putBinary(OD.pdfId, pdfName(d), toB64(buf), buf.byteLength);
      d.pdf = { name: pdfName(d), itemId: r.id, url: r.url, saved: Date.now() }; ok++;
    } catch (e) { bad++; console.warn('PDF upload', e); }
  }
  if (ok) {
    if (sheet === cur && sheets.has(sheet.id)) touch(); else if (sheets.has(sheet.id)) { sheet.updated = Date.now(); Store.saveSheet(sheet).catch(() => {}); }
    const ch = document.querySelector('#drop .chips'); if (ch && sheet === cur) ch.innerHTML = cur.docs.map((x, i) => docChip(x, i)).join('');
  }
  const parts = [];
  if (ok) parts.push(`เก็บ PDF ${ok} ไฟล์ไว้ที่ SharePoint › ${OD_APP} › PDF แล้ว`);
  if (big) parts.push(`${big} ไฟล์ใหญ่เกิน 4 MB เก็บไม่ได้`);
  if (bad) parts.push(`${bad} ไฟล์อัปโหลดไม่สำเร็จ`);
  if (parts.length) toast(parts.join(' · '));
}

}

function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}

async function readTextFile(file) {

  let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('\ufffd')) { try { t = new TextDecoder('windows-874').decode(buf); } catch (e) {} }
  return t;
}
