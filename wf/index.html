<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

.hin{max-width:720px;margin:0 auto;padding:0 16px}
.nav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back{justify-self:start;color:var(--acc);font-size:17px;display:flex;visibility:hidden;align-items:center;gap:2px;margin-left:-6px;white-space:nowrap}

async function g(path,opt={}){
  const t=await token();const headers={Authorization:'Bearer '+t,...(opt.headers||{})};let body;
  if(opt.json){headers['Content-Type']='application/json';body=JSON.stringify(opt.json)}
  for(let a=0;;a++){
    const r=await fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{method:opt.method||'GET',headers,body});
    if((r.status===503||r.status===429)&&a<2){await new Promise(z=>setTimeout(z,800*(a+1)));continue}
    if(!r.ok){let m='';try{m=JSON.parse(await r.text()).error.message}catch(_){};const err=new Error((opt.method||'GET')+' '+path.split('?')[0]+(m?' : '+m:''));err.status=r.status;throw err}
    return r.status===204?null:r.json()}
}
const titleOf=r=>((r.code||'WF')+' '+(r.title||'')).trim();
const store={
  async load(){
    if(DEMO)return JSON.parse(localStorage.getItem('wf-demo')||'[]');
    let rows=[],next=`/sites/${siteId}/lists/${lists[LIST]}/items?$expand=fields($select=Title,Data)&$top=999`;
    while(next){const r=await g(next);r.value.forEach(it=>{let d={};try{d=JSON.parse(it.fields.Data||'{}')}catch(e){}rows.push({...d,_id:it.id})});next=r['@odata.nextLink']}
    return rows},
  async save(r){const {_id,...d}=r;
    if(DEMO){if(_id){const i=DATA.findIndex(x=>x._id===_id);DATA[i]={...d,_id}}else DATA.push({...d,_id:'d'+Date.now()});localStorage.setItem('wf-demo',JSON.stringify(DATA));return}
    const fields={Title:titleOf(d).slice(0,250),Data:JSON.stringify(d)};const id=lists[LIST];
    if(_id){await g(`/sites/${siteId}/lists/${id}/items/${_id}/fields`,{method:'PATCH',json:fields});const i=DATA.findIndex(x=>x._id===_id);DATA[i]={...d,_id}}
    else{const it=await g(`/sites/${siteId}/lists/${id}/items`,{method:'POST',json:{fields}});DATA.push({...d,_id:it.id})}},
  async del(_id){if(!DEMO)await g(`/sites/${siteId}/lists/${lists[LIST]}/items/${_id}`,{method:'DELETE'});DATA=DATA.filter(x=>x._id!==_id);if(DEMO)localStorage.setItem('wf-demo',JSON.stringify(DATA))}

async function loadLogo(){if(LOGO||DEMO||!lists['Repair Photos'])return LOGO;
  try{await loadLib('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','JSZip');
    const d=await g(`/sites/${siteId}/lists/${lists['Repair Photos']}/drive?$select=id`);const it=await g(`/drives/${d.id}/root:/_template/${TPL}`);
    const res=await fetch(it['@microsoft.graph.downloadUrl']);const z=await JSZip.loadAsync(await res.arrayBuffer());
    const f=Object.keys(z.files).find(n=>/^xl\/media\/.*\.(png|jpe?g)$/i.test(n));if(f)LOGO=`data:image/${/png$/i.test(f)?'png':'jpeg'};base64,`+await z.file(f).async('base64')}catch(e){console.warn('logo',e)}

const WF_KIND={p:'กล่องงาน',d:'จุดตัดสินใจ (เห็นชอบ? / ผ่าน?)',s:'เริ่ม / จบงาน (วงรี)'};
function wfLayout(n){const avail=1123-72-128-12-26-14-118-12;const H=Math.max(38,Math.min(80,Math.floor(avail/Math.max(1,n))));return {H,FW:404}}
function wfFlow(r){const S=r.steps||[],n=S.length,{H,FW}=wfLayout(n);const cx=Math.round(FW/2)+12,W=150;
  const hOf=k=>k==='d'?Math.min(54,H-18):Math.min(40,H-20);
  let svg='',html='',loops=0;
  const ys=S.map((s,i)=>i*H+H/2);
  S.forEach((s,i)=>{const h=hOf(s.k),y=ys[i];
    if(s.k==='d')svg+=`<polygon points="${cx},${y-h/2} ${cx+W/2+6},${y} ${cx},${y+h/2} ${cx-W/2-6},${y}" fill="#fdf5e0" stroke="#8a6d1e" stroke-width="1.6"/>`;
    else svg+=`<rect x="${cx-W/2}" y="${y-h/2}" width="${W}" height="${h}" rx="${s.k==='s'?h/2:5}" fill="${s.k==='s'?'#efefef':'#edf4ee'}" stroke="${s.k==='s'?'#555':'#1e5e3a'}" stroke-width="1.6"/>`;
    html+=`<div class="nd" style="left:${cx-W/2+(s.k==='d'?18:0)}px;top:${y-h/2}px;width:${W-(s.k==='d'?36:0)}px;height:${h}px">${esc(s.t||'')}</div>`;
    if(i<n-1){const y2=ys[i+1]-hOf(S[i+1].k)/2;svg+=`<line x1="${cx}" y1="${y+h/2}" x2="${cx}" y2="${y2-1}" stroke="#333" stroke-width="1.6" marker-end="url(#wfa)"/>`;
      if(s.k==='d'&&s.yes)html+=`<div class="lbl" style="left:${cx+6}px;top:${y+h/2+2}px;color:#2e6b45">${esc(s.yes)}</div>`}
    const b=s.back;if(s.k==='d'&&b!==''&&b!=null&&S[b]&&b!==i){const xl=cx-W/2-30-14*loops++;const yt=ys[b];const wt=S[b].k==='d'?W/2+6:W/2;
      svg+=`<polyline points="${cx-W/2-6},${y} ${xl},${y} ${xl},${yt} ${cx-wt-1},${yt}" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#wfa)"/>`;
      if(s.no)html+=`<div class="lbl" style="left:${xl}px;top:${y+4}px;transform:translateX(-50%);color:#a33">${esc(s.no)}</div>`}
  });
  return `<div style="position:relative;width:${FW}px;height:${n*H}px;margin:0 auto"><svg width="${FW}" height="${n*H}" viewBox="0 0 ${FW} ${n*H}" style="position:absolute;left:0;top:0"><defs><marker id="wfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>${svg}</svg>${html}</div>`}
function wfHTML(r){const S=r.steps||[],{H}=wfLayout(S.length);const sg=r.sign||{};const dots='........................................';
  const sgn=k=>(sg[k]||{});
  return `<div class="wff"><table><colgroup><col style="width:15%"><col style="width:51%"><col style="width:21%"><col style="width:13%"></colgroup>
  <tr><td colspan="4" class="co">${esc(r.company||'บริษัทยูเนียนเบลท์ อินเตอร์เนชั่นแนล จำกัด')}</td></tr>
  <tr><td rowspan="4" class="lg">${LOGO?`<img src="${LOGO}">`:'<b>UNB</b>'}</td><td rowspan="2" class="wt">Work Flow</td><td class="lb">รหัสเอกสาร (Doc No) :</td><td class="vl">${esc(r.code)}</td></tr>
  <tr><td class="lb">แก้ไขครั้งที่ (Revision) :</td><td class="vl">${esc(r.rev)}</td></tr>
  <tr><td rowspan="2" class="ti">เรื่อง : ${esc(r.title)}</td><td class="lb">วันที่บังคับใช้ (Effective date) :</td><td class="vl">${esc(dmy(r.eff))}</td></tr>
  <tr><td class="lb">หน้าที่ (Page) :</td><td class="vl">1 / 1</td></tr></table>
  <table style="margin-top:12px" class="fh"><colgroup><col style="width:9%"><col style="width:56%"><col style="width:35%"></colgroup>
  <tr><th>ลำดับ</th><th>ผังงาน (Flow)</th><th>ผู้รับผิดชอบ</th></tr>
  ${S.map((s,i)=>`<tr style="height:${H}px"><td class="no">${i+1}</td>${i?'':`<td rowspan="${S.length}" class="fc">${wfFlow(r)}</td>`}<td class="rs">${esc(s.who||'')}</td></tr>`).join('')}</table>
  <table style="margin-top:14px;border:1.5px solid #000" class="sg"><colgroup><col><col><col></colgroup>
  <tr><th>ผู้จัดทำ (Prepared by)</th><th>ผู้ทบทวน (Reviewed by)</th><th>ผู้อนุมัติ (Approved by)</th></tr>
  <tr class="sp"><td></td><td></td><td></td></tr>
  <tr>${['p','r','a'].map(k=>`<td>( ${sgn(k).n?esc(sgn(k).n):dots} )</td>`).join('')}</tr>
  <tr class="dt">${['p','r','a'].map(k=>`<td>วันที่ : ${sgn(k).d?esc(dmy(sgn(k).d)):'...../...../........'}</td>`).join('')}</tr></table></div>`}
function wfPrev(box,r){const sc=Math.min(1,box.clientWidth/794)||.45;box.style.height=Math.ceil(1123*sc)+'px';box.innerHTML=`<div style="width:794px;transform:scale(${sc});transform-origin:0 0"><style>${WF_CSS}</style>${wfHTML(r)}</div>`}
const fileBase=r=>safeName(`${r.code||'WF'}_${r.title||''}${r.rev?'_Rev.'+r.rev:''}`);
async function wfPdf(r){await loadLib('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','html2canvas');await loadLib('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','jspdf');
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-12000px;top:0;width:794px';host.innerHTML=`<style>${WF_CSS}</style>${wfHTML(r)}`;document.body.appendChild(host);
  try{try{await document.fonts.ready}catch(_){};await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?0:new Promise(z=>{i.onload=i.onerror=z})));
    const c=await html2canvas(host.querySelector('.wff'),{scale:2.5,backgroundColor:'#fff',logging:false});
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',0,0,210,297);
    pdf.setProperties({title:titleOf(r)});saveFile(pdf.output('blob'),fileBase(r)+'.pdf')}finally{host.remove()}}
function wfPrint(r){const w=window.open('','_blank');if(!w){toast('เบราว์เซอร์บล็อกหน้าต่างใหม่ ลองกดปุ่ม PDF แทน');return}
  w.document.open();w.document.write(`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>${esc(fileBase(r))}</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><style>@page{size:A4 portrait;margin:0}html,body{margin:0;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}${WF_CSS}.wff{height:1120px;overflow:hidden}</style></head><body>${wfHTML(r)}<script>(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>window.print(),300))<\/script></body></html>`);w.document.close()}

function wireButtons(get){document.querySelectorAll('[data-wx]').forEach(b=>b.onclick=async()=>{const r=get();if(!r)return;if(b.dataset.wx==='print'){wfPrint(r);return}

function wfEdit(r,draft){const isNew=!r||!r._id;const m=draft||JSON.parse(JSON.stringify(r||WF_BLANK()));if(!Array.isArray(m.steps))m.steps=[];m.sign=m.sign||{};['p','r','a'].forEach(k=>m.sign[k]=m.sign[k]||{n:'',d:''});

  let tm=0;const upd=()=>{clearTimeout(tm);tm=setTimeout(()=>{sync();if($('we_prev'))wfPrev($('we_prev'),m)},250)};

  function draw(){const n=m.steps.length;
  openSheet(`${shh('<button class="x" id="we_x">ยกเลิก</button>',isNew?'Work Flow ใหม่':'แก้ไข Work Flow','<button class="x b" id="we_s">บันทึก</button>')}
  <div class="fgroup"><h3>หัวเอกสาร</h3></div><div class="formg">

    ${s.k==='d'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input data-f="yes" value="${esc(s.yes??'เห็นชอบ')}" placeholder="คำทางผ่าน" style="${inp}"><input data-f="no" value="${esc(s.no??'ไม่เห็นชอบ')}" placeholder="คำทางไม่ผ่าน" style="${inp}"></div>
    <label style="font-size:13px;color:var(--sub)">ถ้าไม่ผ่าน ให้ย้อนกลับไปขั้นที่</label><select data-f="back" style="${inp}"><option value="">— ไม่มีเส้นย้อนกลับ —</option>${m.steps.map((x,j)=>j===i?'':`<option value="${j}" ${s.back===j?'selected':''}>${j+1}. ${esc(x.t||'')}</option>`).join('')}</select>`:''}</div></div>`).join('')}
  <div class="btnlist" style="margin-top:10px"><button id="we_add">+ เพิ่มขั้นตอน</button></div>
  <div class="fgroup"><h3>ลงนาม (เว้นว่างได้ ถ้าจะเซ็นมือ)</h3></div><div class="formg">
  ${[['p','ผู้จัดทำ'],['r','ผู้ทบทวน'],['a','ผู้อนุมัติ']].map(([k,l])=>`<div class="f"><label>${l}</label><input id="we_sn${k}" value="${esc(m.sign[k].n)}" placeholder="ชื่อ-นามสกุล"></div><div class="f"><label>วันที่ (${l})</label><input id="we_sd${k}" type="date" value="${esc(m.sign[k].d)}"></div>`).join('')}</div>
  <div class="fgroup"><h3>ตัวอย่างก่อนพิมพ์</h3></div><div class="fmprev" id="we_prev" style="cursor:default"></div>
  ${wfButtons(m)}
  ${isNew?'':'<div class="btnlist"><button class="d" id="we_del">ลบ Work Flow นี้</button></div>'}`);
  wfPrev($('we_prev'),m);
  $('sheet').querySelectorAll('input,select').forEach(el=>{el.addEventListener('input',upd);el.addEventListener('change',upd)});
  $('sheet').querySelectorAll('[data-kind]').forEach(el=>el.addEventListener('change',()=>{sync();const s=m.steps[+el.dataset.kind];if(s.k==='d'){if(s.yes==null)s.yes='เห็นชอบ';if(s.no==null)s.no='ไม่เห็นชอบ';if(s.back==null)s.back=+el.dataset.kind>0?+el.dataset.kind-1:''}redo()}));
  $('we_add').onclick=()=>{sync();const last=m.steps[m.steps.length-1];const at=last&&last.k==='s'?m.steps.length-1:m.steps.length;remap(b=>b>=at?b+1:b);m.steps.splice(at,0,{k:'p',t:'',who:''});redo()};
  $('sheet').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{sync();const i=+b.dataset.del;m.steps.splice(i,1);remap(x=>x===i?'':x>i?x-1:x);redo()});
  $('sheet').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{sync();const i=+b.dataset.mv,j=i+(+b.dataset.d);if(j<0||j>=m.steps.length)return;[m.steps[i],m.steps[j]]=[m.steps[j],m.steps[i]];remap(x=>x===i?j:x===j?i:x);redo()});
  $('we_x').onclick=()=>r&&r._id?wfView(DATA.find(x=>x._id===r._id)):closeSheet();
  wireButtons(()=>{sync();return m});
  $('we_s').onclick=async()=>{sync();if(!m.title){toast('กรุณากรอกชื่อเรื่อง');$('we_title').focus();return}if(!m.steps.some(s=>s.t)){toast('กรุณากรอกขั้นตอนอย่างน้อย 1 ขั้น');return}
    const b=$('we_s');b.disabled=true;const rec={...m,type:'wf',by:me,at:nowIso()};if(r&&r._id)rec._id=r._id;
    try{await store.save(rec);toast('บันทึกแล้ว');render();wfView(rec._id?DATA.find(x=>x._id===rec._id):DATA[DATA.length-1])}catch(e){toast(e.status===403?'ไม่มีสิทธิ์บันทึก':'บันทึกไม่สำเร็จ: '+e.message)}finally{if($('we_s'))b.disabled=false}};
  if($('we_del'))$('we_del').onclick=async()=>{if(!confirm('ลบ Work Flow “'+(m.title||m.code)+'” ?'))return;try{await store.del(r._id);closeSheet();toast('ลบแล้ว');render()}catch(e){toast('ลบไม่สำเร็จ: '+e.message)}};
  }
  draw();if(!LOGO)loadLogo().then(()=>{if($('we_prev'))wfPrev($('we_prev'),m)})}

async function boot(){$('scrim').onclick=closeSheet;
  if(DEMO){me='ทดลอง (demo)';DATA=await store.load();mode='ready';render();return}
  try{
    msal=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    await msal.handleRedirectPromise().catch(()=>{});
    account=msal.getActiveAccount()||msal.getAllAccounts()[0]||null;
    if(!account){mode='signin';render();return}
    msal.setActiveAccount(account);me=account.name||account.username;
    const u=new URL(CFG.siteUrl);siteId=(await g(`/sites/${u.hostname}:${u.pathname}`)).id;
    let next=`/sites/${siteId}/lists?$select=id,displayName&$top=200`;
    while(next){const r=await g(next);r.value.forEach(l=>lists[l.displayName]=l.id);next=r['@odata.nextLink']}
    if(!lists[LIST])throw new Error('ยังไม่มี list "'+LIST+'" ใน SharePoint ITPortal');
    DATA=await store.load();mode='ready';render();loadLogo();
  }catch(e){errMsg=e.message;mode='err';render()}
}
boot();
</script>
</body></html>
