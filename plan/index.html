function apStat(r,t){t=t||apToday();const S=r.stages||{};
  if(r.st==='cancel')return {k:'cancel',l:'ยกเลิก',c:'mute'};
  if(r.st==='done')return {k:'done',l:'ส่งมอบแล้ว',c:'ok'};

  const has=AP_ST.filter(x=>S[x.k]&&S[x.k].s);
  if(S.ship&&apEnd(S.ship)<t)return {k:'late',l:'เลยกำหนดส่ง',c:'bad'};
  const cur=[...has].reverse().find(x=>S[x.k].s<=t&&t<=apEnd(S[x.k]));
  if(cur)return {k:cur.k,l:cur.a,c:cur.k==='ship'?'warn':'info'};
  const next=has.filter(x=>S[x.k].s>t).sort((a,b)=>S[a.k].s.localeCompare(S[b.k].s))[0];
  if(next)return has.some(x=>S[x.k].s<=t)?{k:'w-'+next.k,l:next.w,c:'info'}:{k:'wait',l:'ยังไม่เริ่ม',c:'mute'};

const AP_IM={plus:'plus',doc:'file-text',gear:'settings',l:'chevron-left',r:'chevron-right',x:'x'};

const apWide=()=>window.matchMedia('(min-width:720px)').matches;

function planTools(){const it=canEdit('plan');
  return `<div class="aphd"><div><h1>แผนการผลิต</h1><p>ติดตามงานตามใบสั่งขาย (SO) ตั้งแต่เขียนแบบ จัดซื้อ ผลิต จนถึงส่งมอบ</p></div>

function renderPlan(){const M=$('main');

  if(!DATA.plan){M.innerHTML=`<div class="apstats" aria-hidden="true">${'<button disabled><span>&nbsp;</span><b>–</b></button>'.repeat(4)}</div><div class="apcards" style="margin-top:24px" aria-label="กำลังโหลด">${'<div class="apsk"></div>'.repeat(6)}</div>`;return}
  if(!APS.mode)APS.mode=apWide()?'tl':'list';if(!APS.ym)APS.ym=apToday().slice(0,7);

    if($('ap_imp0'))$('ap_imp0').onclick=()=>apImport();if($('ap_new0'))$('ap_new0').onclick=()=>apEdit(null);return}
  const n=k=>J.filter(AP_SEGS.find(x=>x[0]===k)[2]).length;const nl=n('late');
  const stat=(k,l,cls)=>`<button aria-pressed="${APS.seg===k}" data-aps="${k}"><span>${l}</span><b class="${cls||''}">${n(k).toLocaleString()}</b></button>`;
  const L=apList();
  M.innerHTML=`<div class="apstats" role="group" aria-label="กรองตามสถานะ">${stat('active','กำลังดำเนินการ')}${stat('week','กำหนดส่งใน 7 วัน')}${stat('late','เลยกำหนดส่ง',nl?'bad':'')}${stat('done','ส่งมอบแล้ว')}</div>
  <div class="apbar"><label class="search">${lu('search',18)}<input id="ap_q" type="search" placeholder="ค้นหาเลขที่ SO หรือชื่อลูกค้า" aria-label="ค้นหางาน" value="${esc(APS.q)}" autocomplete="off"></label>
  <div class="seg" role="group" aria-label="มุมมอง"><button data-apm="tl" class="${APS.mode==='tl'?'on':''}" aria-pressed="${APS.mode==='tl'}">${lu('chart-gantt',16)}ไทม์ไลน์</button><button data-apm="list" class="${APS.mode==='list'?'on':''}" aria-pressed="${APS.mode==='list'}">${lu('list',16)}รายการ</button></div>
  ${APS.seg!=='all'?`<button class="apbtn t" data-aps="all">ดูทั้งหมด ${J.length}</button>`:''}</div>
  <div id="ap_body"></div>`;
  M.querySelectorAll('[data-aps]').forEach(b=>b.onclick=()=>{APS.seg=APS.seg===b.dataset.aps&&b.dataset.aps!=='all'?'all':b.dataset.aps;renderPlan()});
  M.querySelectorAll('[data-apm]').forEach(b=>b.onclick=()=>{APS.mode=b.dataset.apm;renderPlan()});
  const q=$('ap_q');q.oninput=()=>{APS.q=q.value;apBody()};

function apBody(){const B=$('ap_body');if(!B)return;const L=apList();if(APS.mode==='tl')B.innerHTML=apTimeline(L);else B.innerHTML=apCards(L);
  B.querySelectorAll('[data-apid]').forEach(e=>{e.onclick=()=>apDetail(e.dataset.apid);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();apDetail(e.dataset.apid)}}});
  B.querySelectorAll('[data-apmon]').forEach(b=>b.onclick=()=>{const v=b.dataset.apmon;APS.ym=v==='0'?apToday().slice(0,7):apYmAdd(APS.ym,+v);apBody()});
  const gw=B.querySelector('.apgw');if(gw&&APS.ym===apToday().slice(0,7)){const td=gw.querySelector('.apdays .now');if(td&&gw.scrollWidth>gw.clientWidth){const x=td.getBoundingClientRect().left-gw.getBoundingClientRect().left;const lc=gw.querySelector('.apgh .l').offsetWidth;gw.scrollLeft=Math.max(0,x-lc-(gw.clientWidth-lc)/2)}}}
const apEmptyRes=()=>`<div class="apempty">${lu('search',24)}<b>ไม่พบงานที่ตรงกับเงื่อนไข</b><p>${APS.q?'ลองค้นหาด้วยเลขที่ SO หรือชื่อลูกค้าแบบสั้นลง':'ลองเลือกสถานะอื่น หรือดูงานทั้งหมด'}</p><button class="apbtn s" onclick="APS.seg='all';APS.q='';renderPlan()">ดูงานทั้งหมด</button></div>`;
function apTimeline(L){const ym=APS.ym,nd=apDim(ym),a=ym+'-01',z=ym+'-'+String(nd).padStart(2,'0'),t=apToday();
  const R=L.filter(r=>{const s=apSpan(r);return s&&s.s<=z&&s.e>=a}).sort((x,y)=>(+x.seq||1e9)-(+y.seq||1e9)||String(x.no).localeCompare(String(y.no)));
  const days=Array.from({length:nd},(_,i)=>apAdd(a,i));
  const bg=`linear-gradient(90deg,${days.map((d,i)=>{const c=apOff(d)?'var(--c-sunk)':'transparent';return `${c} ${(i/nd*100).toFixed(3)}% ${((i+1)/nd*100).toFixed(3)}%`}).join(',')})`;
  const pct=d=>apDiff(a,d)/nd*100;
  const row=r=>{const S=r.stages||{},s=apStat(r);const bars=AP_ST.filter(x=>S[x.k]&&S[x.k].s).map(x=>{const g=S[x.k];const s0=g.s<a?a:g.s,e0=apEnd(g)>z?z:apEnd(g);if(s0>z||e0<a)return '';const w=apDiff(s0,e0)+1;const lab=`${x.n} ${apRange(g)}`;
      return `<span class="apb ${x.one&&w<3?'one':''} ${g.s<a?'apcl':''} ${apEnd(g)>z?'apcr':''}" style="--sc:${x.c};left:calc(${pct(s0)}% + 1px);width:calc(${w/nd*100}% - 2px)" title="${esc(lab)}">${w>=4?esc(x.n):''}</span>`}).join('');
    const nts=(r.notes||[]).filter(n=>n.d>=a&&n.d<=z).map(n=>`<span class="apnt" style="left:${pct(n.d)+50/nd}%" title="${esc(apShort(n.d)+' · '+n.t)}"></span>`).join('');
    const aria=`${r.no} ${r.cust||''} สถานะ ${s.l}`+AP_ST.filter(x=>S[x.k]).map(x=>`, ${x.n} ${apRange(S[x.k])}`).join('');
    return `<div class="apgr ${s.k==='done'?'done':''}" role="button" tabindex="0" data-apid="${esc(r._id)}" aria-label="${esc(aria)}"><div class="l"><b>${esc(r.no||'-')}</b><small><span class="dot" style="background:var(--c-${{ok:'ok',bad:'bad',warn:'warn',info:'info',mute:'line2'}[s.c]})"></span>${esc(r.cust||'')}${r.cust?' · ':''}${esc(s.l)}</small></div><div class="aptr">${bars}${nts}</div></div>`};
  const tdl=t>=a&&t<=z?`<div class="aptd" style="left:calc(var(--lc) + (100% - var(--lc)) * ${(pct(t)+50/nd)/100})"></div>`:'';
  return `<div class="apmon"><button class="apib" data-apmon="-1" aria-label="เดือนก่อน">${apSvg('l')}</button><h2>${apMonTh(ym)}</h2><button class="apib" data-apmon="1" aria-label="เดือนถัดไป">${apSvg('r')}</button>${ym!==t.slice(0,7)?'<button class="apbtn t" data-apmon="0">เดือนนี้</button>':''}<span class="cnt">${R.length} งานในเดือนนี้</span></div>
  ${R.length?`<div class="apgw"><div class="apg" role="list" aria-label="ไทม์ไลน์แผนการผลิต ${apMonTh(ym)}" style="--nd:${nd};--apbg:${bg}"><div class="apgh" aria-hidden="true"><div class="l">SO · ลูกค้า</div><div class="apdays">${days.map(d=>`<span class="${apOff(d)?'off':''} ${d===t?'now':''}">${AP_WD[apDt(d).getDay()]}<b>${+d.slice(8)}</b></span>`).join('')}</div></div>${R.map(row).join('')}${tdl}</div></div>`:`<div class="apempty"><b>ไม่มีงานใน${apMonTh(ym)}</b><p>เลื่อนไปเดือนอื่น หรือเปลี่ยนตัวกรองสถานะ</p></div>`}
  <div class="aplg" aria-label="คำอธิบายสี">${AP_ST.map(x=>`<span><i style="background:${x.one?x.c:`color-mix(in srgb,${x.c} 20%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,${x.c} 45%,transparent)`}"></i>${x.n}</span>`).join('')}<span><i class="tdy"></i>วันนี้</span><span><i style="background:var(--c-sunk);box-shadow:inset 0 0 0 1px var(--c-line)"></i>วันหยุด</span></div>`}
function apSteps(r){const S=r.stages||{},t=apToday(),done=r.st==='done';const L=AP_ST.filter(x=>x.k!=='conf'||S.conf);
  return `<span class="apsteps" aria-hidden="true">${L.map(x=>{const g=S[x.k];const on=done||(g&&apEnd(g)<t);const cur=!on&&g&&g.s<=t;return `<i class="${on?'on':cur?'cur':''}" style="--sc:${x.c}"></i>`}).join('')}</span>`}
function apCards(L){if(!L.length)return apEmptyRes();const t=apToday();
  const key=r=>{const s=apStat(r);return [s.k==='late'?0:r.st==='done'?3:r.st==='cancel'?4:1,r.st==='done'?-(+String(apShip(r)||'0').replace(/-/g,'')):(apShip(r)||'9999')]};
  const S=[...L].sort((x,y)=>{const a=key(x),b=key(y);return a[0]-b[0]||(typeof a[1]==='number'?a[1]-b[1]:String(a[1]).localeCompare(String(b[1])))});
  return `<div class="apcards">${S.slice(0,APS.lim||80).map(r=>{const s=apStat(r),sh=apShip(r);const dd=sh?apDiff(t,sh):null;
    const due=sh?(r.st==='done'?`ส่งมอบ ${thDate(sh)}`:dd<0?`เลยกำหนด ${-dd} วัน (${apShort(sh)})`:dd===0?`ส่งมอบ ${apShort(sh)}`:`ส่งมอบ ${apShort(sh)} · อีก ${dd} วัน`):'ยังไม่กำหนดวันส่ง';
    return `<div class="apcard" role="button" tabindex="0" data-apid="${esc(r._id)}"><span class="t">${esc(r.no||'-')}<small>${esc(r.cust||'')}</small></span>${apBadge(s)}<span class="m">${apSteps(r)}<span class="due ${s.k==='late'?'bad':''}">${esc(due)}</span></span></div>`}).join('')}</div>

  const buf=await wb.xlsx.writeBuffer();return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

$('scrim').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('on'))closeSheet()});
window.addEventListener('scroll',()=>{$('hdr').classList.toggle('sc',scrollY>4);$('ntitle').classList.toggle('on',scrollY>60)},{passive:true});
$('fab').onclick=()=>apEdit(null);
$('who').onclick=()=>{openSheet(`${shh('','บัญชี','<button class="x b" id="w_x">เสร็จ</button>')}<div class="kv"><div><span class="k">ชื่อ</span><span class="v">${esc(me)}</span></div><div><span class="k">สิทธิ์</span><span class="v">${CAN_EDIT?'ฝ่ายวางแผน · เพิ่ม / แก้ไขแผนได้':'ดูได้อย่างเดียว'}</span></div><div><span class="k">เวอร์ชัน</span><span class="v">${APP_VERSION}</span></div></div><div class="btnlist"><button class="d" id="w_out">${lu('log-out',18)}ออกจากระบบ</button></div>`);$('w_x').onclick=closeSheet;$('w_out').onclick=()=>{if(DEMO)location.href=location.pathname;else msal.logoutRedirect({account,postLogoutRedirectUri:location.origin+location.pathname})}};
let _ld=false;
async function reload(){try{DATA.plan=await store.load();render()}catch(e){toast('โหลดข้อมูลไม่สำเร็จ: '+e.message)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mode==='ready'&&!DEMO&&!$('sheet').classList.contains('on'))reload()});
(async()=>{try{
  if(DEMO){me=new URLSearchParams(location.search).has('visitor')?'พนักงาน (ทดลอง)':'ฝ่ายวางแผน (ทดลอง)';lists={[LIST]:'demo'}}
  else{if(!window.msal)throw new Error('โหลดระบบเข้าสู่ระบบของ Microsoft ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    /* redirectUri ที่ลงทะเบียนไว้แล้วในแอป Entra ID เดิม · MSAL พากลับมาหน้านี้เอง */
    msal=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:CFG.authRedirect,navigateToLoginRequestUrl:true},cache:{cacheLocation:'localStorage'}});
    if(msal.initialize)await msal.initialize();const res=await msal.handleRedirectPromise().catch(()=>null);
    account=(res&&res.account)||msal.getActiveAccount&&msal.getActiveAccount()||msal.getAllAccounts()[0]||null;
    if(!account){mode='signin';render();return}
    if(msal.setActiveAccount)msal.setActiveAccount(account);me=account.name||account.username;
    const u=new URL(CFG.siteUrl);siteId=(await g(`/sites/${u.hostname}:${u.pathname}`)).id;
    let next=`/sites/${siteId}/lists?$select=id,displayName&$top=200`;while(next){const r=await g(next);r.value.forEach(l=>lists[l.displayName]=l.id);next=r['@odata.nextLink']}
    if(!lists[LIST])throw new Error('บัญชีนี้ยังไม่มีสิทธิ์ดูข้อมูลแผนการผลิต · ติดต่อผู้ดูแลระบบเพื่อขอสิทธิ์')}
  $('who').innerHTML=`${lu('circle-user-round',20)}<span>${esc(String(me).split(' ')[0])}</span>`;
  mode='ready';render();await permInit();DATA.plan=await store.load();render();rpTpl()}
catch(e){mode='err';errMsg=(e.status?('('+e.status+') '):'')+(e.message||e);render()}})();

</script>
