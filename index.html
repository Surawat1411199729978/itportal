<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--sub:#6e6e73;--faint:#8e8e93;--line:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--acc:#007aff;--acc-soft:rgba(0,122,255,.12);
  --ok:#34c759;--ok-soft:rgba(52,199,89,.15);--warn:#ff9500;--warn-soft:rgba(255,149,0,.15);--bad:#ff3b30;--bad-soft:rgba(255,59,48,.12);--sheet:#f2f2f7;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--sub:#98989f;--faint:#8d8d93;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--acc:#0a84ff;--acc-soft:rgba(10,132,255,.2);--ok:#30d158;--ok-soft:rgba(48,209,88,.2);--warn:#ff9f0a;--warn-soft:rgba(255,159,10,.2);--bad:#ff453a;--bad-soft:rgba(255,69,58,.2);--sheet:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em;letter-spacing:0}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:var(--safe-t) 0 0}
header.sc{border-bottom:.5px solid var(--line)}
.hin{max-width:720px;margin:0 auto;padding:0 16px}
.nav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back{justify-self:start;color:var(--acc);font-size:17px;display:flex;visibility:hidden;align-items:center;gap:2px;margin-left:-6px;white-space:nowrap}
.back svg{flex:none}
.back.on{visibility:visible}
.ntitle{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;opacity:0;transition:opacity .15s}

.navr{justify-self:end;display:flex;gap:14px;align-items:center}
.who{color:var(--acc);font-size:16px;display:none;align-items:center;gap:4px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{color:var(--acc);display:none}
.add.on,.who.on{display:flex}
h1{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.sub{font-size:15px;color:var(--sub);margin-top:2px}
#tools{padding-bottom:8px}
.sbar{display:flex;gap:8px;margin-top:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:8px 10px 8px 32px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fbtn{flex:none;color:var(--acc);font-size:17px;display:flex;align-items:center;gap:6px}
.fbtn b{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:5px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:500}
.chip span{font-size:13px;opacity:.75}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
main{padding:8px 16px calc(var(--safe-b) + 40px);max-width:720px;margin:0 auto}
.gh{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.gf{font-size:13px;color:var(--sub);margin:7px 16px 0;line-height:1.45}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 16px;width:100%;text-align:left;min-height:46px;position:relative;text-decoration:none;color:inherit}
.row:active,.it:active{background:var(--fill)}

.row .rt{flex:1;min-width:0;font-size:17px}
.row .rv{color:var(--faint);font-size:17px}
.row.lock{opacity:.45}
.chev{color:#c4c4c7;flex:none}
.ic{width:32px;height:32px;border-radius:10px;background:linear-gradient(150deg,color-mix(in srgb,var(--c,#7d8a99) 8%,var(--card)),color-mix(in srgb,var(--c,#7d8a99) 24%,var(--card)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#7d8a99) 20%,transparent),0 1px 2px color-mix(in srgb,var(--c,#7d8a99) 18%,transparent);display:grid;place-items:center;flex:none;color:var(--c,#7d8a99)}

.sum b{display:block;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 16px 7px}

.tl{display:flex;gap:16px}
.sortsel{border:0;background:none;color:var(--acc);font-size:15px;-webkit-appearance:none;appearance:none;padding:0}
.list{background:var(--card);border-radius:12px;overflow:hidden}

.it .ic{margin-top:11px}

.it:last-child .bdw{border-bottom:0}
.it .bd{flex:1;min-width:0}
.it .t{font-size:17px;line-height:1.3;word-break:break-word}

.dlb{color:var(--acc);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc-soft)}

.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:var(--fill);color:var(--sub)}

.pill.g{background:var(--fill);color:var(--ink)}
.empty{text-align:center;color:var(--faint);padding:40px 10px}
.more{display:block;margin:14px auto;color:var(--acc);font-size:16px}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%) translateY(-20px);background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.15)}

.center{text-align:center;padding:60px 10px;color:var(--sub)}

.spin{width:24px;height:24px;border:2.5px solid var(--fill);border-top-color:var(--faint);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}

.hello{font-size:15px;color:var(--sub);margin:2px 4px 0}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

const fval=(F,r)=>F.get?F.get(r):(r[F.k]??'');
function filtered(key){
  const m=MODS[key],s=st(key);const q=s.q.trim().toLowerCase();
  let L=(DATA[key]||[]).filter(r=>{
    if(m.segs&&!segMatch(m,r,s.seg))return false;
    for(const [k,vs] of Object.entries(s.f)){if(!vs.length)continue;const F=m.filters.find(x=>x.k===k);if(!vs.includes(String(fval(F,r))))return false}
    if(q&&!m.search.map(k=>r[k]??'').join(' ').toLowerCase().replace(/-/g,'').includes(q.replace(/-/g,'')))return false;
    return true});
  const [fk,desc]=[s.sort.replace(/-$/,''),s.sort.endsWith('-')];
  L.sort((a,b)=>{let x=a[fk],y=b[fk];if(typeof x==='number'||typeof y==='number'){x=+x||0;y=+y||0;return desc?y-x:x-y}x=String(x??'');y=String(y??'');return desc?y.localeCompare(x,'th'):x.localeCompare(y,'th',{numeric:true})});
  return L;
}

  else{if(c!=null&&p!=null&&c+p+(f||0)!==t)w.push(`Copy+Printer+FAX = ${mtN(c+p+(f||0))} ไม่ตรงกับรวม`);if(co!=null&&bw!=null&&co+bw!==t)w.push('สี+ขาวดำ ไม่ตรงกับรวม');
    const r=(DATA.contracts||[]).find(x=>x._id===o.cid);const prev=r&&mtM(r).filter(x=>x.date<o.date).pop();if(prev&&t<(+prev.total||0))w.push(`น้อยกว่าครั้งก่อน (${mtN(prev.total)})`)}
  return w}
async function mtOcrWorker(){await loadLib(MT_LIB.tess,'Tesseract');const w=await Tesseract.createWorker('eng',1,{workerPath:MT_LIB.tw,corePath:MT_LIB.tc,langPath:MT_LIB.tl});await w.setParameters({tessedit_pageseg_mode:'4'});return w}
function mtRead(cid){let P=[],files=[];
  openSheet(`${shh('<button class="x" id="r_x">ยกเลิก</button>','อ่านค่ามิเตอร์','<button class="x b" id="r_s" disabled>บันทึก</button>')}
  <div class="sub" style="margin:4px 4px 0">แนบ Status Page ของเครื่องถ่ายเอกสาร / ปริ้นเตอร์ (PDF หลายหน้า หรือรูปถ่าย) ระบบจะอ่าน Serial วันที่ และ Counter ให้ แล้วตรวจตัวเลขก่อนบันทึก · ไฟล์จะแนบไว้กับค่ามิเตอร์เพื่อเปิดดูภายหลัง</div>
  <label class="mtdrop" id="r_d"><input type="file" id="r_f" accept="application/pdf,image/*" multiple hidden><b>เลือกไฟล์ / ถ่ายรูป</b><span>PDF, JPG, PNG · เลือกได้หลายไฟล์</span></label>
  <div id="r_p"></div><div id="r_l"></div>
  <button class="cta" id="r_s2" style="display:none;width:100%;margin-top:22px">บันทึกค่ามิเตอร์</button>`);
  $('r_x').onclick=()=>cid?mtDetail(cid):closeSheet();
  const prog=(msg,f)=>{$('r_p').innerHTML=msg?`<div class="mtprog">${msg}<div class="mtbar"><i style="width:${Math.round((f||0)*100)}%"></i></div></div>`:''};
  $('r_f').onchange=async e=>{files=[...e.target.files];if(!files.length)return;$('r_d').style.display='none';P=[];
    try{prog('กำลังเปิดไฟล์…',0);for(let fi=0;fi<files.length;fi++){const f=files[fi];const cs=await mtCanvases(f,mtIsPdf(f));cs.forEach(x=>P.push({fi,page:x.page,c:x.c,multi:cs.length>1}))}
      prog('กำลังโหลดตัวอ่านข้อความ (ครั้งแรกอาจใช้เวลาสักครู่)…',.03);const w=await mtOcrWorker();
      for(let i=0;i<P.length;i++){prog(`กำลังอ่านค่า หน้า ${i+1} / ${P.length}…`,(i+.2)/P.length);let o={};try{const{data}=await w.recognize(P[i].c);o=mtParse(data.text);P[i].txt=data.text}catch(err){o={}}
        if(cid&&P.length===1&&!o.cid)o.cid=cid;if(!o.date)o.date=today();P[i].o=o;P[i].on=true}
      await w.terminate();prog('');draw()}
    catch(err){prog('');$('r_d').style.display='';toast('อ่านไฟล์ไม่สำเร็จ: '+err.message)}};
  const opts=sel=>`<option value="">— เลือกเครื่อง —</option>${mtL().map(r=>`<option value="${esc(r._id)}" ${r._id===sel?'selected':''}>${esc(r.place||'')} · ${esc(r.serial||'')}</option>`).join('')}`;
  const fld=(i,k,l,cls='')=>`<label class="${cls}">${l}<input inputmode="numeric" data-i="${i}" data-k="${k}" value="${P[i].o[k]??''}"></label>`;
  const warn=i=>{const w=mtChk(P[i].o);return w.length?`<div class="mtw">⚠ ${w.map(esc).join(' · ')}</div>`:'<div class="mtw g">✓ ตัวเลขสอดคล้องกัน</div>'};
  function draw(){$('r_l').innerHTML=P.map((p,i)=>{const o=p.o;const r=(DATA.contracts||[]).find(x=>x._id===o.cid);const col=o.color!=null||(r&&mtM(r).some(mtHasC));return `<div class="mtpg ${p.on?'':'off'}" id="r_pg${i}"><div class="hd"><img class="th" data-z="${i}" src="${p.c.toDataURL('image/jpeg',.5)}" alt=""><div><div class="pn">${esc(files[p.fi].name)}${p.multi?` · หน้า ${p.page}`:''} · แตะรูปเพื่อขยาย</div><select data-i="${i}" data-k="cid">${opts(o.cid)}</select><input type="date" data-i="${i}" data-k="date" value="${esc(o.date||'')}"></div></div>
    <div class="mtgr">${fld(i,'copy','Copy')}${fld(i,'print','Printer')}${fld(i,'fax','FAX')}${fld(i,'total','รวม (Total)','tot')}${col?fld(i,'color','สี (Color)')+fld(i,'bw','ขาวดำ (B&W)'):''}</div>
    <div id="r_w${i}">${warn(i)}</div><label class="mtok"><input type="checkbox" data-on="${i}" ${p.on?'checked':''}>บันทึกหน้านี้</label></div>`}).join('');
    $('r_s').disabled=false;$('r_s2').style.display='block';
    $('r_l').querySelectorAll('[data-k]').forEach(el=>{el.oninput=el.onchange=()=>{const i=+el.dataset.i,k=el.dataset.k;let v=el.value.trim();if(!['cid','date'].includes(k))v=v===''?'':+v.replace(/[^\d]/g,'');P[i].o[k]=v;$('r_w'+i).innerHTML=warn(i);if(k==='cid'&&el.tagName==='SELECT')draw()}});
    $('r_l').querySelectorAll('[data-on]').forEach(el=>el.onchange=()=>{const i=+el.dataset.on;P[i].on=el.checked;$('r_pg'+i).classList.toggle('off',!el.checked)});
    $('r_l').querySelectorAll('[data-z]').forEach(el=>el.onclick=()=>{const keep=$('sheet').innerHTML;const y=$('sheet').scrollTop;mtZoom(P[+el.dataset.z].c.toDataURL('image/jpeg',.9),'Status Page',()=>{$('sheet').innerHTML=keep;draw();$('sheet').scrollTop=y;bind()})});}
  async function save(){const S=P.filter(p=>p.on);if(!S.length){toast('ไม่ได้เลือกหน้าที่จะบันทึก');return}
    const bad=S.find(p=>!p.o.cid||!p.o.date||p.o.total===''||p.o.total==null);if(bad){toast('กรอกเครื่อง วันที่ และค่ารวมให้ครบ');$('r_pg'+P.indexOf(bad)).scrollIntoView({behavior:'smooth',block:'center'});return}
    const ids=S.map(p=>p.o.cid);if(new Set(ids.map((x,i)=>x+S[i].o.date)).size!==ids.length){toast('มีเครื่องเดียวกันวันเดียวกันซ้ำ');return}
    $('r_s').disabled=true;$('r_s2').disabled=true;
    try{const up={};for(const p of S){if(!up[p.fi]){prog('กำลังแนบไฟล์…',.5);up[p.fi]=await mtUp(files[p.fi],p.o.date)}}
      let n=0;for(const p of S){prog(`กำลังบันทึก ${++n} / ${S.length}…`,n/S.length);const o=p.o;const r=DATA.contracts.find(x=>x._id===o.cid);const v=k=>o[k]===''||o[k]==null?'':+o[k];
        const x={date:o.date,copy:v('copy'),print:v('print'),fax:v('fax'),total:v('total'),file:{...up[p.fi],page:p.page},by:me,at:nowIso()};if(o.color!==''&&o.color!=null){x.color=v('color');x.bw=v('bw')}if(DEMO)x.file.data=up[p.fi].data;
        await store.save('contracts',{...r,model:r.model||o.model||'',meters:[...(r.meters||[]).filter(y=>y.date!==o.date),x]})}
      prog('');toast(`บันทึกค่ามิเตอร์ ${S.length} เครื่องแล้ว`);render();S.length===1?mtDetail(S[0].o.cid):closeSheet()}
    catch(e){prog('');$('r_s').disabled=$('r_s2').disabled=false;toast(e.status===403?'ไม่มีสิทธิ์บันทึก':'บันทึกไม่สำเร็จ: '+e.message)}}
  function bind(){$('r_x').onclick=()=>cid?mtDetail(cid):closeSheet();$('r_s').onclick=save;$('r_s2').onclick=save}
  bind()}
function mtAdd(cid){const r=(DATA.contracts||[]).find(x=>x._id===cid);if(!r)return;const c=mtLast(r)[0];const col=mtHasC(c);
  const f=(k,l,cls='')=>`<label class="${cls}">${l}<input inputmode="numeric" id="a_${k}" placeholder="0"></label>`;
  openSheet(`${shh('<button class="x" id="a_x">ยกเลิก</button>','กรอกค่ามิเตอร์','<button class="x b" id="a_s">บันทึก</button>')}
  <div class="sub" style="margin:4px 4px 0">${esc(r.place||'')} · Serial ${esc(r.serial||'')}</div>
  <div class="mtpg"><input type="date" id="a_date" value="${today()}" style="width:100%;font:inherit;font-size:16px;font-weight:700;border:0;background:var(--bg);border-radius:12px;padding:10px;box-sizing:border-box"><div class="mtgr">${f('copy','Copy')}${f('print','Printer')}${f('fax','FAX')}${f('total','รวม (Total)','tot')}${col?f('color','สี (Color)')+f('bw','ขาวดำ (B&W)'):''}</div>
  <label class="mtdrop" style="padding:14px"><input type="file" id="a_f" accept="application/pdf,image/*" hidden><b id="a_fn">แนบไฟล์ Status Page (ไม่บังคับ)</b><span>PDF หรือรูปถ่าย</span></label></div>`);
  $('a_x').onclick=()=>mtDetail(cid);$('a_f').onchange=e=>{$('a_fn').textContent=e.target.files[0]?e.target.files[0].name:'แนบไฟล์ Status Page (ไม่บังคับ)'};
  $('a_s').onclick=async()=>{const v=k=>$('a_'+k)?($('a_'+k).value.replace(/[^\d]/g,'')):'';const n=k=>v(k)===''?'':+v(k);const date=$('a_date').value;let t=n('total');
    if(t===''&&n('copy')!==''&&n('print')!=='')t=n('copy')+n('print')+(+n('fax')||0);if(!date||t===''){toast('ระบุวันที่และค่ารวม');return}
    $('a_s').disabled=true;try{const fl=$('a_f').files[0];const x={date,copy:n('copy'),print:n('print'),fax:n('fax'),total:t,by:me,at:nowIso()};if(col){x.color=n('color');x.bw=n('bw')}
      if(fl)x.file={...(await mtUp(fl,date)),page:1};const cur=DATA.contracts.find(y=>y._id===cid);
      await store.save('contracts',{...cur,meters:[...(cur.meters||[]).filter(y=>y.date!==date),x]});toast('บันทึกค่ามิเตอร์แล้ว');render();mtDetail(cid)}
    catch(e){$('a_s').disabled=false;toast(e.status===403?'ไม่มีสิทธิ์บันทึก':'บันทึกไม่สำเร็จ: '+e.message)}}}
async function mtXlsx(){await loadLib('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','ExcelJS');const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('ค่ามิเตอร์',{views:[{state:'frozen',ySplit:2}],pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  const H=['ที่ตั้ง','รุ่น','Serial','วันที่อ่าน','Copy','Printer','FAX','สี','ขาวดำ','รวม','ใช้ไปจากครั้งก่อน','บันทึกโดย'];
  ws.mergeCells(1,1,1,H.length);ws.getCell(1,1).value=`รายงานค่ามิเตอร์เครื่องถ่ายเอกสาร & ปริ้นเตอร์ · ณ ${thDate(today())}`;ws.getCell(1,1).font={bold:true,size:14};ws.getRow(1).height=24;
  ws.addRow(H);const hr=ws.getRow(2);hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1D1D1F'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true}});hr.height=30;
  for(const r of mtL()){const A=mtM(r);if(!A.length){ws.addRow([r.place,r.model||'',r.serial,'ยังไม่มีค่า']);continue}A.forEach((x,i)=>{const p=A[i-1];const n=v=>v===''||v==null?null:+v;ws.addRow([r.place,r.model||'',r.serial,x.date?new Date(x.date+'T00:00:00'):'',n(x.copy),n(x.print),n(x.fax),n(x.color),n(x.bw),n(x.total),p?(+x.total||0)-(+p.total||0):null,x.by||''])})}
  [22,18,15,13,12,12,9,12,12,13,15,18].forEach((w,i)=>ws.getColumn(i+1).width=w);ws.getColumn(4).numFmt='dd/mm/yyyy';[5,6,7,8,9,10,11].forEach(i=>ws.getColumn(i).numFmt='#,##0');
  ws.eachRow((row,i)=>{if(i<2)return;row.eachCell({includeEmpty:true},c=>{c.border={top:{style:'thin',color:{argb:'FFD2D2D7'}},bottom:{style:'thin',color:{argb:'FFD2D2D7'}},left:{style:'thin',color:{argb:'FFD2D2D7'}},right:{style:'thin',color:{argb:'FFD2D2D7'}}}});if(i>2){row.getCell(10).font={bold:true};row.getCell(11).font={color:{argb:'FF16A34A'},bold:true}}});
  ws.autoFilter={from:'A2',to:{row:2,column:H.length}};
  rpSaveFile(new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`ค่ามิเตอร์เครื่องถ่ายเอกสาร_${today()}.xlsx`)}

(async()=>{
