<style>

  --ok:#34c759;--ok-soft:rgba(52,199,89,.15);--warn:#ff9500;--warn-soft:rgba(255,149,0,.15);--bad:#ff3b30;--bad-soft:rgba(255,59,48,.12);--sheet:#f2f2f7;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--sub:#98989f;--faint:#8d8d93;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--acc:#0a84ff;--acc-soft:rgba(10,132,255,.2);--ok:#30d158;--ok-soft:rgba(48,209,88,.2);--warn:#ff9f0a;--warn-soft:rgba(255,159,10,.2);--bad:#ff453a;--bad-soft:rgba(255,69,58,.2);--sheet:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em;letter-spacing:0}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:var(--safe-t) 0 0}
header.sc{border-bottom:.5px solid var(--line)}
.hin{max-width:720px;margin:0 auto;padding:0 16px}
.nav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back{justify-self:start;color:var(--acc);font-size:17px;display:flex;visibility:hidden;align-items:center;gap:2px;margin-left:-6px;white-space:nowrap}
.back svg{flex:none}
.back.on{visibility:visible}
.ntitle{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;opacity:0;transition:opacity .15s}

.navr{justify-self:end;display:flex;gap:14px;align-items:center}
.who{color:var(--acc);font-size:16px;display:none;align-items:center;gap:4px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{color:var(--acc);display:none}
.add.on,.who.on{display:flex}
h1{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.sub{font-size:15px;color:var(--sub);margin-top:2px}
#tools{padding-bottom:8px}
.sbar{display:flex;gap:8px;margin-top:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:8px 10px 8px 32px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fbtn{flex:none;color:var(--acc);font-size:17px;display:flex;align-items:center;gap:6px}
.fbtn b{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:5px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:500}
.chip span{font-size:13px;opacity:.75}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
main{padding:8px 16px calc(var(--safe-b) + 40px);max-width:720px;margin:0 auto}
.gh{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.gf{font-size:13px;color:var(--sub);margin:7px 16px 0;line-height:1.45}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 16px;width:100%;text-align:left;min-height:46px;position:relative;text-decoration:none;color:inherit}
.row:active,.it:active{background:var(--fill)}
.row .rb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:11px 16px 11px 0;border-bottom:.5px solid var(--line);align-self:stretch}
.row:last-child .rb{border-bottom:0}
.row .rt{flex:1;min-width:0;font-size:17px}
.row .rv{color:var(--faint);font-size:17px}
.row.lock{opacity:.45}
.chev{color:#c4c4c7;flex:none}
.ic{width:32px;height:32px;border-radius:10px;background:linear-gradient(150deg,color-mix(in srgb,var(--c,#7d8a99) 8%,var(--card)),color-mix(in srgb,var(--c,#7d8a99) 24%,var(--card)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#7d8a99) 20%,transparent),0 1px 2px color-mix(in srgb,var(--c,#7d8a99) 18%,transparent);display:grid;place-items:center;flex:none;color:var(--c,#7d8a99)}
.ic svg{width:20px;height:20px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.sum div{background:var(--card);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--sub)}
.sum b{display:block;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 16px 7px}
.toolbar .cnt{font-size:13px;color:var(--sub);text-transform:uppercase}
.tl{display:flex;gap:16px}
.sortsel{border:0;background:none;color:var(--acc);font-size:15px;-webkit-appearance:none;appearance:none;padding:0}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.it{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:0 0 0 16px;cursor:pointer}
.it .ic{margin-top:11px}
.it .bdw{flex:1;min-width:0;display:flex;gap:10px;padding:10px 14px 10px 0;border-bottom:.5px solid var(--line)}
.it:last-child .bdw{border-bottom:0}
.it .bd{flex:1;min-width:0}
.it .t{font-size:17px;line-height:1.3;word-break:break-word}
.it .m{font-size:14px;color:var(--sub);margin-top:2px;word-break:break-word}
.it .r{flex:none;text-align:right;font-size:15px;color:var(--sub);display:flex;align-items:flex-start;gap:6px;padding-top:2px}
.it .r .chev{margin-top:2px}
.dlb{color:var(--acc);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc-soft)}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:var(--fill);color:var(--sub)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:500;text-decoration:none}
.pill svg{width:14px;height:14px}
.pill.g{background:var(--fill);color:var(--ink)}
.empty{text-align:center;color:var(--faint);padding:40px 10px}
.more{display:block;margin:14px auto;color:var(--acc);font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}

.kv{border-radius:12px;margin-top:14px;overflow:hidden}
.kv>div{display:flex;gap:10px;padding:11px 16px;align-items:center;position:relative}

.f{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:46px;position:relative}

.f.area{align-items:flex-start;flex-direction:column;gap:2px;padding:10px 16px}

.f input,.f select,.f textarea{border:0;background:none;padding:11px 0;font-size:17px;outline:none;width:100%;flex:1;min-width:0;text-align:left;-webkit-appearance:none;appearance:none}

.btnlist{border-radius:12px;overflow:hidden;margin-top:24px;background:var(--card)}

.btnlist .d{color:var(--bad)}
.opts{border-radius:12px;overflow:hidden}

.fgroup h3{font-size:13px;color:var(--sub);text-transform:uppercase;font-weight:400;margin:20px 16px 7px}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%) translateY(-20px);background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.toast.on{opacity:1;transform:translateX(-50%)}
.center{text-align:center;padding:60px 10px;color:var(--sub)}
.center .big{width:72px;height:72px;border-radius:22px;background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);display:grid;place-items:center;margin:0 auto}
.center .big svg{width:40px;height:40px}
.center h2{color:var(--ink);font-size:22px;margin:16px 0 6px}
.cta{display:inline-block;background:var(--acc);color:#fff;border-radius:12px;padding:14px 26px;font-weight:600;margin-top:22px;font-size:17px}
.pw{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:8px;padding:6px 10px;margin-top:8px}

.qr{display:grid;place-items:center;padding:18px;background:#fff;border-radius:12px;margin-top:14px}
.spin{width:24px;height:24px;border:2.5px solid var(--fill);border-top-color:var(--faint);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

.hello{font-size:15px;color:var(--sub);margin:2px 4px 0}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.wgrid{grid-template-columns:repeat(3,1fr)}main{max-width:900px}.hin{max-width:900px}}

.wd{background:var(--card);border-radius:18px;padding:14px 14px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:146px;transition:transform .12s}
.wd:active{transform:scale(.97)}
.wd.lock{opacity:.45}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.wd .ic{width:44px;height:44px;border-radius:14px}
.wd .ic svg{width:26px;height:26px}
.wt{font-size:15px;font-weight:600;line-height:1.3;color:var(--sub)}
.wn{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin-top:auto}

.ws{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.alert .ab{flex:1;min-width:0;display:flex;flex-direction:column}
.alert b{font-size:16px;font-weight:600}
.alert .ab span{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

   <div class="kv"><div><span class="k">หมวด</span><span class="v">${esc(r.folder||'ทั่วไป')}</span></div><div><span class="k">ขนาด</span><span class="v">${fsize(r.size)}</span></div><div><span class="k">อัปเดต</span><span class="v">${thDate(r.mod)}</span></div>${r.by?`<div><span class="k">โดย</span><span class="v">${esc(r.by)}</span></div>`:''}</div>
   <button class="cta" id="d_dl" style="display:block;width:100%;margin-top:18px">ดาวน์โหลด</button>
   <div class="btnlist">${r.web?`<button id="d_view">เปิดดูใน SharePoint</button>`:''}${canEdit(key)?`<button class="d" id="d_del">ลบไฟล์</button>`:''}</div>`);
  $('d_close').onclick=closeSheet;$('d_dl').onclick=()=>download(key,id);
  if($('d_view'))$('d_view').onclick=()=>window.open(r.web,'_blank');
  if($('d_del'))$('d_del').onclick=()=>{openSheet(`${shh('','ลบไฟล์','')}<p style="text-align:center;color:var(--sub);margin:8px 0">${esc(r.name)}<br>ไฟล์จะย้ายไปถังรีไซเคิลของ SharePoint</p><div class="btnlist"><button class="d" id="y" style="font-weight:600">ลบไฟล์</button><button id="n">ยกเลิก</button></div>`);$('n').onclick=()=>docDetail(key,id);$('y').onclick=async()=>{try{await store.delDoc(key,id);closeSheet();toast('ลบแล้ว');render()}catch(e){toast(e.status===403?'ไม่มีสิทธิ์ลบ':'ลบไม่สำเร็จ')}}};
}
function uploadSheet(key){
  const m=MODS[key];const seg=m.segs?st(key).seg:'';const cats=[...new Set((DATA[key]||[]).filter(x=>!seg||topOf(x)===seg).map(x=>seg?subOf(x):x.folder).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
  openSheet(`${shh(`<button class="x" id="u_x">ยกเลิก</button>`,seg?'อัปโหลด · '+esc(seg):'อัปโหลดเอกสาร',`<button class="x b" id="u_s" disabled>อัปโหลด</button>`)}
   <div class="formg"><label class="f" style="cursor:pointer"><span style="flex:1;color:var(--acc);padding:12px 0" id="u_lbl">เลือกไฟล์…</span><input type="file" id="u_f" multiple style="display:none"></label></div>
   <div class="gf">เลือกได้หลายไฟล์ · ไฟล์ชื่อซ้ำในหมวดเดียวกันจะถูกแทนที่ด้วยไฟล์ใหม่</div>
   <div class="formg"><div class="f"><label>หมวด</label><select id="u_c"><option value="">${seg?'ทั่วไป ('+esc(seg)+')':'ทั่วไป'}</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}<option value="__new">+ หมวดใหม่…</option></select></div><div class="f" id="u_nw" style="display:none"><label>ชื่อหมวดใหม่</label><input id="u_n" placeholder="เช่น ฝ่ายบัญชี"></div></div>
   <div class="gf" id="u_p"></div>`);
  const f=$('u_f');f.onchange=()=>{const n=f.files.length;$('u_lbl').textContent=n?[...f.files].map(x=>x.name).join(', '):'เลือกไฟล์…';$('u_s').disabled=!n};
  $('u_c').onchange=()=>{$('u_nw').style.display=$('u_c').value==='__new'?'':'none'};
  $('u_x').onclick=closeSheet;
  $('u_s').onclick=async()=>{let folder=$('u_c').value;if(folder==='__new'){folder=$('u_n').value.trim().replace(/[\\/:*?"<>|#%]/g,'-');if(!folder){toast('ใส่ชื่อหมวดใหม่');return}}
    if(seg)folder=folder?seg+' / '+folder:seg;
    const files=[...f.files];$('u_s').disabled=true;$('u_x').disabled=true;let ok=0;
    for(let i=0;i<files.length;i++){const fl=files[i];try{await store.upload(key,fl,folder,p=>{$('u_p').textContent=`กำลังอัปโหลด ${i+1}/${files.length}: ${fl.name} ${Math.round(p*100)}%`});ok++}catch(e){toast((e.status===403?'ไม่มีสิทธิ์อัปโหลด':e.message)+': '+fl.name)}}
    closeSheet();if(ok)toast(`อัปโหลดแล้ว ${ok} ไฟล์`);render()};
}

const ROLEM={};

  if(DEMO){CFG.roles.forEach((r,i)=>ROLEM[r.id]=ROLEM[r.id]||(i===0?[{id:'u1',displayName:'สมชาย ไอที',mail:'somchai@unb.co.th'}]:[]));return}
  await Promise.all(CFG.roles.map(async r=>{if(ROLEM[r.id]&&!force)return;let L=[],next=`/groups/${r.id}/members?$select=id,displayName,mail,userPrincipalName,jobTitle&$top=999`;while(next){const x=await ga(next.replace('https://graph.microsoft.com/v1.0',''));L=L.concat(x.value);next=x['@odata.nextLink']}ROLEM[r.id]=L.sort((a,b)=>String(a.displayName).localeCompare(String(b.displayName),'th'))}));

    <button class="row" data-addto="${esc(r.id)}"><span class="ic" style="--c:var(--acc)"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="rb"><span class="rt" style="color:var(--acc)">เพิ่มคนเข้ากลุ่มนี้</span></span></button></div>
    <div class="gf">${esc(r.desc)}</div>`}).join('')+`<div class="gh">ทุกคนในบริษัท</div><div class="group"><div class="row" style="cursor:default">${ico('building','#6c9a52')}<span class="rb"><span class="rt">พนักงานทั่วไป (อัตโนมัติ)</span></span></div></div><div class="gf">ทุกบัญชีของบริษัทดูเบอร์ติดต่อ IT และดาวน์โหลดเอกสารได้อยู่แล้ว ไม่ต้องเพิ่ม · เปลี่ยนสิทธิ์แล้วอาจใช้เวลาประมาณ 5–15 นาทีกว่าจะมีผล (ให้ผู้ใช้ออกจากระบบแล้วเข้าใหม่)</div>`;
}
function addSheet(gid){
  const r=CFG.roles.find(x=>x.id===gid);
  openSheet(`${shh(`<button class="x" id="a_x">ยกเลิก</button>`,'เพิ่มเข้า '+esc(r.name),'')}
   <div class="sbar"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="a_q" type="search" placeholder="พิมพ์ชื่อหรืออีเมล" autocomplete="off"></label></div>
   <div class="gf" id="a_h">พิมพ์อย่างน้อย 2 ตัวอักษร</div><div class="group" id="a_res" style="margin-top:8px"></div>`);

    $('a_h').textContent='กำลังค้นหา…';
    try{let L;if(DEMO)L=[{id:'d'+q,displayName:'ทดสอบ '+q,mail:q+'@unb.co.th'}];else{const x=await ga(`/users?$search=${encodeURIComponent(`"displayName:${q}" OR "mail:${q}"`)}&$select=id,displayName,mail,userPrincipalName,jobTitle&$top=20`,{headers:{ConsistencyLevel:'eventual'}});L=x.value}
      const have=new Set((ROLEM[gid]||[]).map(u=>u.id));
      $('a_h').textContent=L.length?'แตะชื่อเพื่อเพิ่ม':'ไม่พบผู้ใช้';
      $('a_res').innerHTML=L.map(u=>`<button class="row" data-pick="${esc(u.id)}" ${have.has(u.id)?'disabled style="opacity:.45"':''}>${ico('person','#7d8a99')}<span class="rb"><span class="rt" style="display:flex;flex-direction:column"><span>${esc(u.displayName)}</span><small style="color:var(--sub);font-size:13px">${esc(u.mail||u.userPrincipalName||'')}${have.has(u.id)?' · อยู่ในกลุ่มแล้ว':''}</small></span></span></button>`).join('');
      $('a_res').querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{const u=L.find(x=>x.id===b.dataset.pick);b.disabled=true;
        try{if(!DEMO)await ga(`/groups/${gid}/members/$ref`,{method:'POST',json:{'@odata.id':`https://graph.microsoft.com/v1.0/directoryObjects/${u.id}`}});(ROLEM[gid]=ROLEM[gid]||[]).push(u);closeSheet();toast(`เพิ่ม ${u.displayName} แล้ว`);render()}catch(e){b.disabled=false;toast(e.status===403?'ไม่มีสิทธิ์จัดการกลุ่มนี้':'เพิ่มไม่สำเร็จ: '+e.message)}});
    }catch(e){$('a_h').textContent='ค้นหาไม่สำเร็จ: '+e.message}},350)};
  setTimeout(()=>$('a_q').focus(),300);
}
function rmSheet(gid,uid,nm){
  const r=CFG.roles.find(x=>x.id===gid);
  openSheet(`${shh('','เอาออกจากกลุ่ม','')}<p style="text-align:center;color:var(--sub);margin:8px 0">เอา <b style="color:var(--ink)">${esc(nm)}</b> ออกจาก "${esc(r.name)}"?</p><div class="btnlist"><button class="d" id="y" style="font-weight:600">เอาออก</button><button id="n">ยกเลิก</button></div>`);
  $('n').onclick=closeSheet;$('y').onclick=async()=>{try{if(!DEMO)await ga(`/groups/${gid}/members/${uid}/$ref`,{method:'DELETE'});ROLEM[gid]=(ROLEM[gid]||[]).filter(u=>u.id!==uid);closeSheet();toast('เอาออกแล้ว');render()}catch(e){toast(e.status===403?'ไม่มีสิทธิ์จัดการกลุ่มนี้':'ไม่สำเร็จ: '+e.message)}};
}
function loadQR(){return window.qrcode?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';s.onload=()=>{qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];ok()};s.onerror=no;document.head.appendChild(s)})}
function edit(key,r){
  const m=MODS[key];r=r||{};const isNew=!r._id;
  const opts=k=>[...new Set((DATA[key]||[]).map(x=>x[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'th'));
  const dl=m.fields.filter(c=>c.t==='list').map(c=>`<datalist id="dl_${c.k}">${opts(c.k).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`).join('');
  const inp=c=>{const v=r[c.k]??(c.t==='select'?c.o[0][0]:'');
    if(c.t==='select')return `<select id="e_${c.k}">${c.o.map(([a,b])=>`<option value="${a}" ${a===v?'selected':''}>${b}</option>`).join('')}</select>`;
    if(c.t==='area')return `<textarea id="e_${c.k}" placeholder="${c.l}">${esc(v)}</textarea>`;
    const type=c.t==='date'?'date':c.t==='number'?'number':c.t==='email'?'email':c.t==='tel'?'tel':'text';
    return `<input id="e_${c.k}" type="${type}" placeholder="${c.t==='date'?'':'ระบุ'}" ${c.t==='number'?'inputmode="decimal" step="any"':''} ${c.t==='list'?`list="dl_${c.k}"`:''} ${c.t==='secret'?'autocapitalize="off" autocorrect="off" spellcheck="false" class="mono"':''} value="${esc(v)}">`};
  const main=m.fields.filter(c=>c.t!=='area'),areas=m.fields.filter(c=>c.t==='area');
  openSheet(`${shh(`<button class="x" id="e_x">ยกเลิก</button>`,isNew?'รายการใหม่':'แก้ไข',`<button class="x b" id="e_s">บันทึก</button>`)}
   <div class="formg">${main.map(c=>`<div class="f"><label>${c.l}</label>${inp(c)}</div>`).join('')}</div>
   ${areas.map(c=>`<div class="formg"><div class="f area"><label>${c.l}</label>${inp(c)}</div></div>`).join('')}${dl}`);
  $('e_x').onclick=()=>isNew?closeSheet():detail(key,r._id);
  $('e_s').onclick=async()=>{const d={...r};m.fields.forEach(c=>{let v=$('e_'+c.k).value.trim();if(c.t==='number')v=v===''?'':+v;d[c.k]=v});
    const first=m.fields[0].k==='g'?m.fields[1]:m.fields[0];if(!String(d[first.k]||'').trim()&&!String(d[m.fields[2]?.k]||'').trim()){toast('กรอก '+first.l+' ก่อน');return}
    if(isNew&&d.no==null&&(DATA[key]||[]).some(x=>x.no!=null))d.no=Math.max(0,...DATA[key].map(x=>+x.no||0))+1;
    $('e_s').disabled=true;
    try{await store.save(key,d);closeSheet();toast('บันทึกแล้ว');render()}catch(e){$('e_s').disabled=false;toast(e.status===403?'ไม่มีสิทธิ์แก้ไข':'บันทึกไม่สำเร็จ: '+e.message)}};
}
function filterSheet(key){
  const m=MODS[key],s=st(key);const draft=JSON.parse(JSON.stringify(s.f));
  const groups=m.filters.map(F=>{const cnt={};(DATA[key]||[]).forEach(r=>{const v=String(fval(F,r));cnt[v]=(cnt[v]||0)+1});
    let vals=Object.keys(cnt).sort((a,b)=>F.sort==='desc'?b.localeCompare(a):a.localeCompare(b,'th'));
    return `<div class="fgroup"><h3>${F.l}</h3><div class="opts">${vals.map(v=>`<label class="opt"><input type="checkbox" data-fk="${esc(F.k)}" value="${esc(v)}" ${(draft[F.k]||[]).includes(v)?'checked':''}><i>✓</i><span>${esc(F.fmt?F.fmt(v):v||'ไม่ระบุ')}</span><small class="num">${cnt[v]}</small></label>`).join('')}</div></div>`}).join('');
  openSheet(`${shh(`<button class="x" id="f_clr">ล้าง</button>`,'ตัวกรอง',`<button class="x b" id="f_ok">เสร็จ</button>`)}<div class="gf" style="margin-top:0">เลือกได้หลายอย่างในแต่ละหัวข้อ</div>${groups}`);
  $('f_clr').onclick=()=>{s.f={};closeSheet();s.lim=60;render()};
  $('f_ok').onclick=()=>{const f={};$('sheet').querySelectorAll('[data-fk]:checked').forEach(c=>(f[c.dataset.fk]=f[c.dataset.fk]||[]).push(c.value));s.f=f;s.lim=60;closeSheet();render()};
}

/* ===== Events ===== */
document.addEventListener('click',async ev=>{
  const t=ev.target;
  if(t.closest('[data-stop]'))return;
  if(t.closest('#login')){msal.loginRedirect({scopes:SCOPES,prompt:'select_account'});return}
  if(t.closest('#retry')){location.reload();return}
  const cp=t.closest('[data-copypw]');if(cp){ev.stopPropagation();const r=DATA.wifi.find(x=>x._id===cp.dataset.copypw);if(r)copy(r.password);return}
  const o=t.closest('[data-open]');if(o){go(o.dataset.open);return}
  const ce=t.closest('[data-cedit]');if(ce){const r=DATA.contacts.find(x=>x._id===ce.dataset.cedit);if(r)edit('contacts',r);return}const cd=t.closest('[data-cdet]');if(cd){detail('contacts',cd.dataset.cdet);return}const cv=t.closest('[data-cpv]');if(cv&&!t.closest('#sheet')){copy(cv.dataset.cpv);return}const ad=t.closest('[data-addto]');if(ad){addSheet(ad.dataset.addto);return}
  const rmv=t.closest('[data-rm]');if(rmv){rmSheet(rmv.dataset.rm,rmv.dataset.uid,rmv.dataset.nm);return}
  const fs=t.closest('[data-fseg]');if(fs){const s=st(view);s.seg=fs.dataset.fseg;s.f={};s.lim=60;render();return}
  const sg=t.closest('[data-seg]');if(sg){go(sg.dataset.seg,true);return}
  const db=t.closest('[data-dl]');if(db){ev.stopPropagation();download(db.dataset.dlk||view,db.dataset.dl);return}
  const hd=t.closest('.it[data-doc]');if(hd){docDetail(hd.dataset.doc,hd.dataset.id);return}
  const it=t.closest('.it[data-id]');if(it){(MODS[view].kind==='docs'?docDetail:detail)(view,it.dataset.id);return}
  const rm=t.closest('[data-rmf]');if(rm){const s=st(view);s.f[rm.dataset.rmf]=(s.f[rm.dataset.rmf]||[]).filter(v=>v!==rm.dataset.v);render();return}
  if(t.closest('#fopen')){filterSheet(view);return}
});
$('back').onclick=()=>{history.length>1&&location.hash?history.back():go('home')};
$('fab').onclick=()=>MODS[view].kind==='docs'?uploadSheet(view):edit(view,null);
$('who').onclick=()=>{openSheet(`${shh('','บัญชี',`<button class="x b" id="w_x">เสร็จ</button>`)}<div class="kv"><div><span class="k">ชื่อ</span><span class="v">${esc(me)}</span></div><div><span class="k">สิทธิ์</span><span class="v">${roleName()}</span></div></div><div class="btnlist"><button class="d" id="w_out">ออกจากระบบ</button></div>`);$('w_x').onclick=closeSheet;$('w_out').onclick=()=>{if(DEMO){location.href=location.pathname}else msal.logoutRedirect({account})}};
async function go(key,replace){
  if(key==='access'?!isAdmin:(key!=='home'&&!lists[MODS[key].list])){toast('ไม่มีสิทธิ์เข้าถึง');return}
  view=key;const h=key==='home'?'':'#'+key;if(location.hash!==h)history[replace?'replaceState':'pushState'](null,'',location.pathname+location.search+h);
  window.scrollTo(0,0);render();
  if(key!=='home'&&key!=='access'&&!DATA[key]){try{await ensure(key);if(view===key)render()}catch(e){toast('โหลดไม่สำเร็จ: '+e.message)}}
}
window.addEventListener('popstate',()=>{const k=location.hash.slice(1);view=MODS[k]?k:'home';closeSheet();render();if(view!=='home')ensure(view).then(()=>render()).catch(()=>{})});

/* ===== Start ===== */
(async()=>{
  try{
    if(DEMO){me=isIT?'ทีม IT (ทดลอง)':'ทดลอง';}
    else{
      if(!window.msal)throw new Error('โหลดระบบเข้าสู่ระบบของ Microsoft ไม่ได้');
      msal=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
      await msal.initialize();const res=await msal.handleRedirectPromise();
      account=(res&&res.account)||msal.getAllAccounts()[0]||null;
      if(!account){mode='signin';render();return}
      me=account.name||account.username;
    }
    await store.connect();
    isAdmin=false;
    if(DEMO)me=isIT?'ทีม IT (ทดลอง)':'พนักงาน (ทดลอง)';
    $('who').innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="3.4" fill="currentColor"/><path d="M5.5 18.5a7.5 7.5 0 0 1 13 0" fill="currentColor"/></svg>${esc(me.split(' ')[0])}`;
    mode='ready';const k=location.hash.slice(1);
    if(k==='access'&&isAdmin)view=k;else if(MODS[k]&&lists[MODS[k].list])view=k;else if(!isIT&&lists['IT Contacts']&&!location.hash)view='home';
    render();
    if(view!=='home')await ensure(view).then(render);
    await Promise.all([...HOME,'contracts',...DOCS].filter(k=>lists[MODS[k].list]).map(k=>ensure(k).catch(()=>{})));if(view==='home')render();
  }catch(e){mode='err';errMsg=(e.status?('Graph '+e.status+' '):'')+(e.message||e);render()}
})();
