<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--sub:#6e6e73;--faint:#8e8e93;--line:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--acc:#007aff;--acc-soft:rgba(0,122,255,.12);
  --ok:#34c759;--ok-soft:rgba(52,199,89,.15);--warn:#ff9500;--warn-soft:rgba(255,149,0,.15);--bad:#ff3b30;--bad-soft:rgba(255,59,48,.12);--sheet:#f2f2f7;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

.num,.mono{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:var(--safe-t) 0 0}
header.sc{border-bottom:.5px solid var(--line)}
.hin{max-width:720px;margin:0 auto;padding:0 16px}
.nav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back{justify-self:start;color:var(--acc);font-size:17px;display:flex;visibility:hidden;align-items:center;gap:2px;margin-left:-6px;white-space:nowrap}

.who{color:var(--acc);font-size:16px;display:none;align-items:center;gap:4px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{color:var(--acc);display:none}
.add.on,.who.on{display:flex}
h1{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.sub{font-size:15px;color:var(--sub);margin-top:2px}
#tools{padding-bottom:8px}
.sbar{display:flex;gap:8px;margin-top:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:8px 10px 8px 32px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}

.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fbtn{flex:none;color:var(--acc);font-size:17px;display:flex;align-items:center;gap:6px}
.fbtn b{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}

.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
main{padding:8px 16px calc(var(--safe-b) + 40px);max-width:720px;margin:0 auto}
.gh{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.gf{font-size:13px;color:var(--sub);margin:7px 16px 0;line-height:1.45}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 16px;width:100%;text-align:left;min-height:46px;position:relative;text-decoration:none;color:inherit}

.hello{font-size:15px;color:var(--sub);margin:2px 4px 0}

function renderList(){

  M.innerHTML=`${sum}<div class="toolbar"><span class="cnt">${L.length.toLocaleString()} รายการ</span><span class="tl"><select class="sortsel" id="sort">${m.sorts.map(([v,l])=>`<option value="${v}" ${v===s.sort?'selected':''}>${l}</option>`).join('')}</select>${m.kind==='docs'?'':'<button class="sortsel" id="csv">ส่งออก</button>'}</span></div>
  <div class="${m.layout==='cards'?'ccards':'list'}">${L.slice(0,s.lim).map(m.layout==='cards'?contactCard:row).join('')||'<div class="empty">ไม่พบรายการ</div>'}</div>

function exportCsv(key,L){

  const csv='﻿'+[cols.map(c=>cell(c.l)).join(','),...L.map(r=>cols.map(c=>cell(c.t==='select'?((c.o.find(o=>o[0]===r[c.k])||[])[1]||r[c.k]):r[c.k])).join(','))].join('\r\n');

const SHC={};const MIME={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xls:'application/vnd.ms-excel',xlsm:'application/vnd.ms-excel.sheet.macroEnabled.12',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',ppt:'application/vnd.ms-powerpoint',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',txt:'text/plain',csv:'text/csv',zip:'application/zip'};const SHP={};function prepShare(key,id){if(SHC[id])return Promise.resolve(SHC[id]);if(SHP[id])return SHP[id];return SHP[id]=(async()=>{const r=DATA[key].find(x=>x._id===id);const u=await store.dlUrl(key,id);const x=await fetch(u);if(!x.ok)throw new Error('HTTP '+x.status);const b=await x.blob();return SHC[id]=new File([b],r.name,{type:MIME[r.ext]||b.type||'application/octet-stream'})})().finally(()=>{delete SHP[id]})}document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-sh]');if(b&&navigator.canShare)prepShare(b.dataset.shk||view,b.dataset.sh).catch(()=>{})},{passive:true});async function shareDoc(key,id,btn){const r=DATA[key].find(x=>x._id===id);if(!r)return;const big=btn.id==='d_sh',lbl='แชร์ไปยังแอปอื่น';if(!navigator.share){try{await navigator.clipboard.writeText(r.web||location.href);toast('อุปกรณ์นี้แชร์ไฟล์ไม่ได้ · คัดลอกลิงก์ SharePoint ให้แล้ว')}catch(e){toast('อุปกรณ์นี้ไม่รองรับการแชร์')}return}let f=SHC[id];if(!f){btn.disabled=true;if(big)btn.textContent='กำลังเตรียมไฟล์…';else{btn.style.opacity='.45';toast('กำลังเตรียมไฟล์…')}try{f=await prepShare(key,id)}catch(e){toast('เตรียมไฟล์ไม่สำเร็จ: '+e.message);return}finally{btn.disabled=false;btn.style.opacity='';if(big)btn.textContent=lbl}}try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:r.name});else await navigator.share({title:r.name,url:r.web||location.href})}catch(e){if(e.name==='AbortError')return;if(e.name==='NotAllowedError'){if(big)btn.textContent='ไฟล์พร้อมแล้ว · แตะอีกครั้งเพื่อแชร์';else toast('ไฟล์พร้อมแล้ว · แตะไอคอนแชร์อีกครั้ง');return}toast('แชร์ไม่สำเร็จ: '+e.message)}}

document.addEventListener('click',async ev=>{
  const t=ev.target;
  if(t.closest('[data-stop]'))return;
  if(t.closest('#login')){msal.loginRedirect({scopes:SCOPES,prompt:'select_account'});return}
  if(t.closest('#retry')){location.reload();return}
  const cp=t.closest('[data-copypw]');if(cp){ev.stopPropagation();const r=DATA.wifi.find(x=>x._id===cp.dataset.copypw);if(r)copy(r.password);return}
  const o=t.closest('[data-open]');if(o){go(o.dataset.open);return}
  const ce=t.closest('[data-cedit]');if(ce){const r=DATA.contacts.find(x=>x._id===ce.dataset.cedit);if(r)edit('contacts',r);return}const cd=t.closest('[data-cdet]');if(cd){detail('contacts',cd.dataset.cdet);return}const cv=t.closest('[data-cpv]');if(cv&&!t.closest('#sheet')){copy(cv.dataset.cpv);return}const ad=t.closest('[data-addto]');if(ad){addSheet(ad.dataset.addto);return}
  const rmv=t.closest('[data-rm]');if(rmv){rmSheet(rmv.dataset.rm,rmv.dataset.uid,rmv.dataset.nm);return}
  const fs=t.closest('[data-fseg]');if(fs){const s=st(view);s.seg=fs.dataset.fseg;s.f={};s.lim=60;render();return}
  const sg=t.closest('[data-seg]');if(sg){go(sg.dataset.seg,true);return}
  const sb=t.closest('[data-sh]');if(sb){ev.stopPropagation();shareDoc(sb.dataset.shk||view,sb.dataset.sh,sb);return}const db=t.closest('[data-dl]');if(db){ev.stopPropagation();download(db.dataset.dlk||view,db.dataset.dl);return}
  const hd=t.closest('.it[data-doc]');if(hd){docDetail(hd.dataset.doc,hd.dataset.id);return}
  const it=t.closest('.it[data-id]');if(it){(MODS[view].kind==='docs'?docDetail:detail)(view,it.dataset.id);return}
  const rm=t.closest('[data-rmf]');if(rm){const s=st(view);s.f[rm.dataset.rmf]=(s.f[rm.dataset.rmf]||[]).filter(v=>v!==rm.dataset.v);render();return}
  if(t.closest('#fopen')){filterSheet(view);return}
});

async function rpShrink(f){try{const b=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(x=>ok(x||f),'image/jpeg',.82))}catch(e){return f}}

function kpSvg(v,t,w=640,h=200){const P=26,bw=(w-P-6)/12;const y=x=>h-22-(Math.min(x,1.05)/1.05)*(h-40);let s=`<svg viewBox="0 0 ${w} ${h}">`;
  [0,.25,.5,.75,1].forEach(g=>{s+=`<line x1="${P}" x2="${w-4}" y1="${y(g)}" y2="${y(g)}" stroke="#8e8e93" stroke-opacity=".18"/><text x="${P-4}" y="${y(g)+3.5}" font-size="9" fill="#8e8e93" text-anchor="end">${g*100}</text>`});
  v.forEach((x,i)=>{const cx=P+bw*i+bw/2;if(x!=null){const ok=x>=t;s+=`<rect x="${cx-bw*.3}" y="${y(x)}" width="${bw*.6}" height="${h-22-y(x)}" rx="3" fill="${ok?'#30d158':'#ff453a'}"/><text x="${cx}" y="${y(x)-4}" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor">${Math.round(x*100)}%</text>`}
    s+=`<text x="${cx}" y="${h-7}" font-size="10" text-anchor="middle" fill="#8e8e93">${KP_MON[i]}</text>`});
  s+=`<line x1="${P}" x2="${w-4}" y1="${y(t)}" y2="${y(t)}" stroke="#ff9f0a" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${w-6}" y="${y(t)-4}" font-size="10" font-weight="700" fill="#ff9f0a" text-anchor="end">เป้า ${Math.round(t*100)}%</text></svg>`;return s}

  if($('r_back'))$('r_back').onclick=()=>rpSendBack(r);
  const delf=async(msg)=>{try{await store.del('repair',r._id);closeSheet();render();toast(msg)}catch(e){toast(e.status===403?'ไม่มีสิทธิ์ลบ':'ลบไม่สำเร็จ: '+e.message)}};
  if($('r_cancel'))$('r_cancel').onclick=()=>{if(confirm('ยกเลิกการแจ้งซ่อม '+(r.no||'')+' ?'))delf('ยกเลิกการแจ้งซ่อมแล้ว')};
  if($('r_del'))$('r_del').onclick=()=>{if(confirm('ลบรายการ '+(r.no||'')+' ถาวร?'))delf('ลบแล้ว')};
};

/* ---- VPN: ตัดกล่องสรุปที่ซ้ำกับปุ่มกรอง ---- */
renderVpn=function(){const M=$('main');if(!DATA.vpn){M.innerHTML='<div class="center"><div class="spin"></div></div>';return}
  const all=vpList(),L=all.filter(vpFilter),it=isIT;
  const card=r=>`<div class="it rpit" role="button" data-vid="${esc(r._id)}">${ico('shield','#5b6bbf')}<div class="bdw"><div class="bd"><div class="t"><b>${esc(r.no||'กำลังออกเลข…')}</b> · ${esc(r.name||'')}</div><div class="m rpsym">${esc(vpSysTxt(r))}${r.purpose?' — '+esc(r.purpose):''}</div><div class="m">${esc([VP_UT.find(u=>u[0]===r.utype)?.[1],r.company||r.dept].filter(Boolean).join(' · '))} · ${thDate(r.start)}${r.end?' – '+thDate(r.end):''}${r.uname?` · <span class="mono">${esc(r.uname)}</span>`:''}</div><div class="acts">${vpBadge(r)}</div></div><span class="r" style="padding-top:3px">${CHEV}</span></div></div>`;
  M.innerHTML=`${!it&&!all.length?`<div class="rpempty"><div class="big">${ico('shield','#5b6bbf')}</div><b>ยังไม่มีคำขอใช้ VPN</b><span>กดปุ่ม “ขอใช้ VPN” ด้านล่าง<br>กรอกแบบฟอร์ม FM-ITM-01-10 ออนไลน์ได้เลย</span></div>`:''}
  ${all.length?`<div class="toolbar"><span class="cnt">${L.length} รายการ</span></div>${L.length?`<div class="list">${L.map(card).join('')}</div>`:'<div class="empty">ไม่มีรายการในหมวดนี้</div>'}`:''}`};

/* ===== Start ===== */
(async()=>{
  try{
    if(DEMO){me=isIT?'ทีม IT (ทดลอง)':'ทดลอง';}
    else{
      if(!window.msal)throw new Error('โหลดระบบเข้าสู่ระบบของ Microsoft ไม่ได้');
      msal=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
      await msal.initialize();const res=await msal.handleRedirectPromise();
      account=(res&&res.account)||msal.getAllAccounts()[0]||null;
      if(!account){mode='signin';render();return}
      me=account.name||account.username;
    }
    await store.connect();
    isAdmin=isIT;spPermInit();
    if(DEMO)me=isIT?'ทีม IT (ทดลอง)':'พนักงาน (ทดลอง)';
    $('who').innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="3.4" fill="currentColor"/><path d="M5.5 18.5a7.5 7.5 0 0 1 13 0" fill="currentColor"/></svg>${esc(me.split(' ')[0])}`;
    mode='ready';const k=location.hash.slice(1);
    if(k==='access'&&isAdmin)view=k;else if(MODS[k]&&lists[MODS[k].list])view=k;else if(!isIT&&lists['IT Contacts']&&!location.hash)view='home';
    render();
    if(view!=='home')await ensure(view).then(render);
    await Promise.all([...HOME,'contracts',...DOCS].filter(k=>lists[MODS[k].list]).map(k=>ensure(k).catch(()=>{})));if(view==='home')render();
  }catch(e){mode='err';errMsg=(e.status?('Graph '+e.status+' '):'')+(e.message||e);render()}
})();
