<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT Portal">
<meta name="theme-color" content="#f5f6f8">
<title>IT Portal · UNB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2430;--sub:#6b7280;--faint:#9aa1ad;--line:#e8eaee;--acc:#4f6bed;--acc-soft:#eef1fe;--ok:#1f9d55;--ok-soft:#e6f6ec;--warn:#c07a00;--warn-soft:#fff4dc;--bad:#d64545;--bad-soft:#fdecec;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c1f25;--ink:#e9ebef;--sub:#a3a9b4;--faint:#727985;--line:#2a2e36;--acc:#8ea2ff;--acc-soft:#232a45;--ok:#4cc38a;--ok-soft:#173326;--warn:#f0b84d;--warn-soft:#3a2f14;--bad:#f07b7b;--bad-soft:#3b1d1d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Inter",-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
.num,.mono{font-family:"Inter",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.mono{letter-spacing:.01em}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(var(--safe-t) + 14px) 16px 10px}
.hin{max-width:760px;margin:0 auto}
.hrow{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);display:none;place-items:center;font-size:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);flex:none}
.back.on{display:grid}
h1{flex:1;margin:0;font-size:23px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{flex:none;background:var(--card);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--sub);max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sub{font-size:12.5px;color:var(--faint);margin-top:2px}
.sbar{display:flex;gap:8px;margin-top:10px}
.search{flex:1;position:relative}
.search input{width:100%;border:0;background:var(--card);border-radius:14px;padding:11px 14px 11px 38px;font-size:16px;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.search input:focus{box-shadow:0 0 0 2px var(--acc)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fbtn{flex:none;background:var(--card);border-radius:14px;padding:0 13px;font-size:14px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.fbtn.on{background:var(--acc);color:#fff}
.fbtn b{background:#fff;color:var(--acc);border-radius:999px;font-size:11.5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:4px 8px 4px 12px;font-size:13px;font-weight:600}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-top:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.seg button{flex:1;padding:7px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--acc);color:#fff}
main{padding:6px 16px calc(var(--safe-b) + 90px);max-width:760px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:20px;padding:18px 16px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px;min-height:132px;position:relative}
.tile .ic{font-size:30px;line-height:1}
.tile .tt{font-weight:700;font-size:16.5px;line-height:1.3}
.tile .ds{font-size:12.5px;color:var(--sub)}
.tile .ct{position:absolute;top:14px;right:14px;font-size:13px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:2px 9px}
.tile.lock{opacity:.5}
.note{background:var(--card);border-radius:16px;padding:14px 16px;font-size:13.5px;color:var(--sub);margin-top:14px;line-height:1.6}
.sum{display:flex;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.sum div{background:var(--card);border-radius:14px;padding:9px 13px;font-size:12.5px;color:var(--sub);flex:1;min-width:120px}
.sum b{display:block;font-size:17px;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--card);border-radius:16px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.it .ic{font-size:24px;line-height:1.2;flex:none;width:30px;text-align:center}
.it .bd{flex:1;min-width:0}
.it .t{font-weight:600;font-size:15.5px;line-height:1.35;word-break:break-word}
.it .m{font-size:13px;color:var(--sub);margin-top:2px;word-break:break-word}
.it .r{flex:none;text-align:right;font-size:14px;font-weight:600}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:var(--line);color:var(--sub)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--acc-soft);color:var(--acc);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;text-decoration:none}
.pill.g{background:var(--line);color:var(--ink)}
.empty{text-align:center;color:var(--faint);padding:40px 10px}
.more{display:block;margin:12px auto;background:var(--card);border-radius:12px;padding:9px 18px;font-weight:600;color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(var(--safe-b) + 20px);width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-size:30px;display:none;place-items:center;box-shadow:0 6px 18px rgba(79,107,237,.35);z-index:15}
.fab.on{display:grid}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 18px calc(var(--safe-b) + 22px);transform:translateY(105%);transition:.25s;z-index:31;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:19px;line-height:1.35}
.kv{background:var(--card);border-radius:16px;margin-top:12px;overflow:hidden}
.kv>div{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
.kv>div:first-child{border-top:0}
.kv .k{width:34%;flex:none;font-size:13px;color:var(--sub)}
.kv .v{flex:1;min-width:0;word-break:break-word;font-size:15px}
.cp{flex:none;font-size:12.5px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:8px;padding:4px 9px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--sub);font-weight:600}
.f input,.f select,.f textarea{border:0;background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{box-shadow:0 0 0 2px var(--acc)}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;background:var(--card);border-radius:14px;padding:13px;font-weight:600;text-align:center}
.btn.p{background:var(--acc);color:#fff}
.btn.d{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:12px;text-align:left}
.opt input{width:20px;height:20px;accent-color:var(--acc)}
.opt span{flex:1}
.opt small{color:var(--faint)}
.fgroup h3{font-size:14px;color:var(--sub);margin:16px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%) translateY(20px);background:#222;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.center{text-align:center;padding:50px 10px;color:var(--sub)}
.center .big{font-size:44px}
.center h2{color:var(--ink);font-size:19px;margin:10px 0 4px}
.cta{display:inline-block;background:var(--acc);color:#fff;border-radius:14px;padding:13px 22px;font-weight:600;margin-top:16px}
.pw{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:7px 10px;margin-top:8px}
.pw .v{flex:1;min-width:0;word-break:break-all;font-size:15px}
.qr{display:grid;place-items:center;padding:16px;background:#fff;border-radius:16px;margin-top:12px}
.sortsel{border:0;background:var(--card);border-radius:12px;padding:8px 10px;font-size:14px;color:var(--sub);font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 8px}
.toolbar .cnt{font-size:13px;color:var(--sub)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="hrow"><button class="back" id="back" aria-label="กลับ">‹</button><h1 id="title">IT Portal</h1><button class="who" id="who" style="display:none"></button></div>
  <div class="sub" id="sub">Union Belt International · ฝ่าย IT</div>
  <div id="tools"></div>
</div></header>
<main id="main"><div class="center"><div class="spin"></div></div></main>
<button class="fab" id="fab" aria-label="เพิ่ม">+</button>
<div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>
<script>
if(location.protocol==='file:'){location.replace('https://surawat1411199729978.github.io/itportal/');}
/* ===== ตั้งค่า ===== */
const CFG={
  clientId:"73241ae0-9aa1-49fe-b2c7-caa2449a0091",
  tenantId:"410b700e-bb2a-46d2-b4c0-449aec007d0e",
  siteUrl:"https://unboffice.sharepoint.com/sites/ITPortal",
  cctvUrl:"https://surawat1411199729978.github.io/cctv/"
};
const SCOPES=['User.Read','Sites.ReadWrite.All'];
const DEMO=new URLSearchParams(location.search).has('demo');

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=s=>{if(!s)return '';const [y,m,d]=String(s).split('-').map(Number);if(!y)return esc(s);return `${d?d+' ':''}${m?TH_M[m-1]+' ':''}${y+543}`};
const money=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const daysTo=s=>{if(!s)return null;return Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
async function copy(v){try{await navigator.clipboard.writeText(v);toast('คัดลอกแล้ว')}catch(e){const a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('คัดลอกแล้ว')}}
const phones=s=>String(s||'').split('/').map(x=>x.trim()).filter(Boolean).map(l=>{const m=l.match(/[0-9][0-9\- ]{2,}[0-9]/);const tel=m?m[0].replace(/[^0-9]/g,''):'';const ext=(l.match(/(ต่อ|กด)\s*([0-9]+)/)||[])[2];return {label:l,tel:tel+(ext?','+ext:'')}});

/* ===== โมดูล ===== */
const ICON={'ซอฟต์แวร์':'💿','คอมพิวเตอร์ / โน้ตบุ๊ก / แท็บเล็ต':'💻','เซิร์ฟเวอร์ / Storage':'🗄️','เครื่องพิมพ์ / สแกนเนอร์ / ถ่ายเอกสาร':'🖨️','ระบบเครือข่าย':'🌐','โทรศัพท์ / สื่อสาร':'📱','กล้องวงจรปิด / CCTV':'📹','จอภาพ / โปรเจคเตอร์':'🖥️','GPS / อุปกรณ์ติดตาม':'📍'};
const MODS={
 assets:{list:'IT Assets',title:'สินทรัพย์ IT',icon:'💻',desc:'อุปกรณ์และซอฟต์แวร์ของบริษัท',
  titleOf:r=>`${r.code||''} ${r.name||''}`.trim(),
  fields:[{k:'g',l:'กลุ่ม',t:'select',o:[['hw','อุปกรณ์ IT'],['sw','ซอฟต์แวร์']]},{k:'code',l:'รหัสทรัพย์สิน'},{k:'name',l:'ชื่อรายการ',full:1},{k:'type',l:'ประเภท',t:'list'},{k:'date',l:'วันที่ซื้อ',t:'date'},{k:'cost',l:'ราคา (บาท)',t:'number'},{k:'qty',l:'จำนวน',t:'number'},{k:'unit',l:'หน่วย'},{k:'dept',l:'แผนก',t:'list'},{k:'loc',l:'ผู้ขาย / ที่มา',t:'list'},{k:'doc',l:'เลขที่เอกสาร'},{k:'note',l:'หมายเหตุ',t:'area',full:1}],
  filters:[{k:'g',l:'กลุ่ม',fmt:v=>v==='sw'?'ซอฟต์แวร์':'อุปกรณ์ IT'},{k:'type',l:'ประเภท'},{k:'dept',l:'แผนก'},{k:'loc',l:'ผู้ขาย / ที่มา'},{k:'year',l:'ปีที่ซื้อ',get:r=>r.date?String(+r.date.slice(0,4)+543):'',sort:'desc'}],
  sorts:[['date-','ซื้อล่าสุด'],['date','ซื้อเก่าสุด'],['cost-','ราคาสูง→ต่ำ'],['code','รหัส']],
  search:['code','name','type','dept','loc','doc','note'],
  summary:L=>[[L.length.toLocaleString(),'รายการ'],[money(L.reduce((a,r)=>a+(+r.cost||0),0)),'มูลค่ารวม (บาท)']],
  card:r=>`<div class="ic">${r.g==='sw'?'💿':(ICON[r.type]||'🔧')}</div><div class="bd"><div class="t">${esc(r.name)}</div><div class="m"><span class="mono">${esc(r.code)}</span> · ${esc(r.dept||'-')} · ${thDate(r.date)}</div><div class="m">${esc(r.type||'')}</div></div><div class="r num">${r.cost?money(r.cost):''}</div>`},
 contacts:{list:'IT Contacts',title:'เบอร์ติดต่อ IT',icon:'📞',desc:'ผู้ให้บริการและผู้ติดต่อ',pub:1,
  titleOf:r=>r.company,
  fields:[{k:'company',l:'บริษัท / ผู้ให้บริการ',full:1,t:'list'},{k:'contact',l:'ผู้ติดต่อ'},{k:'topic',l:'เรื่อง / บริการ'},{k:'phone',l:'เบอร์โทร (หลายเบอร์คั่นด้วย /)',full:1,t:'tel'},{k:'email',l:'อีเมล',full:1,t:'email'},{k:'note',l:'หมายเหตุ',t:'area',full:1}],
  filters:[{k:'company',l:'บริษัท'}],sorts:[['no','ลำดับ'],['company','บริษัท ก-ฮ']],
  search:['company','contact','topic','phone','email','note'],
  card:r=>`<div class="ic">🏢</div><div class="bd"><div class="t">${esc(r.company)}</div><div class="m">${esc([r.contact,r.topic].filter(Boolean).join(' · ')||'-')}</div><div class="acts">${phones(r.phone).map(p=>`<a class="pill" href="tel:${esc(p.tel)}" data-stop>📞 <span class="mono">${esc(p.label)}</span></a>`).join('')}${r.email?`<a class="pill g" href="mailto:${esc(r.email)}" data-stop>✉️ ${esc(r.email)}</a>`:''}</div></div>`},
 software:{list:'Software Licenses',title:'Software Assets',icon:'💿',desc:'ไลเซนส์ซอฟต์แวร์และ Serial',
  titleOf:r=>r.product,
  fields:[{k:'product',l:'ชื่อซอฟต์แวร์',full:1,t:'list'},{k:'serial',l:'Serial / License Key',full:1,t:'secret'},{k:'computer',l:'เครื่องที่ติดตั้ง'},{k:'qty',l:'จำนวน',t:'number'},{k:'type',l:'ประเภทไลเซนส์',t:'list'},{k:'service',l:'บริการ',t:'list'},{k:'status',l:'สถานะ',t:'list'},{k:'date',l:'วันที่ / วันหมดอายุ',t:'date'},{k:'note',l:'หมายเหตุ',t:'area',full:1}],
  filters:[{k:'product',l:'ซอฟต์แวร์'},{k:'status',l:'สถานะ'},{k:'type',l:'ประเภทไลเซนส์'}],sorts:[['no','ลำดับ'],['product','ชื่อ'],['date-','วันที่ล่าสุด']],
  search:['product','serial','computer','type','status','note'],
  card:r=>`<div class="ic">💿</div><div class="bd"><div class="t">${esc(r.product)}</div><div class="m">${esc(r.computer||'ไม่ระบุเครื่อง')} · ${esc(r.type||'')}${r.qty>1?' · '+r.qty+' ไลเซนส์':''}</div><div class="m mono">${esc(r.serial)}</div></div><div class="r"><span class="badge ${/expire/i.test(r.status)?'b-bad':'b-ok'}">${esc(r.status||'-')}</span></div>`},
 copier:{list:'Copier Users',title:'เครื่องถ่ายเอกสาร & ปริ้นเตอร์',icon:'🖨️',desc:'รหัสผู้ใช้และสัญญาเช่า',
  titleOf:r=>`${r.code} ${r.user}`,
  fields:[{k:'code',l:'รหัสผู้ใช้'},{k:'name',l:'ชื่อบัญชี'},{k:'user',l:'ผู้ใช้'},{k:'room',l:'ห้อง / แผนก',t:'list'},{k:'status',l:'สถานะ',t:'select',o:[['use','ใช้งาน'],['left','ลาออก / ยกเลิก']]},{k:'note',l:'หมายเหตุ',t:'area',full:1}],
  filters:[{k:'room',l:'ห้อง / แผนก'},{k:'status',l:'สถานะ',fmt:v=>v==='left'?'ลาออก / ยกเลิก':'ใช้งาน'}],sorts:[['code','รหัส'],['room','ห้อง']],
  search:['code','name','user','room','note'],
  card:r=>`<div class="ic">👤</div><div class="bd"><div class="t">${esc(r.user||'-')}</div><div class="m">รหัส <b class="mono">${esc(r.code)}</b> · ${esc(r.name||'')} · ${esc(r.room||'')}</div></div><div class="r"><span class="badge ${r.status==='left'?'b-mute':'b-ok'}">${r.status==='left'?'ลาออก':'ใช้งาน'}</span></div>`,
  sub:'contracts'},

let msal=null,account=null,siteId='',lists={},isIT=false,me='';

async function token(){
  try{return (await msal.acquireTokenSilent({scopes:SCOPES,account})).accessToken}
  catch(e){await msal.acquireTokenRedirect({scopes:SCOPES,account});throw e}
}
async function g(path,opt={}){
  const t=await token();const headers={Authorization:'Bearer '+t,...(opt.headers||{})};let body;
  if(opt.json){headers['Content-Type']='application/json';body=JSON.stringify(opt.json)}
  const r=await fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{method:opt.method||'GET',headers,body});
  if(!r.ok){let b='';try{b=await r.text()}catch(_){};let m='';try{m=JSON.parse(b).error.message}catch(_){};const err=new Error((opt.method||'GET')+' '+path.split('?')[0]+(m?' : '+m:''));err.status=r.status;throw err}
  return r.status===204?null:r.json();
}

    while(next){const r=await g(next);r.value.forEach(it=>{let d={};try{d=JSON.parse(it.fields.Data||'{}')}catch(e){}rows.push({...d,_id:it.id})});next=r['@odata.nextLink']}

const fval=(F,r)=>F.get?F.get(r):(r[F.k]??'');
function filtered(key){
  const m=MODS[key],s=st(key);const q=s.q.trim().toLowerCase();
  let L=(DATA[key]||[]).filter(r=>{
    for(const [k,vs] of Object.entries(s.f)){if(!vs.length)continue;const F=m.filters.find(x=>x.k===k);if(!vs.includes(String(fval(F,r))))return false}
    if(q&&!m.search.map(k=>r[k]??'').join(' ').toLowerCase().replace(/-/g,'').includes(q.replace(/-/g,'')))return false;
    return true});
  const [fk,desc]=[s.sort.replace(/-$/,''),s.sort.endsWith('-')];
  L.sort((a,b)=>{let x=a[fk],y=b[fk];if(typeof x==='number'||typeof y==='number'){x=+x||0;y=+y||0;return desc?y-x:x-y}x=String(x??'');y=String(y??'');return desc?y.localeCompare(x,'th'):x.localeCompare(y,'th',{numeric:true})});
  return L;
}

function filterSheet(key){
  const m=MODS[key],s=st(key);const draft=JSON.parse(JSON.stringify(s.f));
  const groups=m.filters.map(F=>{const cnt={};(DATA[key]||[]).forEach(r=>{const v=String(fval(F,r));cnt[v]=(cnt[v]||0)+1});
    let vals=Object.keys(cnt).sort((a,b)=>F.sort==='desc'?b.localeCompare(a):a.localeCompare(b,'th'));
    return `<div class="fgroup"><h3>${F.l}</h3><div class="opts">${vals.map(v=>`<label class="opt"><input type="checkbox" data-fk="${esc(F.k)}" value="${esc(v)}" ${(draft[F.k]||[]).includes(v)?'checked':''}><span>${esc(F.fmt?F.fmt(v):v||'ไม่ระบุ')}</span><small class="num">${cnt[v]}</small></label>`).join('')}</div></div>`}).join('');
  openSheet(`<h2>ตัวกรอง · เลือกได้หลายอย่าง</h2>${groups}<div class="btns" style="position:sticky;bottom:0;background:var(--bg);padding-top:8px"><button class="btn" id="f_clr">ล้างทั้งหมด</button><button class="btn p" id="f_ok">ใช้ตัวกรอง</button></div>`);
  $('f_clr').onclick=()=>{s.f={};closeSheet();s.lim=60;render()};
  $('f_ok').onclick=()=>{const f={};$('sheet').querySelectorAll('[data-fk]:checked').forEach(c=>(f[c.dataset.fk]=f[c.dataset.fk]||[]).push(c.value));s.f=f;s.lim=60;closeSheet();render()};
}

/* ===== Events ===== */
document.addEventListener('click',async ev=>{
  const t=ev.target;
  if(t.closest('[data-stop]'))return;
  if(t.closest('#login')){msal.loginRedirect({scopes:SCOPES,prompt:'select_account'});return}
  if(t.closest('#retry')){location.reload();return}
  const cp=t.closest('[data-copypw]');if(cp){ev.stopPropagation();const r=DATA.wifi.find(x=>x._id===cp.dataset.copypw);if(r)copy(r.password);return}
  const o=t.closest('[data-open]');if(o){go(o.dataset.open);return}
  const sg=t.closest('[data-seg]');if(sg){go(sg.dataset.seg,true);return}
  const it=t.closest('.it[data-id]');if(it){detail(view,it.dataset.id);return}
  const rm=t.closest('[data-rmf]');if(rm){const s=st(view);s.f[rm.dataset.rmf]=(s.f[rm.dataset.rmf]||[]).filter(v=>v!==rm.dataset.v);render();return}
  if(t.closest('#fopen')){filterSheet(view);return}
});
$('back').onclick=()=>{history.length>1&&location.hash?history.back():go('home')};
$('fab').onclick=()=>edit(view,null);
$('who').onclick=()=>openSheet(`<h2>${esc(me)}</h2><p style="color:var(--sub);margin:4px 0 0">${isIT?'ทีม IT · แก้ไขข้อมูลได้':'พนักงาน · ดูเบอร์ติดต่อ IT'}</p><div class="btns"><button class="btn" id="w_x">ปิด</button><button class="btn d" id="w_out">ออกจากระบบ</button></div>`)||($('w_x').onclick=closeSheet,$('w_out').onclick=()=>{if(DEMO){location.href=location.pathname}else msal.logoutRedirect({account})});
async function go(key,replace){
  if(key!=='home'&&!lists[MODS[key].list]){toast('ไม่มีสิทธิ์เข้าถึง');return}
  view=key;const h=key==='home'?'':'#'+key;if(location.hash!==h)history[replace?'replaceState':'pushState'](null,'',location.pathname+location.search+h);
  window.scrollTo(0,0);render();
  if(key!=='home'&&!DATA[key]){try{await ensure(key);if(view===key)render()}catch(e){toast('โหลดไม่สำเร็จ: '+e.message)}}
}
window.addEventListener('popstate',()=>{const k=location.hash.slice(1);view=MODS[k]?k:'home';closeSheet();render();if(view!=='home')ensure(view).then(()=>render()).catch(()=>{})});

/* ===== Start ===== */
(async()=>{
  try{
    if(DEMO){me=isIT?'ทีม IT (ทดลอง)':'ทดลอง';}
    else{
      if(!window.msal)throw new Error('โหลดระบบเข้าสู่ระบบของ Microsoft ไม่ได้');
      msal=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
      await msal.initialize();const res=await msal.handleRedirectPromise();
      account=(res&&res.account)||msal.getAllAccounts()[0]||null;
      if(!account){mode='signin';render();return}
      me=account.name||account.username;
    }
    await store.connect();
    if(DEMO)me=isIT?'ทีม IT (ทดลอง)':'พนักงาน (ทดลอง)';
    $('who').style.display='';$('who').textContent='👤 '+me;
    mode='ready';const k=location.hash.slice(1);
    if(MODS[k]&&lists[MODS[k].list])view=k;else if(!isIT&&lists['IT Contacts']&&!location.hash)view='home';
    render();
    if(view!=='home')await ensure(view).then(render);
    await Promise.all(HOME.filter(k=>lists[MODS[k].list]).map(k=>ensure(k).catch(()=>{})));if(view==='home')render();
  }catch(e){mode='err';errMsg=(e.status?('Graph '+e.status+' '):'')+(e.message||e);render()}
})();
</script>
</body></html>
